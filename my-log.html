const SUPABASE_URL = "https://eevepkakuotqowkpblfj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldmVwa2FrdW90cW93a3BibGZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNjAwOTcsImV4cCI6MjEwMjgzNjA5N30.7ffh2NRJcx2WZfN5aYHUEYzsYaucSZJnIeLd9-uTZAo";

let sb = null;
const params = new URLSearchParams(window.location.search);
const COMPANY_ID = params.get('c');
let phone = '';
let pin = '';
let mode = 'login'; // login | records
let errorMsg = '';
let myData = null;

function app() { return document.getElementById('app'); }

function waitForSupabaseThenStart(attemptsLeft) {
  if (window.supabase && window.supabase.createClient) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    render();
    return;
  }
  if (attemptsLeft <= 0) {
    app().innerHTML = '<div class="bg-white rounded-2xl p-6 text-center shadow-sm mt-10"><p class="text-red-600">Could not load. Check your connection and reload.</p></div>';
    return;
  }
  setTimeout(() => waitForSupabaseThenStart(attemptsLeft - 1), 300);
}

function render() {
  if (!COMPANY_ID) {
    app().innerHTML = '<div class="bg-white rounded-2xl p-6 text-center shadow-sm mt-10"><p class="text-gray-700">This link is missing your company code. Ask your admin for the correct link.</p></div>';
    return;
  }
  if (mode === 'login') { renderLogin(); return; }
  renderRecords();
}

function renderLogin() {
  app().innerHTML = `
    <div class="text-center mt-10 mb-4"><img src="${LOGO_DATA_URI}" class="h-16 mx-auto" alt="Logo"></div>
    <div class="bg-white rounded-2xl p-6 shadow-sm">
      <h1 class="text-lg font-bold text-[#0d2a4d] mb-1 text-center">My Attendance &amp; Pay Records</h1>
      <p class="text-xs text-gray-500 mb-4 text-center">Enter your phone and PIN to view your own history.</p>
      <input id="phoneInput" type="tel" inputmode="numeric" placeholder="Phone number" class="w-full border rounded-xl px-4 py-3 mb-3">
      <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" class="w-full border rounded-xl px-4 py-3 mb-3">
      ${errorMsg ? '<p class="text-red-600 text-sm mb-3">' + errorMsg + '</p>' : ''}
      <button id="viewBtn" class="w-full bg-[#0d2a4d] text-white rounded-xl py-3 font-medium">View My Records</button>
    </div>`;
  document.getElementById('viewBtn').onclick = viewRecords;
}

async function viewRecords() {
  errorMsg = '';
  phone = document.getElementById('phoneInput').value.trim();
  pin = document.getElementById('pinInput').value.trim();
  if (!phone || pin.length !== 4) { errorMsg = 'Enter your phone and 4-digit PIN.'; render(); return; }

  const { data, error } = await sb.rpc('staff_view_my_log', { p_company_id: COMPANY_ID, p_phone: phone, p_pin: pin });
  if (error) { errorMsg = 'Something went wrong. Try again.'; render(); return; }
  if (!data.ok) { errorMsg = data.error; render(); return; }

  myData = data;
  mode = 'records';
  render();
}

function statusColor(status) {
  if (status === 'PRESENT') return 'bg-green-100 text-green-800';
  if (status === 'LATE') return 'bg-orange-100 text-orange-800';
  if (status === 'SICK') return 'bg-purple-100 text-purple-800';
  if (status === 'OFF') return 'bg-gray-200 text-gray-700';
  return 'bg-red-100 text-red-800';
}

function renderRecords() {
  const attRows = (myData.attendance || []).map(a => `
    <tr class="border-b text-sm">
      <td class="py-2 px-2">${a.work_date}</td>
      <td class="py-2 px-2"><span class="px-2 py-0.5 rounded text-xs font-semibold ${statusColor(a.status)}">${a.status}</span></td>
      <td class="py-2 px-2">${a.check_in_time ? new Date(a.check_in_time).toLocaleTimeString() : '&mdash;'}</td>
      <td class="py-2 px-2">${a.check_out_time ? new Date(a.check_out_time).toLocaleTimeString() : '&mdash;'}</td>
      <td class="py-2 px-2">${a.hours_worked != null ? a.hours_worked + 'h' : '&mdash;'}</td>
    </tr>`).join('');

  const payRows = (myData.payroll || []).map(p => `
    <tr class="border-b text-sm">
      <td class="py-2 px-2">${p.period_start} &rarr; ${p.period_end}</td>
      <td class="py-2 px-2">GHS ${Number(p.gross_pay).toFixed(2)}</td>
      <td class="py-2 px-2 text-red-600">-GHS ${Number(p.total_deductions).toFixed(2)}</td>
      <td class="py-2 px-2 font-semibold">GHS ${Number(p.net_pay).toFixed(2)}</td>
    </tr>`).join('');

  app().innerHTML = `
    <div class="flex justify-between items-center mt-6 mb-4">
      <img src="${LOGO_DATA_URI}" class="h-10" alt="Logo">
      <button id="logoutBtn" class="text-sm text-gray-500">Log out</button>
    </div>
    <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
      <p class="font-semibold">${myData.name}</p>
      ${myData.staff_code ? '<p class="text-xs text-gray-400">' + myData.staff_code + '</p>' : ''}
    </div>

    <div class="rounded-t-2xl bg-[#1e3a8a] text-white font-bold px-4 py-2 text-sm">MY ATTENDANCE (last 60 days)</div>
    <div class="bg-white rounded-b-2xl shadow-sm overflow-x-auto mb-4">
      <table class="w-full text-left">
        <thead><tr class="bg-cyan-50 text-gray-700 text-xs"><th class="py-2 px-2">Date</th><th class="py-2 px-2">Status</th><th class="py-2 px-2">In</th><th class="py-2 px-2">Out</th><th class="py-2 px-2">Hours</th></tr></thead>
        <tbody>${attRows || '<tr><td class="py-4 px-2 text-gray-400" colspan="5">No records yet.</td></tr>'}</tbody>
      </table>
    </div>

    <div class="rounded-t-2xl bg-[#6d28d9] text-white font-bold px-4 py-2 text-sm">MY PAY HISTORY</div>
    <div class="bg-white rounded-b-2xl shadow-sm overflow-x-auto mb-6">
      <table class="w-full text-left">
        <thead><tr class="bg-cyan-50 text-gray-700 text-xs"><th class="py-2 px-2">Period</th><th class="py-2 px-2">Gross</th><th class="py-2 px-2">Deductions</th><th class="py-2 px-2">Net Pay</th></tr></thead>
        <tbody>${payRows || '<tr><td class="py-4 px-2 text-gray-400" colspan="4">No payroll history yet.</td></tr>'}</tbody>
      </table>
    </div>
    <p class="text-xs text-gray-400 text-center pb-6">Keep this for your own records &mdash; useful if you ever need to check your history against your employer&#39;s.</p>
  `;
  document.getElementById('logoutBtn').onclick = () => { mode = 'login'; phone = ''; pin = ''; myData = null; render(); };
}

waitForSupabaseThenStart(20);
</script>
</body>
</html>
