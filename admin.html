<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metosync — Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="theme.css">
<script src="shared.js"></script>
<style>
  .cycleStatusBtn { cursor: pointer; transition: opacity 160ms ease; }
  .cycleStatusBtn:hover { opacity: 0.75; }
</style>
</head>
<body class="min-h-screen" style="background: var(--mt-bg);">
<div id="app" class="max-w-4xl mx-auto p-4"><p class="text-gray-400 text-center mt-10">Loading…</p></div>
<script>
let session = null;
let myProfile = null;
let myCompany = null;
let errorMsg = '';
let activeTab = 'staff';
let sites = [];
let staffList = [];
let capturedLat = null;
let capturedLng = null;
let gpsStatus = '';
let staffPayType = 'daily';
let staffCountry = '';
let staffTypeSelected = 'permanent';
let casualPinEnabled = false;
let customFields = [];
let attendanceDate = new Date().toISOString().slice(0, 10);
let attendanceStatus = 'present';

function app() { return document.getElementById('app'); }

async function init() {
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) await loadProfile();
  render();
}

async function loadProfile() {
  const { data: profile } = await sb.from('admin_users').select('*').eq('id', session.user.id).maybeSingle();
  myProfile = profile;
  if (myProfile) {
    const { data: company } = await sb.from('companies').select('*').eq('id', myProfile.company_id).maybeSingle();
    myCompany = company;
  }
}

function render() {
  if (!session || activeTab !== 'attendance') clearAttendanceAutoRefresh();
  if (!session) return renderLogin();
  if (!myProfile) return renderNoCompany();
  renderDashboard();
}

function renderLogin() {
  app().innerHTML = `
    <div class="text-center mt-10 mb-6 mt-fade-in">
      <img src="metosync-logo.png" class="h-20 mx-auto mb-3 drop-shadow-lg" alt="Metosync">
      <h1 class="text-xl font-bold" style="color: var(--mt-green-dark);">Company Admin Login</h1>
    </div>
    <div class="mt-card p-6 max-w-sm mx-auto mt-fade-in">
      <input id="email" type="email" autocomplete="off" placeholder="Email" class="w-full border rounded-xl px-4 py-3 mb-3">
      <div class="relative mb-3">
        <input id="password" type="password" autocomplete="off" placeholder="Password" class="w-full border rounded-xl px-4 py-3 pr-10">
        <button type="button" onclick="toggleEye('password',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">👁</button>
      </div>
      ${errorMsg ? `<p class="text-red-600 text-sm mb-3">${errorMsg}</p>` : ''}
      <button id="loginBtn" class="w-full mt-btn-primary">Log In</button>
    </div>`;
  document.getElementById('loginBtn').onclick = async () => {
    errorMsg = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { errorMsg = error.message; render(); return; }
    session = data.session;
    await loadProfile();
    render();
  };
  app().querySelectorAll('input').forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
  });
  setTimeout(() => {
    const e1 = document.getElementById('email'), e2 = document.getElementById('password');
    if (e1) e1.value = ''; if (e2) e2.value = '';
  }, 50);
}

function renderNoCompany() {
  app().innerHTML = `
    <div class="mt-card text-center p-6 mt-10 max-w-md mx-auto">
      <p class="text-gray-600 mb-3">This account isn't linked to a company yet.</p>
      <button id="logoutBtn" class="mt-btn-outline">Log out</button>
    </div>`;
  document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); session = null; myProfile = null; render(); };
}

function renderDashboard() {
    const plan = myCompany.service_plan || 'both';
  const tabs = [
    { id: 'staff', label: 'Staff' },
    { id: 'sites', label: 'Sites' },
    plan !== 'payroll' ? { id: 'attendance', label: 'Attendance' } : null,
    plan !== 'attendance' ? { id: 'payroll', label: 'Payroll' } : null,
    plan !== 'attendance' ? { id: 'payroll-history', label: 'Payroll History' } : null,
    { id: 'settings', label: 'Settings' },
    { id: 'contact', label: 'Contact & Support' },
  ].filter(Boolean);

  app().innerHTML = `
    <div class="mt-header rounded-2xl px-5 py-4 flex justify-between items-center mb-4 mt-4">
      <div class="flex items-center gap-3">
        ${myCompany.logo_url ? `<img src="${myCompany.logo_url}" alt="${myCompany.name} logo" class="w-12 h-12 rounded-xl object-contain bg-white p-1">` : ''}
        <div>
        <h1 class="text-lg font-bold">Welcome, ${myCompany.name}</h1>
        <p class="text-xs opacity-80 font-mono">${myCompany.org_code}</p>
        </div>
      </div>
      <button id="logoutBtn" class="text-sm text-white/90 hover:text-white">Log out</button>
    </div>
    <div class="flex flex-wrap gap-1 mb-4 mt-card p-1">
      ${tabs.map(t => `<button class="tabBtn mt-tab ${activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('')}
    </div>
    <div id="tabContent"><p class="text-gray-400 text-center mt-10">Loading…</p></div>`;

  document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); session = null; myProfile = null; render(); };
  document.querySelectorAll('.tabBtn').forEach(btn => {
    btn.onclick = () => { activeTab = btn.dataset.tab; renderTabContent(); };
  });
  renderTabContent();
}

async function renderTabContent() {
  const el = document.getElementById('tabContent');
  document.querySelectorAll('.tabBtn').forEach(btn => {
    btn.className = `tabBtn mt-tab ${btn.dataset.tab === activeTab ? 'active' : ''}`;
  });

  if (activeTab === 'sites') return renderSites(el);
  if (activeTab === 'staff') return renderStaff(el);
  if (activeTab === 'attendance') return renderAttendance(el);
  clearAttendanceAutoRefresh();

  el.innerHTML = `<div class="mt-card p-6 mt-fade-in"><p class="text-gray-400 text-center">— content comes next —</p></div>`;
}

// ===== SITES =====

async function renderSites(el) {
  el.innerHTML = `<p class="text-gray-400 text-center mt-6">Loading sites…</p>`;
  const { data, error } = await sb.from('sites').select('*').order('country').order('created_at', { ascending: false });
  if (error) { el.innerHTML = `<p class="text-red-600 text-center mt-6">${error.message}</p>`; return; }
  sites = data;

  const byCountry = {};
  sites.forEach(s => {
    const key = s.country || 'No country set';
    if (!byCountry[key]) byCountry[key] = [];
    byCountry[key].push(s);
  });

  const groupsHtml = Object.keys(byCountry).sort().map(country => `
    <div class="mb-4">
      <h3 class="text-sm font-bold mb-1" style="color: var(--mt-green-dark);">${country}</h3>
      <div class="border rounded-xl divide-y" style="border-color: var(--mt-border);">
        ${byCountry[country].map(s => `
          <div class="flex justify-between items-center px-3 py-2">
            <div>
              <p class="text-sm font-medium">${s.name}</p>
              ${s.address ? `<p class="text-xs text-gray-500">${s.address}</p>` : ''}
              ${s.latitude != null ? `<a href="https://www.google.com/maps?q=${s.latitude},${s.longitude}" target="_blank" class="text-xs text-blue-600">📍 View on Map</a>` : `<p class="text-xs text-gray-400">No GPS captured</p>`}
            </div>
            <button class="deleteSiteBtn mt-icon-btn delete" data-id="${s.id}">🗑</button>
          </div>`).join('')}
      </div>
    </div>`).join('');

  el.innerHTML = `
    <div class="mt-card p-4 mb-4 mt-fade-in">
      <h2 class="font-medium mb-3">Add Site</h2>

      <label class="text-xs font-medium text-gray-500">Step 1. Country</label>
      <input id="siteCountry" list="countryDatalist" autocomplete="off" placeholder="Type or select a country" class="w-full border rounded-lg px-3 py-2 text-sm mb-3">
      <datalist id="countryDatalist">${COUNTRIES.map(c => `<option value="${c}">`).join('')}</datalist>

      <label class="text-xs font-medium text-gray-500">Step 2. Site Name</label>
      <input id="siteName" autocomplete="off" placeholder="e.g. Nima" class="w-full border rounded-lg px-3 py-2 text-sm mb-3">

      <label class="text-xs font-medium text-gray-500">Address (optional)</label>
      <input id="siteAddress" autocomplete="off" placeholder="Address" class="w-full border rounded-lg px-3 py-2 text-sm mb-3">

      <label class="text-xs font-medium text-gray-500">GPS Location (optional, for check-in verification)</label>
      <div class="flex items-center gap-2 mb-3">
                <button id="captureGpsBtn" type="button" class="mt-btn-outline">📍 Capture GPS</button>
        <span id="gpsStatusWrap" class="text-xs ${capturedLat ? 'text-green-700' : 'text-red-600'}">${gpsStatus}</span>
      </div>

      ${errorMsg ? `<p class="text-red-600 text-sm mb-2">${errorMsg}</p>` : ''}
      <button id="addSiteBtn" type="button" class="mt-btn-primary">Add Site</button>
    </div>

    <div class="mt-card p-4 mt-fade-in">
      <h2 class="font-medium mb-3">Sites by Country</h2>
      ${groupsHtml || '<p class="text-gray-400 text-sm">No sites yet.</p>'}
    </div>`;

    function updateGpsStatusDisplay() {
    const wrap = document.getElementById('gpsStatusWrap');
    if (wrap) wrap.textContent = gpsStatus;
    if (wrap) wrap.className = `text-xs ${capturedLat ? 'text-green-700' : 'text-red-600'}`;
  }

  document.getElementById('captureGpsBtn').onclick = () => {
    if (!navigator.geolocation) { gpsStatus = '❌ GPS not supported on this device/browser.'; updateGpsStatusDisplay(); return; }
    gpsStatus = 'Capturing…'; updateGpsStatusDisplay();
    navigator.geolocation.getCurrentPosition(
      (pos) => { capturedLat = pos.coords.latitude; capturedLng = pos.coords.longitude; gpsStatus = `✅ Captured: ${capturedLat.toFixed(5)}, ${capturedLng.toFixed(5)}`; updateGpsStatusDisplay(); },
      (err) => { capturedLat = null; capturedLng = null; gpsStatus = '❌ Could not get location — ' + err.message; updateGpsStatusDisplay(); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  document.getElementById('addSiteBtn').onclick = async () => {
    errorMsg = '';
    const country = document.getElementById('siteCountry').value.trim();
    const name = document.getElementById('siteName').value.trim();
    const address = document.getElementById('siteAddress').value.trim();
    if (!country) { errorMsg = 'Country is required (Step 1).'; renderSites(el); return; }
    if (!name) { errorMsg = 'Site name is required (Step 2).'; renderSites(el); return; }
        const { error } = await sb.rpc('add_site', { p_site: { name, country, address: address || null, latitude: capturedLat, longitude: capturedLng } });
    if (error) { errorMsg = error.message; renderSites(el); return; }
    capturedLat = null; capturedLng = null; gpsStatus = '';
    renderSites(el);
  };

  document.querySelectorAll('.deleteSiteBtn').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Delete this site? This cannot be undone.')) return;
      const { error } = await sb.rpc('delete_site', { p_site_id: btn.dataset.id });
      if (error) { errorMsg = error.message; }
      renderSites(el);
    };
  });

  app().querySelectorAll('#siteCountry, #siteName, #siteAddress').forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('addSiteBtn').click(); });
  });
}

// ===== STAFF =====

function showFormError(msg) {
  errorMsg = msg;
  let errEl = document.getElementById('addStaffError');
  if (!errEl) {
    errEl = document.createElement('p');
    errEl.id = 'addStaffError';
    errEl.className = 'text-red-600 text-sm mt-2';
    document.getElementById('addStaffBtn').insertAdjacentElement('beforebegin', errEl);
  }
  errEl.textContent = msg;
}

function statusBadge(status) {
  const labelMap = { active: 'Active', on_leave: 'On Leave', inactive: 'Inactive', pending: 'Pending' };
  return `<span class="mt-badge ${status}">${labelMap[status] || status}</span>`;
}

function customFieldsHtml() {
  return customFields.map((f, i) => `
    <div class="flex gap-2 items-center mb-2">
      <input class="cfLabel border rounded-lg px-3 py-2 text-sm flex-1" data-i="${i}" placeholder="e.g. Start Date" value="${f.label}">
      <input class="cfValue border rounded-lg px-3 py-2 text-sm flex-1" data-i="${i}" placeholder="e.g. 23rd August, 2026" value="${f.value}">
      <button type="button" class="cfRemoveBtn text-red-600 text-sm px-1" data-i="${i}">✕</button>
    </div>`).join('');
}

async function renderStaff(el) {
  el.innerHTML = `<p class="text-gray-400 text-center mt-6">Loading staff…</p>`;
  const [{ data: sitesData, error: sitesErr }, { data: staffData, error: staffErr }] = await Promise.all([
    sb.from('sites').select('*').order('country'),
    sb.from('staff').select('*, sites(name, country)').order('created_at', { ascending: false })
  ]);
  if (sitesErr) { el.innerHTML = `<p class="text-red-600 text-center mt-6">${sitesErr.message}</p>`; return; }
  if (staffErr) { el.innerHTML = `<p class="text-red-600 text-center mt-6">${staffErr.message}</p>`; return; }
  sites = sitesData;
  staffList = staffData;

  const countries = [...new Set(sites.map(s => s.country).filter(Boolean))].sort();
  if (!staffCountry && countries.length) staffCountry = countries[0];
  const countryOptions = countries.map(c => `<option value="${c}" ${c === staffCountry ? 'selected' : ''}>${c}</option>`).join('');
  const filteredSites = sites.filter(s => s.country === staffCountry);
  const siteOptions = filteredSites.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  const currencyOptions = CURRENCIES.map(c => `<option value="${c}">${c}</option>`).join('');
  const isCasual = staffTypeSelected === 'casual';
  const showPinField = !isCasual || casualPinEnabled;

  const rows = staffList.map(s => `
    <tr>
      <td><input type="checkbox" class="staffSelectCheck" data-id="${s.id}"></td>
      <td>${s.full_name} ${s.staff_type === 'casual' ? '<span class="text-xs text-gray-400">(Casual)</span>' : ''}</td>
      <td>${s.phone}</td>
      <td>${s.sites ? s.sites.name : ''}</td>
      <td>${s.pay_type === 'monthly' ? `${s.currency} ${Number(s.monthly_salary || 0).toFixed(2)}/mo` : `${s.currency} ${Number(s.weekday_rate || 0).toFixed(2)} wkday / ${Number(s.weekend_rate || 0).toFixed(2)} wkend`}</td>
      <td>${statusBadge(s.status)}</td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="mt-card p-4 mb-4 mt-fade-in">
      <h2 class="font-medium mb-3">Add Staff</h2>

      <label class="text-xs font-medium text-gray-500">Staff Type</label>
      <select id="f_stafftype" class="w-full border rounded-lg px-3 py-2 text-sm mb-3">
        <option value="permanent" ${staffTypeSelected === 'permanent' ? 'selected' : ''}>Permanent</option>
        <option value="casual" ${staffTypeSelected === 'casual' ? 'selected' : ''}>Laborer / Casual Worker</option>
      </select>

      <div class="grid grid-cols-2 gap-2">
        <input id="f_name" autocomplete="off" placeholder="Full Name *" class="border rounded-lg px-3 py-2 text-sm">
        <input id="f_mobile" autocomplete="off" placeholder="Mobile *" class="border rounded-lg px-3 py-2 text-sm">

        <input id="f_department" autocomplete="off" placeholder="Department" class="border rounded-lg px-3 py-2 text-sm ${isCasual ? 'hidden' : ''}">
        <input id="f_role" autocomplete="off" placeholder="Role" class="border rounded-lg px-3 py-2 text-sm ${isCasual ? 'hidden' : ''}">
        <input id="f_staffcode" autocomplete="off" placeholder="Staff Code (optional)" class="border rounded-lg px-3 py-2 text-sm ${isCasual ? 'hidden' : ''}">

        <label class="col-span-2 flex items-center gap-2 text-sm ${isCasual ? '' : 'hidden'}" id="f_casualPinLabel">
          <input type="checkbox" id="f_casualPinEnable" ${casualPinEnabled ? 'checked' : ''}>
          Enable PIN check-in for this worker (e.g. long-term casual staff)
        </label>

        <input id="f_pin" autocomplete="off" inputmode="numeric" maxlength="4" placeholder="4-digit PIN *" class="border rounded-lg px-3 py-2 text-sm ${showPinField ? '' : 'hidden'}">

        <select id="f_country" class="border rounded-lg px-3 py-2 text-sm">${countryOptions || '<option value="">Add a site first</option>'}</select>
        <select id="f_site" class="border rounded-lg px-3 py-2 text-sm">${siteOptions || '<option value="">No sites in this country</option>'}</select>

        <select id="f_paytype" class="border rounded-lg px-3 py-2 text-sm col-span-2 ${isCasual ? 'hidden' : ''}">
          <option value="daily" ${staffPayType === 'daily' ? 'selected' : ''}>Daily rate (weekday/weekend)</option>
          <option value="fixed" ${staffPayType === 'fixed' ? 'selected' : ''}>Fixed Salary</option>
        </select>

        <div class="col-span-2 grid grid-cols-3 gap-2 ${(isCasual || staffPayType === 'fixed') ? 'hidden' : ''}">
          <input id="f_weekday" type="number" step="0.01" placeholder="Weekday rate" class="border rounded-lg px-3 py-2 text-sm">
          <input id="f_weekend" type="number" step="0.01" placeholder="Weekend rate" class="border rounded-lg px-3 py-2 text-sm">
          <select id="f_currency_rate" class="border rounded-lg px-3 py-2 text-sm">${currencyOptions}</select>
        </div>
        <div class="col-span-2 grid grid-cols-2 gap-2 ${(!isCasual && staffPayType === 'daily') ? 'hidden' : ''}">
          <input id="f_salary" type="number" step="0.01" placeholder="${isCasual ? 'Fixed Pay *' : 'Fixed Salary'}" class="border rounded-lg px-3 py-2 text-sm">
          <select id="f_currency_salary" class="border rounded-lg px-3 py-2 text-sm">${currencyOptions}</select>
        </div>
      </div>

      <div class="mt-4 pt-3 border-t" style="border-color: var(--mt-border);">
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-sm font-medium text-gray-600">Additional Information</h3>
          <button type="button" id="addCustomFieldBtn" class="mt-icon-btn edit">+</button>
        </div>
        <div id="customFieldsWrap">${customFieldsHtml()}</div>
      </div>

      ${errorMsg ? `<p class="text-red-600 text-sm mt-2">${errorMsg}</p>` : ''}
      <button id="addStaffBtn" type="button" class="mt-btn-primary mt-3">Add Staff</button>
    </div>

    <div class="mt-card p-4 overflow-x-auto mt-fade-in">
      <div class="flex justify-between items-center mb-2">
        <h2 class="font-medium">Staff Catalog</h2>
        <button id="deleteStaffBtn" type="button" class="hidden mt-btn-danger-outline" style="padding: 0.4rem 1rem; font-size: 0.75rem;">Delete Selected</button>
      </div>
      <table class="w-full mt-table">
        <thead><tr><th></th><th>Name</th><th>Mobile</th><th>Site</th><th>Fixed/Rate</th><th>Status</th></tr></thead>
        <tbody>${rows || '<tr><td class="text-gray-400 py-4" colspan="6">No staff yet.</td></tr>'}</tbody>
      </table>
    </div>`;

  document.getElementById('f_stafftype').onchange = (e) => {
    staffTypeSelected = e.target.value;
    if (staffTypeSelected === 'casual') staffPayType = 'fixed';
    else casualPinEnabled = false;
    renderStaff(el);
  };

  const casualPinCheck = document.getElementById('f_casualPinEnable');
  if (casualPinCheck) {
    casualPinCheck.onchange = (e) => {
      casualPinEnabled = e.target.checked;
      document.getElementById('f_pin').classList.toggle('hidden', !casualPinEnabled);
    };
  }

  document.getElementById('f_country').onchange = (e) => {
    staffCountry = e.target.value;
    const newSites = sites.filter(s => s.country === staffCountry);
    document.getElementById('f_site').innerHTML = newSites.map(s => `<option value="${s.id}">${s.name}</option>`).join('') || '<option value="">No sites in this country</option>';
  };

  const payTypeEl = document.getElementById('f_paytype');
  if (payTypeEl) {
    payTypeEl.onchange = (e) => {
      staffPayType = e.target.value;
      const dailyBlock = document.getElementById('f_weekday').closest('.grid');
      const fixedBlock = document.getElementById('f_salary').closest('.grid');
      dailyBlock.classList.toggle('hidden', staffPayType === 'fixed');
      fixedBlock.classList.toggle('hidden', staffPayType === 'daily');
    };
  }

  function syncCustomFieldsFromDom() {
    document.querySelectorAll('.cfLabel').forEach(inp => { customFields[+inp.dataset.i].label = inp.value; });
    document.querySelectorAll('.cfValue').forEach(inp => { customFields[+inp.dataset.i].value = inp.value; });
  }

  document.getElementById('addCustomFieldBtn').onclick = () => {
    syncCustomFieldsFromDom();
    customFields.push({ label: '', value: '' });
    document.getElementById('customFieldsWrap').innerHTML = customFieldsHtml();
    wireCustomFieldRows();
  };

  function wireCustomFieldRows() {
    document.querySelectorAll('.cfRemoveBtn').forEach(btn => {
      btn.onclick = () => {
        syncCustomFieldsFromDom();
        customFields.splice(+btn.dataset.i, 1);
        document.getElementById('customFieldsWrap').innerHTML = customFieldsHtml();
        wireCustomFieldRows();
      };
    });
  }
  wireCustomFieldRows();

  document.getElementById('addStaffBtn').onclick = async () => {
    errorMsg = '';
    const name = document.getElementById('f_name').value.trim();
    const mobile = document.getElementById('f_mobile').value.trim();
    const siteId = document.getElementById('f_site').value;
    const staffType = document.getElementById('f_stafftype').value;

    if (!name || !mobile || !siteId) {
      showFormError('Fill in Full Name, Mobile, and choose a site.'); return;
    }

    let insertData = { site_id: siteId, full_name: name, phone: mobile, staff_type: staffType };

    if (staffType === 'casual') {
      const salary = document.getElementById('f_salary').value;
      const currencySalary = document.getElementById('f_currency_salary').value;
      if (!salary) { showFormError('Fixed Pay is required for casual/laborer staff.'); return; }

      let pinHash = null;
      if (casualPinEnabled) {
        const pin = document.getElementById('f_pin').value.trim();
        if (pin.length !== 4) { showFormError('Enter a 4-digit PIN, or uncheck PIN check-in for this worker.'); return; }
        const { data: hashed, error: hashErr } = await sb.rpc('hash_pin', { p_pin: pin });
        if (hashErr) { showFormError(hashErr.message); return; }
        pinHash = hashed;
      }

      insertData = { ...insertData, pay_type: 'monthly', monthly_salary: salary, currency: currencySalary, pin_hash: pinHash };
    } else {
      const department = document.getElementById('f_department').value.trim();
      const role = document.getElementById('f_role').value.trim();
      const staffCode = document.getElementById('f_staffcode').value.trim();
      const pin = document.getElementById('f_pin').value.trim();
      const payType = document.getElementById('f_paytype').value;
      const weekday = document.getElementById('f_weekday').value;
      const weekend = document.getElementById('f_weekend').value;
      const currencyRate = document.getElementById('f_currency_rate').value;
      const salary = document.getElementById('f_salary').value;
      const currencySalary = document.getElementById('f_currency_salary').value;

      if (pin.length !== 4) { showFormError('A 4-digit PIN is required for permanent staff.'); return; }

      const { data: hashed, error: hashErr } = await sb.rpc('hash_pin', { p_pin: pin });
      if (hashErr) { showFormError(hashErr.message); return; }

      insertData = {
        ...insertData, department: department || null, role: role || null, staff_code: staffCode || null,
        pin_hash: hashed, pay_type: payType === 'fixed' ? 'monthly' : 'daily',
        weekday_rate: payType === 'daily' ? (weekday || 0) : null,
        weekend_rate: payType === 'daily' ? (weekend || 0) : null,
        monthly_salary: payType === 'fixed' ? (salary || 0) : null,
        currency: payType === 'fixed' ? currencySalary : currencyRate
      };
    }

    const { data: newStaffId, error } = await sb.rpc('add_staff', { p_staff: insertData });
    if (error) { showFormError(error.message); return; }

    syncCustomFieldsFromDom();
    const validFields = customFields.filter(f => f.label.trim());
    if (validFields.length) {
      const { error: cfError } = await sb.from('staff_custom_fields').insert(
        validFields.map(f => ({ staff_id: newStaffId, label: f.label.trim(), value: f.value.trim() || null }))
      );
      if (cfError) {
        errorMsg = 'Staff saved, but additional info failed to save: ' + cfError.message;
        renderStaff(el);
        return;
      }
    }

    casualPinEnabled = false;
    customFields = [];
    renderStaff(el);
  };

  const deleteBtn = document.getElementById('deleteStaffBtn');
  document.querySelectorAll('.staffSelectCheck').forEach(cb => {
    cb.onchange = () => {
      const anyChecked = document.querySelectorAll('.staffSelectCheck:checked').length > 0;
      deleteBtn.classList.toggle('hidden', !anyChecked);
    };
  });
  deleteBtn.onclick = async () => {
    const ids = Array.from(document.querySelectorAll('.staffSelectCheck:checked')).map(cb => cb.dataset.id);
    if (!ids.length) return;
    if (!confirm(`Delete ${ids.length} staff record(s)? This cannot be undone.`)) return;
    const { error } = await sb.rpc('delete_staff', { p_staff_ids: ids });
    if (error) { errorMsg = error.message; }
    renderStaff(el);
  };

  app().querySelectorAll('#f_name, #f_mobile, #f_department, #f_role, #f_staffcode, #f_pin, #f_weekday, #f_weekend, #f_salary').forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('addStaffBtn').click(); });
  });
}

// ===== ATTENDANCE =====

function attendanceStatusBadge(status) {
  const map = { present: 'active', late: 'on_leave', absent: 'inactive', off: 'pending', sick: 'pending', on_leave: 'on_leave', holiday: 'pending' };
  const labels = { present: '🟢 Present', late: '🟡 Late', absent: '🔴 Absent', off: '⚪ Off', sick: '🤒 Sick', on_leave: '🟡 On Leave', holiday: '🏖️ Holiday' };
  return `<span class="mt-badge ${map[status] || 'pending'}">${labels[status] || status}</span>`;
}

let attendanceChannel = null;
let attendanceRefreshInterval = null;

function clearAttendanceAutoRefresh() {
  if (attendanceRefreshInterval) {
    clearInterval(attendanceRefreshInterval);
    attendanceRefreshInterval = null;
  }
}

async function renderAttendance(el) {
  clearAttendanceAutoRefresh();
  el.innerHTML = `<p class="text-gray-400 text-center mt-6">Loading attendance…</p>`;
  const yesterday = new Date(`${attendanceDate}T00:00:00`);
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayDate = yesterday.toISOString().slice(0, 10);
  const trendStart = new Date(`${attendanceDate}T00:00:00`);
  trendStart.setDate(trendStart.getDate() - 6);
  const trendStartDate = trendStart.toISOString().slice(0, 10);
  const [{ data: staffData, error: staffErr }, { data: attData, error: attErr }] = await Promise.all([
    sb.from('staff').select('id, full_name, phone, sites(name, default_start_time)').order('full_name'),
    sb.from('attendance').select('*, staff(full_name, phone), sites(name, default_start_time)').eq('work_date', attendanceDate).order('created_at', { ascending: false })
  ]);
  if (staffErr) { el.innerHTML = `<p class="text-red-600 text-center mt-6">${staffErr.message}</p>`; return; }
  if (attErr) { el.innerHTML = `<p class="text-red-600 text-center mt-6">${attErr.message}</p>`; return; }
  const { data: yesterdayData, error: yesterdayErr } = await sb.from('attendance').select('status').eq('work_date', yesterdayDate);
  if (yesterdayErr) { el.innerHTML = `<p class="text-red-600 text-center mt-6">${yesterdayErr.message}</p>`; return; }
  const { data: trendData, error: trendErr } = await sb.from('attendance').select('work_date, status').eq('status', 'present').gte('work_date', trendStartDate).lte('work_date', attendanceDate);
  if (trendErr) { el.innerHTML = `<p class="text-red-600 text-center mt-6">${trendErr.message}</p>`; return; }
  staffList = staffData;

  const attendanceByStaff = new Map((attData || []).map(record => [record.staff_id, record]));
  const trendStatuses = [
    { status: 'present', icon: '🟢' },
    { status: 'late', icon: '🟡' },
    { status: 'absent', icon: '🔴' },
    { status: 'off', icon: '⚪' },
    { status: 'sick', icon: '🤒' },
  ];
  const countStatus = (records, status) => (records || []).filter(record => record.status === status).length;
  const trendCards = trendStatuses.map(({ status, icon }) => {
    const todayCount = countStatus(attData, status);
    const yesterdayCount = countStatus(yesterdayData, status);
    const arrow = todayCount > yesterdayCount ? '⬆️' : todayCount < yesterdayCount ? '⬇️' : '➡️';
    return `<div class="mt-card p-3"><div class="text-lg">${icon}</div><div class="text-xs capitalize">${status}</div><strong>${todayCount}</strong> <span class="text-xs text-gray-500">${arrow} ${yesterdayCount}</span></div>`;
  }).join('');
  const trendDays = Array.from({ length: 7 }, (_, index) => {
    const day = new Date(`${trendStartDate}T00:00:00`);
    day.setDate(day.getDate() + index);
    return day.toISOString().slice(0, 10);
  });
  const trendCounts = trendDays.map(day => (trendData || []).filter(record => record.work_date === day).length);
  const maxTrendCount = Math.max(...trendCounts, 1);
  const trendPoints = trendCounts.map((count, index) => {
    const x = 10 + (index * 280 / 6);
    const y = 50 - (count / maxTrendCount * 40);
    return `${x},${y}`;
  }).join(' ');
  const trendChart = `<div class="mt-card p-3 mb-4 mt-fade-in"><div class="text-xs font-medium mb-1">Present trend, last 7 days</div><svg viewBox="0 0 300 60" width="300" height="60" role="img" aria-label="Present count trend for the last 7 days"><polyline points="${trendPoints}" fill="none" stroke="var(--mt-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline></svg></div>`;

  const staffOptions = staffList.map(s => `<option value="${s.id}">${s.full_name} — ${s.sites ? s.sites.name : 'no site'}</option>`).join('');

  const quickIcons = [
    { status: 'present', icon: '🟢', title: 'Mark Present' },
    { status: 'absent', icon: '🔴', title: 'Mark Absent' },
    { status: 'on_leave', icon: '🟡', title: 'Mark On Leave' },
    { status: 'sick', icon: '🤒', title: 'Mark Sick' },
    { status: 'holiday', icon: '🏖️', title: 'Mark Holiday' },
  ];

  const statusCycle = ['present', 'late', 'absent', 'off', 'sick'];

  function attendanceRow(staff) {
    const a = attendanceByStaff.get(staff.id);
    const canCheckOut = a && a.check_in && !a.check_out;
    const site = a && a.sites ? a.sites : staff.sites;
    const lateMinutes = a && a.status === 'late' && site && site.default_start_time && a.check_in
      ? Math.max(0, Math.round((new Date(a.check_in) - new Date(`${attendanceDate}T${site.default_start_time}`)) / 60000))
      : null;
    const absentReason = a && a.status === 'absent' ? `
      <div class="flex gap-1 mt-1">
        <button type="button" class="absentReasonBtn mt-badge ${a.absent_reason === 'no_show' ? 'inactive' : ''}" data-attendance="${a.id}" data-reason="no_show">No Show</button>
        <button type="button" class="absentReasonBtn mt-badge ${a.absent_reason === 'excused' ? 'active' : ''}" data-attendance="${a.id}" data-reason="excused">Excused</button>
      </div>` : '';
    const statusCell = a
      ? `<button type="button" class="cycleStatusBtn cursor-pointer transition-opacity hover:opacity-75" data-staff="${staff.id}" title="Change status">${attendanceStatusBadge(a.status)}${lateMinutes != null && lateMinutes > 0 ? `<span class="block text-xs text-red-600">${lateMinutes} min late</span>` : ''}</button>${absentReason}`
      : '<span class="text-xs text-gray-400">Not Marked</span>';
    return `
    <tr id="att-${staff.id}" data-staff-id="${staff.id}">
      <td><input type="checkbox" class="attendanceSelectCheck" data-staff="${staff.id}" ${!a || !a.check_in ? 'checked' : ''}></td>
      <td>${staff.full_name}<span class="block text-xs text-gray-400">${staff.phone || ''}</span></td>
      <td>${site ? site.name : ''}</td>
      <td>${statusCell}</td>
      <td>${a && a.check_in ? new Date(a.check_in).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) : '—'}</td>
      <td>${a && a.check_out ? new Date(a.check_out).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) : '—'}</td>
      <td>${a && a.total_hours != null ? a.total_hours + ' hrs' : '—'}</td>
      <td class="whitespace-nowrap">
        ${quickIcons.map(q => `<button class="quickStatusBtn mt-icon-btn edit" style="width:26px;height:26px;font-size:0.8rem;" data-staff="${staff.id}" data-status="${q.status}" data-checkin="${a ? a.check_in || '' : ''}" data-checkout="${a ? a.check_out || '' : ''}" title="${q.title}">${q.icon}</button>`).join('')}
        ${canCheckOut ? `<button class="manualCheckoutBtn mt-icon-btn delete ml-1" style="width:26px;height:26px;font-size:0.8rem;" data-staff="${staff.id}" data-checkin="${a.check_in}" title="Manual Check-Out">⏱</button>` : ''}
      </td>
    </tr>`;
  }

  el.innerHTML = `
    ${trendChart}
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-4 mt-fade-in">${trendCards}</div>

    <div class="mt-card p-4 mb-4 mt-fade-in">
      <h2 class="font-medium mb-3">Set Status for a Day</h2>
      <div class="grid grid-cols-2 gap-2 mb-2">
        <select id="a_staff" class="border rounded-lg px-3 py-2 text-sm col-span-2">${staffOptions || '<option value="">No staff yet</option>'}</select>
        <input id="a_date" type="date" value="${attendanceDate}" class="border rounded-lg px-3 py-2 text-sm">
        <select id="a_status" class="border rounded-lg px-3 py-2 text-sm">
          <option value="present" ${attendanceStatus === 'present' ? 'selected' : ''}>Present</option>
          <option value="absent" ${attendanceStatus === 'absent' ? 'selected' : ''}>Absent</option>
          <option value="on_leave" ${attendanceStatus === 'on_leave' ? 'selected' : ''}>On Leave</option>
          <option value="sick" ${attendanceStatus === 'sick' ? 'selected' : ''}>Sick</option>
          <option value="holiday" ${attendanceStatus === 'holiday' ? 'selected' : ''}>Holiday</option>
        </select>
        <div class="flex gap-1">
          <input id="a_checkin_hour" type="number" min="1" max="12" placeholder="08" aria-label="Check-in hour" class="w-full border rounded-lg px-2 py-2 text-sm">
          <span class="self-center">:</span>
          <input id="a_checkin_minute" type="number" min="0" max="59" placeholder="00" aria-label="Check-in minute" class="w-full border rounded-lg px-2 py-2 text-sm">
          <select id="a_checkin_ampm" aria-label="Check-in AM or PM" class="border rounded-lg px-2 py-2 text-sm">
            <option value="AM">AM</option><option value="PM">PM</option>
          </select>
        </div>
        <div class="flex gap-1">
          <input id="a_checkout_hour" type="number" min="1" max="12" placeholder="05" aria-label="Check-out hour" class="w-full border rounded-lg px-2 py-2 text-sm">
          <span class="self-center">:</span>
          <input id="a_checkout_minute" type="number" min="0" max="59" placeholder="00" aria-label="Check-out minute" class="w-full border rounded-lg px-2 py-2 text-sm">
          <select id="a_checkout_ampm" aria-label="Check-out AM or PM" class="border rounded-lg px-2 py-2 text-sm">
            <option value="AM">AM</option><option value="PM">PM</option>
          </select>
        </div>
      </div>
      ${errorMsg ? `<p class="text-red-600 text-sm mb-2">${errorMsg}</p>` : ''}
      <button id="saveAttendanceBtn" type="button" class="mt-btn-primary">Save Status</button>
    </div>

    <div class="mt-card p-4 overflow-x-auto mt-fade-in">
      <div class="flex justify-between items-center mb-2">
        <h2 class="font-medium">Attendance for ${attendanceDate} <span class="text-xs font-normal text-green-600 align-middle">● live</span> <button id="refreshAttendanceBtn" type="button" class="text-sm" title="Refresh attendance">🔄</button> <button id="exportAttendanceBtn" type="button" class="text-sm" title="Export CSV">⬇️</button></h2>
        <p class="text-xs text-gray-400">Click an icon to change status instantly, or ⏱ to check someone out manually</p>
      </div>
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <select id="bulkAttendanceStatus" class="border rounded-lg px-3 py-2 text-sm">
          <option value="present">Present</option><option value="late">Late</option><option value="absent">Absent</option><option value="off">Off</option><option value="sick">Sick</option>
        </select>
        <button id="applyBulkAttendanceBtn" type="button" class="mt-btn-primary">Apply to Selected</button>
      </div>
      <input id="attendanceSearch" type="search" placeholder="Search staff by name or phone..." class="w-full border rounded-lg px-3 py-2 text-sm mb-3">
      <table class="w-full mt-table">
        <thead><tr><th><input type="checkbox" id="selectAllAttendance" aria-label="Select all staff"></th><th>Name</th><th>Site</th><th>Status</th><th>Check In</th><th>Check Out</th><th>Hours</th><th>Quick Actions</th></tr></thead>
        <tbody id="attendanceBody">${staffList.map(attendanceRow).join('') || '<tr><td class="text-gray-400 py-4" colspan="8">No staff yet.</td></tr>'}</tbody>
      </table>
    </div>`;

  document.getElementById('a_date').onchange = (e) => { attendanceDate = e.target.value; renderAttendance(el); };
  document.getElementById('a_status').onchange = (e) => { attendanceStatus = e.target.value; };

  document.getElementById('refreshAttendanceBtn').onclick = () => {
    document.getElementById('refreshAttendanceBtn').classList.add('animate-spin');
    renderAttendance(el);
  };

  document.getElementById('attendanceSearch').oninput = (e) => {
    const query = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#attendanceBody tr[data-staff-id]').forEach(row => {
      const staff = staffList.find(item => item.id === row.dataset.staffId);
      const matches = !query || `${staff.full_name} ${staff.phone || ''}`.toLowerCase().includes(query);
      row.classList.toggle('hidden', !matches);
    });
  };

  document.getElementById('exportAttendanceBtn').onclick = async () => {
    const csvEscape = (value) => `"${String(value ?? '').replace(/"/g, '""')}"`;
    const visibleStaff = staffList.filter(staff => {
      const row = document.querySelector(`#att-${staff.id}`);
      return row && !row.classList.contains('hidden');
    });
    const csvRows = [
      ['Name', 'Phone', 'Site', 'Status', 'Check In', 'Check Out', 'Hours', 'Absent Reason'],
      ...visibleStaff.map(staff => {
        const record = attendanceByStaff.get(staff.id);
        const site = record && record.sites ? record.sites : staff.sites;
        return [
          staff.full_name,
          staff.phone || '',
          site ? site.name : '',
          record ? record.status : 'Not Marked',
          record && record.check_in ? new Date(record.check_in).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) : '',
          record && record.check_out ? new Date(record.check_out).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) : '',
          record && record.total_hours != null ? `${record.total_hours} hrs` : '',
          record && record.absent_reason ? record.absent_reason : ''
        ].map(csvEscape).join(',');
      })
    ].join('\r\n');
    const blob = new Blob([csvRows], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `attendance-${attendanceDate}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
    await sb.rpc('log_company_activity', {
      p_action: 'attendance_csv_export',
      p_detail: { work_date: attendanceDate, row_count: visibleStaff.length }
    });
  };

  document.querySelectorAll('.absentReasonBtn').forEach(btn => {
    btn.onclick = async () => {
      const { error } = await sb.rpc('set_absent_reason', {
        p_staff_id: btn.closest('tr').id.replace('att-', ''),
        p_work_date: attendanceDate,
        p_reason: btn.dataset.reason
      });
      if (error) errorMsg = error.message;
      renderAttendance(el);
    };
  });

  document.querySelectorAll('.cycleStatusBtn').forEach(btn => {
    btn.onclick = async () => {
      const record = attendanceByStaff.get(btn.dataset.staff);
      if (!record) return;
      const currentIndex = statusCycle.indexOf(record.status);
      const nextStatus = statusCycle[(currentIndex + 1) % statusCycle.length];
      const { error } = await sb.rpc('set_attendance_status', {
        p_staff_id: record.staff_id, p_work_date: attendanceDate, p_status: nextStatus,
        p_check_in: record.check_in, p_check_out: record.check_out, p_reason: null
      });
      if (error) errorMsg = error.message;
      renderAttendance(el);
    };
  });

  const attendanceChecks = () => Array.from(document.querySelectorAll('.attendanceSelectCheck'));
  const selectAllAttendance = document.getElementById('selectAllAttendance');
  selectAllAttendance.onchange = () => attendanceChecks().forEach(check => { check.checked = selectAllAttendance.checked; });
  attendanceChecks().forEach(check => {
    check.onchange = () => {
      selectAllAttendance.checked = attendanceChecks().every(item => item.checked);
    };
  });

  document.getElementById('applyBulkAttendanceBtn').onclick = async () => {
    const selectedStaffIds = attendanceChecks().filter(check => check.checked).map(check => check.dataset.staff);
    if (!selectedStaffIds.length) { errorMsg = 'Select at least one staff member.'; renderAttendance(el); return; }
    const status = document.getElementById('bulkAttendanceStatus').value;
    const statusLabel = status.charAt(0).toUpperCase() + status.slice(1);
    if (!confirm(`Mark ${selectedStaffIds.length} staff as ${statusLabel}?`)) return;
    const results = await Promise.all(selectedStaffIds.map(staffId => {
      const record = attendanceByStaff.get(staffId);
      return sb.rpc('set_attendance_status', {
        p_staff_id: staffId, p_work_date: attendanceDate, p_status: status,
        p_check_in: record ? record.check_in : null, p_check_out: record ? record.check_out : null, p_reason: null
      });
    }));
    const failed = results.find(result => result.error);
    if (failed) errorMsg = failed.error.message;
    renderAttendance(el);
  };

  document.getElementById('saveAttendanceBtn').onclick = async () => {
    errorMsg = '';
    const staffId = document.getElementById('a_staff').value;
    const status = document.getElementById('a_status').value;
    const checkInHour = document.getElementById('a_checkin_hour').value;
    const checkInMinute = document.getElementById('a_checkin_minute').value;
    const checkInAmPm = document.getElementById('a_checkin_ampm').value;
    const checkOutHour = document.getElementById('a_checkout_hour').value;
    const checkOutMinute = document.getElementById('a_checkout_minute').value;
    const checkOutAmPm = document.getElementById('a_checkout_ampm').value;

    if (!staffId) { errorMsg = 'Choose a staff member.'; renderAttendance(el); return; }

    const parseTime = (hourValue, minuteValue, amPm) => {
      if (!hourValue && !minuteValue) return null;
      const hour = Number(hourValue);
      const minute = Number(minuteValue);
      if (!hourValue || !minuteValue || hour < 1 || hour > 12 || minute < 0 || minute > 59) return undefined;
      const hour24 = amPm === 'PM' && hour !== 12 ? hour + 12 : amPm === 'AM' && hour === 12 ? 0 : hour;
      return `${String(hour24).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
    };
    const parsedCheckIn = parseTime(checkInHour, checkInMinute, checkInAmPm);
    const parsedCheckOut = parseTime(checkOutHour, checkOutMinute, checkOutAmPm);
    if (parsedCheckIn === undefined || parsedCheckOut === undefined) {
      errorMsg = 'Enter a valid hour and minute, then choose AM or PM.';
      renderAttendance(el); return;
    }
    const checkIn = parsedCheckIn ? new Date(`${attendanceDate}T${parsedCheckIn}:00`).toISOString() : null;
    const checkOut = parsedCheckOut ? new Date(`${attendanceDate}T${parsedCheckOut}:00`).toISOString() : null;

    const { error } = await sb.rpc('set_attendance_status', {
      p_staff_id: staffId, p_work_date: attendanceDate, p_status: status,
      p_check_in: checkIn, p_check_out: checkOut, p_reason: null
    });
    if (error) { errorMsg = error.message; renderAttendance(el); return; }
    renderAttendance(el);
  };

  // Quick status icons — instant one-click change, preserves existing check-in/out
  document.querySelectorAll('.quickStatusBtn').forEach(btn => {
    btn.onclick = async () => {
      const staffId = btn.dataset.staff;
      const status = btn.dataset.status;
      const checkIn = btn.dataset.checkin || null;
      const checkOut = btn.dataset.checkout || null;
      btn.textContent = '⏳';
      const { error } = await sb.rpc('set_attendance_status', {
        p_staff_id: staffId, p_work_date: attendanceDate, p_status: status,
        p_check_in: checkIn, p_check_out: checkOut, p_reason: null
      });
      if (error) { errorMsg = error.message; }
      renderAttendance(el);
    };
  });

  // Manual check-out — requires a reason, forms the evidence trail
  document.querySelectorAll('.manualCheckoutBtn').forEach(btn => {
    btn.onclick = async () => {
      const reason = prompt('Reason for manual check-out (required — this is recorded as an evidence trail):');
      if (reason === null) return; // cancelled
      if (!reason.trim()) { alert('A reason is required for manual check-out.'); return; }

      const staffId = btn.dataset.staff;
      const checkIn = btn.dataset.checkin;
      const row = staffList.find(s => s.id === staffId);
      const currentStatus = document.querySelector(`#att-${btn.closest('tr').id.replace('att-','')}`) ? attendanceStatus : 'present';

      const { error } = await sb.rpc('set_attendance_status', {
        p_staff_id: staffId, p_work_date: attendanceDate, p_status: 'present',
        p_check_in: checkIn, p_check_out: new Date().toISOString(), p_reason: reason.trim()
      });
      if (error) { errorMsg = error.message; }
      renderAttendance(el);
    };
  });

  // Real-time pulse: any attendance change for this date appears instantly, no reload.
  if (attendanceChannel) { sb.removeChannel(attendanceChannel); attendanceChannel = null; }
  attendanceChannel = sb
    .channel('attendance-live-' + attendanceDate)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance', filter: `work_date=eq.${attendanceDate}` }, () => {
      renderAttendance(el);
    })
    .subscribe();
  attendanceRefreshInterval = setInterval(() => renderAttendance(el), 60000);
}

init();
</script>
</body>
</html>
