    const workDate = document.getElementById('a_date').value;
    const status = document.getElementById('a_status').value;
    const reason = document.getElementById('a_reason').value.trim();
    if (!staffId) { msg.innerHTML = '<span class="text-red-600">Choose a staff member.</span>'; return; }
    if (!workDate) { msg.innerHTML = '<span class="text-red-600">Choose a date.</span>'; return; }

    const parseTime = (hourValue, minuteValue, amPm) => {
      if (!hourValue && !minuteValue) return null;
      const hour = Number(hourValue);
      const minute = Number(minuteValue);
      if (!hourValue || !minuteValue || hour < 1 || hour > 12 || minute < 0 || minute > 59) return undefined;
      const hour24 = amPm === 'PM' && hour !== 12 ? hour + 12 : amPm === 'AM' && hour === 12 ? 0 : hour;
      return `${String(hour24).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
    };
    const parsedCheckIn = parseTime(document.getElementById('a_checkin_hour').value, document.getElementById('a_checkin_minute').value, document.getElementById('a_checkin_ampm').value);
    const parsedCheckOut = parseTime(document.getElementById('a_checkout_hour').value, document.getElementById('a_checkout_minute').value, document.getElementById('a_checkout_ampm').value);
    if (parsedCheckIn === undefined || parsedCheckOut === undefined) {
      msg.innerHTML = '<span class="text-red-600">Enter a valid hour and minute, then choose AM or PM.</span>'; return;
    }
    const checkIn = parsedCheckIn ? new Date(`${workDate}T${parsedCheckIn}:00`).toISOString() : null;
    const checkOut = parsedCheckOut ? new Date(`${workDate}T${parsedCheckOut}:00`).toISOString() : null;

    msg.innerHTML = '<span class="text-blue-600">Saving…</span>';
    const { error } = await sb.rpc('set_attendance_status', {
      p_staff_id: staffId, p_work_date: workDate, p_status: status,
      p_check_in: checkIn, p_check_out: checkOut, p_reason: reason || null
    });
    msg.innerHTML = error ? `<span class="text-red-600">${escapeHtml(error.message)}</span>` : '<span class="text-green-700">Saved.</span>';
  };
}

let settingsMsg = '';

function csvFromRows(headers, rows) {
  const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  return [headers, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
}

function downloadCsv(filename, headers, rows) {
  const blob = new Blob([csvFromRows(headers, rows)], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
}

let inviteRole = null;

// Style map keyed by portfolio code. Unknown/new roles get a hashed fallback
// color and an initial-letter icon, so the grid stays fully data-driven.
const INVITE_ROLE_COLORS = {
  owner: '#DC2626', executive_director: '#7C3AED', administrator: '#0284C7', admin: '#0284C7',
  manager: '#0D9488', payroll_officer: '#059669', viewer: '#6B7280', stores_inventory: '#D97706',
  operations_manager: '#4F46E5', sales_marketing: '#DB2777', customer_service: '#0891B2',
  procurement: '#EA580C', compliance_legal: '#475569', training_development: '#8B5CF6',
  security_access: '#F97316', board_governance: '#1E3A8A', audit_internal_control: '#166534',
  strategy_planning: '#C026D3'
};
const INVITE_ROLE_FALLBACK_COLORS = ['#0d2a4d', '#0D9488', '#4F46E5', '#DB2777', '#D97706', '#0891B2', '#059669', '#7C3AED'];
const INVITE_ROLE_ICONS = {
  owner: '👑', executive_director: '🎯', administrator: '🛠️', admin: '🛠️', manager: '📋',
  payroll_officer: '💰', viewer: '👁️', stores_inventory: '📦', operations_manager: '⚙️',
  sales_marketing: '📈', customer_service: '💬', procurement: '🛒', compliance_legal: '⚖️',
  training_development: '🎓', security_access: '🔐', board_governance: '🏛️',
  audit_internal_control: '🔍', strategy_planning: '🧭'
};

function inviteRoleColor(code) {
  if (INVITE_ROLE_COLORS[code]) return INVITE_ROLE_COLORS[code];
  let h = 0;
  for (const ch of String(code || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return INVITE_ROLE_FALLBACK_COLORS[h % INVITE_ROLE_FALLBACK_COLORS.length];
}

function inviteRoleTint(hex) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, .12)`;
}

function inviteRoleTileHtml(portfolio, index, active) {
  const color = inviteRoleColor(portfolio.code);
  const icon = INVITE_ROLE_ICONS[portfolio.code] || escapeHtml((portfolio.display_name || portfolio.code || '?').charAt(0).toUpperCase());
  return `<button type="button" class="role-card ${active ? 'selected' : ''}" data-role="${escapeHtml(portfolio.code)}"
    style="--rc:${color};--rc-bg:${inviteRoleTint(color)};animation-delay:${index * 50}ms">
    <span class="role-check">✓</span>
    <div class="role-icon">${icon}</div>
    <div class="role-info">
      <h3 class="role-name">${escapeHtml(portfolio.display_name)}</h3>
      <p class="role-description">${escapeHtml(portfolio.description || '')}</p>
    </div>
    <div class="role-step">${String(index + 1).padStart(2, '0')}</div>
  </button>`;
}

      sb.from('staff').select('*').eq('company_id', myProfile.company_id),
      sb.from('sites').select('*').eq('company_id', myProfile.company_id),
      sb.from('attendance').select('*, staff(full_name)').gte('work_date', new Date(Date.now() - 90 * 86400000).toISOString().slice(0, 10)),
      sb.from('payroll_entries').select('*, staff(full_name)')
    ]);
    if (staffRes.data) downloadCsv('staff.csv', ['Name','Phone','Status','Type'], staffRes.data.map(s => [s.full_name, s.phone, s.status, s.staff_type]));
    if (sitesRes.data) downloadCsv('sites.csv', ['Name','Country','Address'], sitesRes.data.map(s => [s.name, s.country, s.address]));
    if (attRes.data) downloadCsv('attendance.csv', ['Name','Date','Status'], attRes.data.map(a => [a.staff ? a.staff.full_name : '', a.work_date, a.status]));
    if (payRes.data) downloadCsv('payroll.csv', ['Name','Gross','Deductions','Net'], payRes.data.map(p => [p.staff ? p.staff.full_name : '', p.gross_pay, p.total_deductions, p.net_pay]));
    await sb.rpc('log_company_activity', { p_action: 'data_exported', p_detail: null });
    msg.textContent = 'Export complete — 4 files downloaded.';
  };

  document.getElementById('saveCompanyProfileBtn').onclick = async () => {
    const msg = document.getElementById('companyProfileMsg');
    const { error } = await sb.rpc('update_company_profile', {
      p_name: document.getElementById('settingsCompanyName').value.trim(),
      p_country: document.getElementById('settingsCountry').value.trim(),
      p_default_currency: document.getElementById('settingsCurrency').value
    });
    if (error) { msg.className = 'text-sm mb-2 text-red-600'; msg.textContent = error.message; return; }
    const { data: company } = await sb.from('companies').select('*').eq('id', myProfile.company_id).maybeSingle();
    myCompany = company;
    msg.className = 'text-sm mb-2 text-green-700'; msg.textContent = '✓ Saved';
    renderDashboard();
  };

  document.getElementById('deactivateCompanyBtn').onclick = async () => {
    if (!confirm(`Deactivate ${myCompany.name}? This closes the company and affects staff and platform access.`)) return;
    const { error } = await sb.rpc('deactivate_own_company');
    if (error) { document.getElementById('dangerMsg').textContent = error.message; return; }
    await sb.auth.signOut();
    session = null; myProfile = null;
    render();
  };

  document.getElementById('showWipeFormBtn').onclick = () => {
    document.getElementById('wipeConfirmWrap').classList.remove('hidden');
  };
  document.getElementById('wipeConfirmInput').oninput = (e) => {
    document.getElementById('confirmWipeBtn').disabled = e.target.value !== myCompany.name;
  };
  document.getElementById('confirmWipeBtn').onclick = async () => {
    const { error } = await sb.rpc('wipe_company_data', { p_confirm_company_name: document.getElementById('wipeConfirmInput').value });
    if (error) { document.getElementById('dangerMsg').textContent = error.message; return; }
    document.getElementById('dangerMsg').className = 'text-sm mt-2 text-green-700';
    document.getElementById('dangerMsg').textContent = 'All data wiped.';
    renderSettings(el);
  };
}

async function renderPayments(el) {
  el.innerHTML = `<p class="text-gray-400 text-center mt-6">Loading payroll payables…</p>`;
  try {
    const [{ data: payables, error: pErr }, { data: history, error: hErr }] = await Promise.all([
      sb.rpc('payroll_payables', { p_company_id: myProfile.company_id }),
      sb.from('payment_requests').select('*').eq('company_id', myProfile.company_id).order('created_at', { ascending: false }).limit(20)
    ]);
    if (pErr) throw pErr;
    const rows = Array.isArray(payables) ? payables : [];
    const historyRows = Array.isArray(history) ? history : [];

    el.innerHTML = `
      <div class="mt-card p-6 mt-fade-in">
        <h2 class="text-lg font-bold mb-2">Payroll Payouts</h2>
        <p class="text-sm text-gray-500 mb-4">Pay staff net pay via Paystack Transfer.</p>
        <div class="space-y-3 mb-6">
          ${rows.length ? rows.map(r => `
            <div class="border rounded-xl p-3 bg-white">
              <div class="flex justify-between items-start">
                <div>
                  <p class="font-semibold text-sm">${escapeHtml(r.full_name)}</p>
                  <p class="text-xs text-gray-500">${escapeHtml(r.period_name || '')} · Net: ${r.net_pay} · Pending: ${r.pending_amount}</p>
                </div>
                <button type="button" class="payPayableBtn mt-btn-primary text-xs" data-payroll-id="${r.payroll_entry_id}" data-staff-id="${r.staff_id}" data-amount="${r.pending_amount}">Pay</button>
              </div>
              <div class="payableForm hidden mt-3 space-y-2">
                <select class="paymentProvider border rounded-lg px-3 py-2 text-sm w-full">
                  <option value="paystack">Paystack</option>
                </select>
                <select class="paymentMethod border rounded-lg px-3 py-2 text-sm w-full">
                  <option value="bank">Bank Transfer</option>
                  <option value="momo">Mobile Money (MoMo)</option>
                </select>
                <input type="text" class="bankAccount border rounded-lg px-3 py-2 text-sm w-full" placeholder="Account number / Phone number">
                <input type="text" class="bankCode border rounded-lg px-3 py-2 text-sm w-full" placeholder="Bank code / MoMo provider (MTN, VOD, TGO)">
                <input type="text" class="bankName border rounded-lg px-3 py-2 text-sm w-full" placeholder="Bank name / MoMo wallet name">
                <button type="button" class="confirmPayBtn mt-btn-primary text-sm w-full" data-payroll-id="${r.payroll_entry_id}" data-staff-id="${r.staff_id}" data-amount="${r.pending_amount}">Pay</button>
                <p class="payableFeedback text-sm"></p>
              </div>
            </div>
          `).join('') : '<p class="text-gray-400 text-sm">No pending payroll payables.</p>'}
        </div>
        <h3 class="font-medium text-sm mb-2">Recent Payment Requests</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-xs mt-table">
            <thead><tr><th class="text-left">Reference</th><th class="text-left">Amount</th><th class="text-left">Status</th><th class="text-left">When</th></tr></thead>
            <tbody>${historyRows.map(h => `<tr class="border-b"><td class="py-2 px-3">${escapeHtml(h.reference)}</td><td class="py-2 px-3">${h.amount} ${h.currency}</td><td class="py-2 px-3">${h.status}</td><td class="py-2 px-3">${new Date(h.created_at).toLocaleString()}</td></tr>`).join('')}</tbody>
          </table>
        </div>
      </div>`;

    document.querySelectorAll('.payPayableBtn').forEach(btn => {
      btn.onclick = () => {
        const form = btn.parentNode.nextElementSibling;
        form.classList.toggle('hidden');
      };
    });

    document.querySelectorAll('.confirmPayBtn').forEach(btn => {
      btn.onclick = async () => {
        const form = btn.parentNode;
        const feedback = form.querySelector('.payableFeedback');
        const payrollId = btn.dataset.payrollId;
        const staffId = btn.dataset.staffId;
        const amount = parseFloat(btn.dataset.amount);
        const provider = form.querySelector('.paymentProvider').value;
        const method = form.querySelector('.paymentMethod').value;
        const account = form.querySelector('.bankAccount').value.trim();
        const code = form.querySelector('.bankCode').value.trim();
        const name = form.querySelector('.bankName').value.trim();
        if (!account || !code || !name) { feedback.innerHTML = '<span class="text-red-600">Payment details required.</span>'; return; }
        if (method === 'momo' && !['MTN','VOD','TGO'].includes(code.toUpperCase())) { feedback.innerHTML = '<span class="text-red-600">MoMo provider must be MTN, VOD, or TGO.</span>'; return; }
        if (!['paystack'].includes(provider)) { feedback.innerHTML = '<span class="text-red-600">Invalid provider.</span>'; return; }

        feedback.innerHTML = `<span class="text-blue-600">Initiating ${provider} payout…</span>`;
        try {
          const { data, error } = await sb.functions.invoke(`${provider}-payout`, {
            method: 'POST',
            body: { payroll_entry_id: payrollId, staff_id: staffId, amount, method, reason: 'Payroll payout', bank_account_number: account, bank_code: code, bank_name: name }
          });
          if (error) throw new Error(error.message || 'Payout request failed');
          feedback.innerHTML = data.success
            ? `<span class="text-green-700">Initiated: ${escapeHtml(data.reference)}</span>`
            : `<span class="text-red-600">${escapeHtml(data.error || 'Failed')}</span>`;
          if (data.success) setTimeout(() => renderPayments(el), 1500);
        } catch (err) {
          feedback.innerHTML = `<span class="text-red-600">${escapeHtml(err.message)}</span>`;
        }
      };
    });
  } catch (err) {
    el.innerHTML = `<p class="text-red-600 text-center mt-6">${escapeHtml(err.message || 'Could not load payables.')}</p>`;
  }
}
