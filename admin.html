function app() { return document.getElementById('app'); }

function waitForSupabaseThenStart(attemptsLeft) {
  if (window.supabase && window.supabase.createClient) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    init();
    return;
  }
  if (attemptsLeft <= 0) {
    app().innerHTML = `<div class="bg-white rounded-2xl p-6 text-center shadow-sm mt-10">
      <p class="text-red-600">Couldn't load. Check your internet connection and reload.</p></div>`;
    return;
  }
  setTimeout(() => waitForSupabaseThenStart(attemptsLeft - 1), 300);
}

async function init() {
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) { await checkOnboarding(); }
  render();
}

async function checkOnboarding() {

  const { data: companyId, error } = await sb.rpc('my_company_id');
  if (error) {
    const match = /ACCOUNT_SUSPENDED:(\w+)/.exec(error.message || '');
    if (match) { accountSuspendedStatus = match[1]; needsOnboarding = false; return; }
    errorMsg = error.message;
    return;
  }
  sessionCompanyId = companyId;
  if (!companyId) {
    needsOnboarding = true;
  } else {
    needsOnboarding = false;
    const { data: co } = await sb.from('companies').select('name').eq('id', companyId).maybeSingle();
    sessionCompanyName = co ? co.name : '';
    await loadAll();
  }
}

async function login() {
  errorMsg = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: loginEmail, password: loginPassword });
  loginEmail = '';
  loginPassword = '';
  if (error) { errorMsg = error.message; render(); return; }
  session = data.session;
  await checkOnboarding();
  render();
}

async function logout() {
  await sb.auth.signOut();
  session = null;
  render();
}

async function loadAll() {
  const [s1, s2, s3, s4, s5, s6, cnt, s7, s8] = await Promise.all([
    sb.from('sites').select('*').order('name'),
    sb.from('staff').select('*, sites(name)', { count: 'exact' }).order('full_name')
      .range(staffPage * PAGE_SIZE, staffPage * PAGE_SIZE + PAGE_SIZE - 1),
    sb.rpc('todays_attendance', { p_limit: PAGE_SIZE, p_offset: attendancePage * PAGE_SIZE }),
    sb.from('payroll_periods').select('*').order('period_start', { ascending: false }),
    sb.from('company_settings').select('*').maybeSingle(),
    sb.from('deduction_types').select('*').eq('active', true).order('category'),
    sb.from('staff').select('id', { count: 'exact', head: true }).eq('active', true),
    sb.from('staff').select('id, full_name').eq('active', true).order('full_name'),
    sb.from('help_content').select('*').order('category').order('sort_order')
  ]);
  sites = s1.data || [];
  staffList = s2.data || [];
  staffTotal = s2.count || 0;
  attendanceToday = s3.data || [];
  attendanceTotal = cnt.count || 0;
  payrollPeriods = s4.data || [];
  backupSettings = s5.data || { backup_drive_folder_id: '', backup_owner_email: '', backup_enabled: false };
  deductionTypes = s6.data || [];
  staffOptionsList = (s7 && s7.data) || [];
  helpContent = (s8 && s8.data) || [];
}

function openPrintWindow(title, bodyHtml) {
  const w = window.open('', '_blank', 'width=900,height=700');
  if (!w) { alert('Please allow pop-ups for this site to print or save as PDF.'); return; }
  w.document.write(`<!DOCTYPE html><html><head><title>${title}</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <style>@page { margin: 1.2cm; } body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }</style>
    </head><body class="p-6">${bodyHtml}</body></html>`);
  w.document.close();
  const doPrint = () => { try { w.focus(); w.print(); } catch (e) {} };
  w.onload = doPrint;
  setTimeout(doPrint, 600); // fallback in case onload fires before Tailwind CDN finishes
}

function mailtoSummary(subject, bodyText) {
  window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;
}

function pagerHtml(page, total, idPrefix) {
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  return `<div class="flex items-center gap-3 text-sm mt-3">
    <button id="${idPrefix}Prev" class="px-3 py-1 rounded-lg border ${page === 0 ? 'opacity-40 cursor-not-allowed' : ''}" ${page === 0 ? 'disabled' : ''}>Prev</button>
    <span class="text-gray-500">Page ${page + 1} of ${pages} (${total} total)</span>
    <button id="${idPrefix}Next" class="px-3 py-1 rounded-lg border ${page + 1 >= pages ? 'opacity-40 cursor-not-allowed' : ''}" ${page + 1 >= pages ? 'disabled' : ''}>Next</button>
  </div>`;
}

  if (!session) { renderLogin(); return; }

  renderDashboard();
}

function statusColor(status) {
  if (status === 'PRESENT') return 'bg-green-100 text-green-800';
  if (status === 'LATE') return 'bg-orange-100 text-orange-800';
  if (status === 'SICK') return 'bg-purple-100 text-purple-800';
  if (status === 'OFF') return 'bg-gray-200 text-gray-700';
  if (status === 'OTHER') return 'bg-yellow-100 text-yellow-800';
  return 'bg-red-100 text-red-800'; // ABSENT / default
}

function renderStaff(el) {

  const countryOptions = countries.map(c => `<option value="${c}">${c}</option>`).join('');
  const siteOptionsFor = country => sites.filter(s => !country || s.country === country)

  const rows = staffList.map(s => `
    <tr class="border-b">
      <td class="py-2 px-3"><input type="checkbox" class="staffCheck" data-id="${s.id}"></td>
      <td class="py-2 px-3">${s.full_name}${s.staff_code ? `<div class="text-xs text-gray-400">${s.staff_code}</div>` : ''}</td>
      <td class="py-2 px-3">${s.phone}</td>
      <td class="py-2 px-3">${s.sites ? s.sites.name : '—'}</td>
      <td class="py-2 px-3">${s.pay_type === 'monthly'
        ? `GHS <span id="rate-${s.id}">${s.monthly_salary}/mo</span>`
        : `GHS <span id="rate-${s.id}">${s.weekday_rate} / ${s.weekend_rate}</span>`}
        <button class="editRateBtn text-xs text-blue-600 ml-1" data-id="${s.id}" data-weekday="${s.weekday_rate}" data-weekend="${s.weekend_rate}">edit</button>
      </td>
      <td class="py-2 px-3">${s.active ? '✅' : '⛔'}</td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
      <h2 class="font-medium mb-3">Add Staff</h2>
      <div class="grid grid-cols-2 gap-2">
        <input id="f_name" placeholder="Full name" class="border rounded-lg px-3 py-2 text-sm">
        <input id="f_phone" placeholder="Phone" class="border rounded-lg px-3 py-2 text-sm">
        <input id="f_pin" placeholder="4-digit PIN" class="border rounded-lg px-3 py-2 text-sm">
        <input id="f_staffcode" placeholder="Staff Code (optional)" class="border rounded-lg px-3 py-2 text-sm">
        <input id="f_ssnit" placeholder="SSNIT Number (optional)" class="border rounded-lg px-3 py-2 text-sm">
        <select id="f_country" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">All countries</option>${countryOptions}
        </select>
        <select id="f_site" class="border rounded-lg px-3 py-2 text-sm col-span-2">${siteOptionsFor('') || '<option value="">Add a site first</option>'}</select>
        <select id="f_paytype" class="border rounded-lg px-3 py-2 text-sm col-span-2">
          <option value="daily">Daily / weekday-weekend rates</option>
          <option value="monthly">Fixed monthly salary</option>
        </select>
        <input id="f_weekday" placeholder="Weekday rate (GHS)" type="number" class="border rounded-lg px-3 py-2 text-sm">
        <input id="f_weekend" placeholder="Weekend rate (GHS)" type="number" class="border rounded-lg px-3 py-2 text-sm">
        <input id="f_salary" placeholder="Monthly salary (GHS)" type="number" class="border rounded-lg px-3 py-2 text-sm col-span-2 hidden opacity-40" disabled>
      </div>
      ${errorMsg ? `<p class="text-red-600 text-sm mt-2">${errorMsg}</p>` : ''}
      <button id="addStaffBtn" class="mt-3 bg-[#0d2a4d] text-white rounded-xl px-4 py-2 text-sm font-medium">Add Staff</button>
    </div>
    <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
      <h2 class="font-medium mb-2">Bulk Import from Excel</h2>
      <p class="text-xs text-gray-500 mb-2">Columns (any order, case-insensitive): Full Name, Phone, PIN, Site, Pay Type (daily/monthly), Weekday Rate, Weekend Rate, Monthly Salary, Staff Code, SSNIT Number. Site names must match an existing site exactly.</p>
      <input id="bulkFile" type="file" accept=".xlsx,.xls,.csv" class="text-sm">
      <div id="bulkResult" class="text-sm mt-2"></div>
    </div>
    <div class="bg-white rounded-2xl p-4 shadow-sm overflow-x-auto">
      <button id="deleteStaffBtn" class="hidden mb-3 bg-red-600 text-white rounded-xl px-4 py-2 text-sm font-medium">Delete Selected</button>
      <table class="w-full text-sm text-left">
        <thead><tr class="border-b text-gray-500">
          <th class="py-2 px-3"></th><th class="py-2 px-3">Name</th><th class="py-2 px-3">Phone</th><th class="py-2 px-3">Site</th>
          <th class="py-2 px-3">Rates</th><th class="py-2 px-3">Active</th>
        </tr></thead>
        <tbody>${rows || '<tr><td class="py-4 px-3 text-gray-400" colspan="6">No staff yet.</td></tr>'}</tbody>
      </table>
      ${pagerHtml(staffPage, staffTotal, 'staff')}
    </div>`;

  document.getElementById('staffPrev').onclick = () => { if (staffPage > 0) { staffPage--; loadAll().then(() => renderStaff(el)); } };
  document.getElementById('staffNext').onclick = () => {
    if ((staffPage + 1) * PAGE_SIZE < staffTotal) { staffPage++; loadAll().then(() => renderStaff(el)); }
  };

  document.getElementById('f_country').onchange = e => {
    document.getElementById('f_site').innerHTML = siteOptionsFor(e.target.value) || '<option value="">No sites in this country yet</option>';
  };

  const weekdayInput = document.getElementById('f_weekday');
  const weekendInput = document.getElementById('f_weekend');
  const salaryInput = document.getElementById('f_salary');
  document.getElementById('f_paytype').onchange = e => {
    const isMonthly = e.target.value === 'monthly';
    [weekdayInput, weekendInput].forEach(inp => { inp.disabled = isMonthly; inp.classList.toggle('opacity-40', isMonthly); });
    salaryInput.disabled = !isMonthly;
    salaryInput.classList.toggle('hidden', !isMonthly);
    salaryInput.classList.toggle('opacity-40', !isMonthly);
  };

  document.getElementById('bulkFile').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const resultEl = document.getElementById('bulkResult');
    resultEl.textContent = 'Reading file…';

    const pick = (row, ...keys) => {
      for (const k of Object.keys(row)) {
        if (keys.includes(k.trim().toLowerCase())) return row[k];
      }
      return '';
    };

    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(sheet, { defval: '' });

      const rows = raw.map(r => ({
        full_name: String(pick(r, 'full name', 'name', 'fullname')).trim(),
        phone: String(pick(r, 'phone', 'phone number')).trim(),
        pin: String(pick(r, 'pin', 'pin code')).trim(),
        site_name: String(pick(r, 'site', 'site name')).trim(),
        pay_type: String(pick(r, 'pay type', 'paytype')).trim().toLowerCase() === 'monthly' ? 'monthly' : 'daily',
        weekday_rate: parseFloat(pick(r, 'weekday rate', 'weekday')) || 0,
        weekend_rate: parseFloat(pick(r, 'weekend rate', 'weekend')) || 0,
        monthly_salary: parseFloat(pick(r, 'monthly salary', 'salary')) || 0,
        staff_code: String(pick(r, 'staff code', 'staffcode')).trim(),
        ssnit_number: String(pick(r, 'ssnit number', 'ssnit')).trim(),
      })).filter(r => r.full_name && r.phone && r.pin);

      if (rows.length === 0) {
        resultEl.innerHTML = '<span class="text-red-600">No valid rows found — check Full Name, Phone, and PIN columns are filled in.</span>';
        return;
      }

      resultEl.textContent = `Importing ${rows.length} row(s)…`;
      const { data, error } = await sb.rpc('bulk_import_staff', { p_rows: rows });
      if (error) { resultEl.innerHTML = `<span class="text-red-600">${error.message}</span>`; return; }

      const okCount = data.filter(r => r.success).length;
      const failed = data.filter(r => !r.success);
      let html = `<span class="text-green-700">${okCount} of ${data.length} imported successfully.</span>`;
      if (failed.length) {
        html += '<ul class="text-red-600 mt-1 list-disc list-inside">' +
          failed.map(f => `<li>Row ${f.row_index} (${f.full_name || 'unnamed'}): ${f.error}</li>`).join('') + '</ul>';
      }
      resultEl.innerHTML = html;
      await loadAll();
      renderStaff(el);
    } catch (err) {
      resultEl.innerHTML = `<span class="text-red-600">Could not read file: ${err.message}</span>`;
    }
  };

  document.querySelectorAll('.editRateBtn').forEach(btn => {
    btn.onclick = async () => {
      const newWeekday = prompt('New weekday rate (GHS):', btn.dataset.weekday);
      if (newWeekday === null) return;
      const newWeekend = prompt('New weekend rate (GHS):', btn.dataset.weekend);
      if (newWeekend === null) return;
      const { error } = await sb.from('staff').update({
        weekday_rate: parseFloat(newWeekday) || 0,
        weekend_rate: parseFloat(newWeekend) || 0
      }).eq('id', btn.dataset.id);
      if (error) { errorMsg = error.message; renderStaff(el); return; }
      await loadAll();
      render();
    };
  });

  const deleteBtn = document.getElementById('deleteStaffBtn');
  document.querySelectorAll('.staffCheck').forEach(cb => {
    cb.onchange = () => {
      const anyChecked = document.querySelectorAll('.staffCheck:checked').length > 0;
      deleteBtn.classList.toggle('hidden', !anyChecked);
    };
  });
  deleteBtn.onclick = async () => {
    const ids = Array.from(document.querySelectorAll('.staffCheck:checked')).map(cb => cb.dataset.id);
    if (ids.length === 0) return;
    if (!confirm(`Delete ${ids.length} staff member(s)? This also deletes their attendance history.`)) return;
    const { error } = await sb.from('staff').delete().in('id', ids);
    if (error) { errorMsg = error.message; renderStaff(el); return; }
    await loadAll();
    render();
  };

  document.getElementById('addStaffBtn').onclick = async () => {
    errorMsg = '';
    const name = document.getElementById('f_name').value.trim();
    const phone = document.getElementById('f_phone').value.trim();
    const pin = document.getElementById('f_pin').value.trim();
    const siteId = document.getElementById('f_site').value;
    const payType = document.getElementById('f_paytype').value;
    const weekday = parseFloat(document.getElementById('f_weekday').value || '0');
    const weekend = parseFloat(document.getElementById('f_weekend').value || '0');
    const salary = parseFloat(document.getElementById('f_salary').value || '0');
    const staffCode = document.getElementById('f_staffcode').value.trim();
    const ssnit = document.getElementById('f_ssnit').value.trim();

    if (!name || !phone || pin.length !== 4 || !siteId) {
      errorMsg = 'Fill in name, phone, a 4-digit PIN, and choose a site.';
      renderStaff(el);
      return;
    }

    try {
      const { data: hashed, error: hashErr } = await sb.rpc('hash_pin', { p_pin: pin });
      if (hashErr) { errorMsg = hashErr.message; renderStaff(el); return; }

      const { data: companyId } = await sb.rpc('my_company_id');
      const { error } = await sb.from('staff').insert({
        company_id: companyId,
        site_id: siteId, full_name: name, phone, pin_hash: hashed,
        pay_type: payType,
        weekday_rate: payType === 'monthly' ? 0 : weekday,
        weekend_rate: payType === 'monthly' ? 0 : weekend,
        monthly_salary: payType === 'monthly' ? salary : 0,
        staff_code: staffCode || null, ssnit_number: ssnit || null
      });
      if (error) { errorMsg = error.message; renderStaff(el); return; }
      await loadAll();
      render();
    } catch (e) {
      errorMsg = 'Unexpected error: ' + e.message;
      renderStaff(el);
    }
  };
}

      ${groupHtml || '<p class="text-gray-400">No sites yet.</p>'}

      await loadAll();

  if (deleteBtn) {
    document.querySelectorAll('.gpCheck').forEach(cb => {
      cb.onchange = () => {
        const any = document.querySelectorAll('.gpCheck:checked').length > 0;
        deleteBtn.classList.toggle('hidden', !any);
      };
    });
    deleteBtn.onclick = async () => {
      const ids = Array.from(document.querySelectorAll('.gpCheck:checked')).map(cb => cb.dataset.id);
      if (ids.length === 0) return;
      if (!confirm(`Remove ${ids.length} staff from this payroll run?`)) return;
      for (const id of ids) {
        await sb.rpc('remove_payroll_staging_row', { p_id: id });
      }
      stagingRows = stagingRows.filter(r => !ids.includes(r.id));
      renderGeneralPayroll(el);
    };
  }

  document.getElementById('gpImportBtn').onclick = async () => {
    errorMsg = '';
    gpStart = document.getElementById('gpStartInput').value;
    gpEnd = document.getElementById('gpEndInput').value;
    if (!gpStart || !gpEnd) { errorMsg = 'Choose both dates.'; renderGeneralPayroll(el); return; }
    const { data, error } = await sb.rpc('import_staff_to_payroll_staging', { p_start: gpStart, p_end: gpEnd });
    if (error) { errorMsg = error.message; renderGeneralPayroll(el); return; }
    stagingRows = data || [];
    stagingEdits = {};
    renderGeneralPayroll(el);
  };

  const applyBtn = document.getElementById('gpApplyAllBtn');
  if (applyBtn) applyBtn.onclick = async () => {
    errorMsg = '';
    for (const r of stagingRows) {
      const e = edit(r.id);
      const excluded = e.included === false;
      const dVal = excluded ? 0 : (parseFloat(e.dVal || '0') || 0);
      const aVal = excluded ? 0 : (parseFloat(e.aVal || '0') || 0);
      const dAmount = e.dMode === 'pct' ? Number(r.gross_pay) * dVal / 100 : dVal;
      const aAmount = e.aMode === 'pct' ? Number(r.gross_pay) * aVal / 100 : aVal;
      const { error } = await sb.rpc('update_payroll_staging_row', {
        p_id: r.id,
        p_deductions: dVal ? { manual: dAmount } : {},
        p_allowances: aVal ? { manual: aAmount } : {}
      });
      if (error) { errorMsg = `${r.staff_name}: ${error.message}`; renderGeneralPayroll(el); return; }
    }
    const { data, error } = await sb.rpc('apply_all_payroll_staging', { p_start: gpStart, p_end: gpEnd });
    if (error) { errorMsg = error.message; renderGeneralPayroll(el); return; }
    stagingRows = data || [];
    renderGeneralPayroll(el);
  };

  const undoBtn = document.getElementById('gpUndoBtn');
  if (undoBtn) undoBtn.onclick = async () => {
    if (!confirm('Clear this working payroll sheet? Nothing has been saved yet, so this cannot be undone.')) return;
    const { error } = await sb.rpc('undo_payroll_staging', { p_start: gpStart, p_end: gpEnd });
    if (error) { errorMsg = error.message; renderGeneralPayroll(el); return; }
    stagingRows = [];
    stagingEdits = {};
    renderGeneralPayroll(el);
  };

  const saveBtn = document.getElementById('gpSaveBtn');
  if (saveBtn) saveBtn.onclick = async () => {
    if (!confirm(`Save this payroll for ${gpStart} to ${gpEnd}? This cannot be edited afterward.`)) return;
    const { error } = await sb.rpc('save_payroll_staging', { p_start: gpStart, p_end: gpEnd });
    if (error) { errorMsg = error.message; renderGeneralPayroll(el); return; }
    alert('Payroll saved to history.');
    stagingRows = [];
    stagingEdits = {};
    await loadAll();
    renderGeneralPayroll(el);
  };
}

async function renderHistory(el) {
  if (payrollPeriods.length === 0) {
    el.innerHTML = `
      <div class="rounded-t-2xl bg-[#6d28d9] text-white font-bold text-lg px-5 py-3">PAYROLL HISTORY</div>
      <div class="bg-white rounded-b-2xl p-6 text-center shadow-sm">
        <p class="text-gray-400">No payroll periods saved yet. Close a period from the Payroll tab first.</p></div>`;
    return;
  }

  const periodRows = payrollPeriods.map(p => `
    <div class="bg-white shadow-sm mb-3 overflow-hidden rounded-xl border border-gray-100">
      <div class="flex items-center">
        <button data-period="${p.id}" class="periodToggle flex-1 text-left px-4 py-3 flex justify-between items-center hover:bg-gray-50">
          <span class="font-medium">${p.period_start} → ${p.period_end}</span>
          <span class="flex items-center gap-2">
            <span class="text-xs px-2 py-1 rounded bg-purple-100 text-purple-800 font-semibold">${p.status}</span>
            <span class="text-sm text-gray-400">${expandedPeriodId === p.id ? '▲' : '▼'}</span>
          </span>
        </button>
        <button data-delete-period="${p.id}" class="deletePeriodBtn text-red-600 text-xs px-3 hover:underline">Delete</button>
      </div>
      <div id="entries-${p.id}">${expandedPeriodId === p.id ? renderEntriesTable() : ''}</div>
    </div>`).join('');

  el.innerHTML = `
    <div class="rounded-t-2xl bg-[#6d28d9] text-white font-bold text-lg px-5 py-3">PAYROLL HISTORY</div>
    ${errorMsg ? `<p class="text-red-600 text-sm bg-white px-4 pt-3">${errorMsg}</p>` : ''}
    <div class="bg-gray-50 rounded-b-2xl p-3">${periodRows}</div>`;

  document.querySelectorAll('.deletePeriodBtn').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      errorMsg = '';
      const id = btn.dataset.deletePeriod;
      if (!confirm('Delete this payroll period permanently? This cannot be undone.')) return;
      try {
        const { error } = await sb.rpc('delete_payroll_period', { p_period_id: id });
        if (error) { errorMsg = error.message; renderHistory(el); return; }
        await loadAll();
        render();
      } catch (e2) {
        errorMsg = 'Unexpected error: ' + e2.message;
        renderHistory(el);
      }
    };
  });

  document.querySelectorAll('.periodToggle').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.period;
      if (expandedPeriodId === id) {
        expandedPeriodId = null;
        renderHistory(el);
        return;
      }
      const { data, error } = await sb.from('payroll_entries')
        .select('*, staff(full_name)')
        .eq('payroll_period_id', id);
      if (error) { errorMsg = error.message; renderHistory(el); return; }
      expandedPeriodEntries = data || [];
      expandedPeriodId = id;
      renderHistory(el);
    };
  });

  const printHistBtn = document.getElementById('printHistoryBtn');
  if (printHistBtn) printHistBtn.onclick = () => {
    const period = payrollPeriods.find(p => p.id === expandedPeriodId);
    const total = expandedPeriodEntries.reduce((sum, r) => sum + Number(r.net_pay ?? r.total_pay ?? 0), 0);
    const rowsHtml = expandedPeriodEntries.map(r => `
      <tr class="border-b">
        <td class="py-2 px-3">${r.staff ? r.staff.full_name : '(deleted staff)'}</td>
        <td class="py-2 px-3">GHS ${Number(r.gross_pay ?? r.total_pay ?? 0).toFixed(2)}</td>
        <td class="py-2 px-3">-GHS ${Number(r.total_deductions ?? 0).toFixed(2)}</td>
        <td class="py-2 px-3">+GHS ${Number(r.total_allowances ?? 0).toFixed(2)}</td>
        <td class="py-2 px-3 font-semibold">GHS ${Number(r.net_pay ?? r.total_pay ?? 0).toFixed(2)}</td>
      </tr>`).join('');
    const html = `
      <h1 class="text-xl font-bold text-[#0d2a4d] mb-1">${sessionCompanyName}</h1>
      <p class="text-sm text-gray-500 mb-4">Payroll History: ${period ? period.period_start + ' to ' + period.period_end : ''}</p>
      <table class="w-full text-sm text-left border-collapse">
        <thead><tr class="border-b-2 border-gray-800">
          <th class="py-2 px-3">Staff Name</th><th class="py-2 px-3">Gross</th><th class="py-2 px-3">Deductions</th><th class="py-2 px-3">Allowances</th><th class="py-2 px-3">Net Pay</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <p class="text-right font-bold text-lg mt-4">Grand Total: GHS ${total.toFixed(2)}</p>`;
    openPrintWindow(`Payroll History ${period ? period.period_start + ' to ' + period.period_end : ''}`, html);
  };

  const emailHistBtn = document.getElementById('emailHistoryBtn');
  if (emailHistBtn) emailHistBtn.onclick = () => {
    const period = payrollPeriods.find(p => p.id === expandedPeriodId);
    const total = expandedPeriodEntries.reduce((sum, r) => sum + Number(r.net_pay ?? r.total_pay ?? 0), 0);
    const lines = expandedPeriodEntries.map(r => `${r.staff ? r.staff.full_name : '(deleted staff)'}: Gross GHS ${Number(r.gross_pay ?? r.total_pay ?? 0).toFixed(2)}, Deductions -GHS ${Number(r.total_deductions ?? 0).toFixed(2)}, Allowances +GHS ${Number(r.total_allowances ?? 0).toFixed(2)}, Net GHS ${Number(r.net_pay ?? r.total_pay ?? 0).toFixed(2)}`);
    const body = `Payroll History for ${sessionCompanyName}\nPeriod: ${period ? period.period_start + ' to ' + period.period_end : ''}\n\n${lines.join('\n')}\n\nGrand Total: GHS ${total.toFixed(2)}`;
    mailtoSummary(`Payroll History ${period ? period.period_start + ' to ' + period.period_end : ''} — ${sessionCompanyName}`, body);
  };
}

function categoryColor(cat) {
  if (cat === 'deduction') return 'bg-red-100 text-red-800';
  if (cat === 'allowance') return 'bg-green-100 text-green-800';
  if (cat === 'overtime') return 'bg-blue-100 text-blue-800';
  return 'bg-purple-100 text-purple-800'; // bonus
}

function renderDeductions(el) {
  const typeRows = deductionTypes.map(dt => `
    <div class="flex items-center justify-between border-b py-2 px-2">
      <div>
        <span class="font-medium text-sm">${dt.name}</span>
        <span class="ml-2 px-2 py-0.5 rounded text-xs font-semibold ${categoryColor(dt.category)}">${dt.category}</span>
        ${dt.company_id === null ? '<span class="ml-1 text-xs text-gray-400">(platform default)</span>' : ''}
      </div>
      <span class="text-xs text-gray-500">${dt.calc_method.replace('_',' ')}</span>
    </div>`).join('');

  const staffOptions = staffOptionsList.map(s => `<option value="${s.id}" ${dedSelectedStaffId === s.id ? 'selected' : ''}>${s.full_name}</option>`).join('');

  const checklistHtml = dedSelectedStaffId ? deductionTypes.map(dt => {
    const setting = dedStaffSettings[dt.id] || { enabled: false, override_percentage: null, override_amount: null };
    const showOverride = setting.enabled;
    const overrideLabel = dt.calc_method === 'flat_percentage' ? '% override' : dt.calc_method === 'flat_amount' ? 'Amount override' : null;
    return `
      <div class="border-b py-2 px-2">
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" class="dedCheck" data-type="${dt.id}" ${setting.enabled ? 'checked' : ''}>
          <span>${dt.name}</span>
          <span class="px-2 py-0.5 rounded text-xs font-semibold ${categoryColor(dt.category)}">${dt.category}</span>
        </label>
        ${showOverride && overrideLabel ? `
          <input type="number" step="0.01" class="dedOverride mt-1 ml-6 border rounded-lg px-2 py-1 text-xs w-32"
            data-type="${dt.id}" placeholder="${overrideLabel} (optional)"
            value="${dt.calc_method === 'flat_percentage' ? (setting.override_percentage ?? '') : (setting.override_amount ?? '')}">
        ` : ''}
      </div>`;
  }).join('') : '';

  const previewHtml = dedPreview ? `
    <div class="bg-white rounded-2xl p-4 shadow-sm mt-4">
      <h3 class="font-medium mb-2">Live Preview — ${dedPreview.full_name}</h3>
      <div class="text-sm space-y-1">
        <div class="flex justify-between"><span>Gross Pay</span><span>GHS ${Number(dedPreview.gross_pay).toFixed(2)}</span></div>
        ${dedPreview.lines.map(l => `
          <div class="flex justify-between text-gray-600">
            <span>${l.label} (${l.category})</span>
            <span>${l.category === 'deduction' ? '−' : '+'} GHS ${Number(l.amount).toFixed(2)}</span>
          </div>`).join('')}
        <div class="flex justify-between border-t pt-1 font-semibold"><span>Net Pay</span><span>GHS ${Number(dedPreview.net_pay).toFixed(2)}</span></div>
      </div>
    </div>` : '';

  el.innerHTML = `
    <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
      <h2 class="font-medium mb-3">Add New Tax / Deduction / Allowance</h2>
      <div class="grid grid-cols-2 gap-2">
        <input id="newDedName" placeholder="Name (e.g. Transport Allowance)" class="border rounded-lg px-3 py-2 text-sm col-span-2">
        <select id="newDedCategory" class="border rounded-lg px-3 py-2 text-sm">
          <option value="deduction">Deduction</option>
          <option value="allowance">Allowance</option>
          <option value="overtime">Overtime</option>
          <option value="bonus">Bonus</option>
        </select>
        <select id="newDedMethod" class="border rounded-lg px-3 py-2 text-sm">
          <option value="flat_percentage">Flat % of gross pay</option>
          <option value="flat_amount">Flat amount (GHS)</option>
        </select>
        <input id="newDedValue" type="number" step="0.01" placeholder="Rate (% or GHS amount)" class="border rounded-lg px-3 py-2 text-sm col-span-2">
      </div>
      <p class="text-xs text-gray-400 mt-2">Tiered tax bands (like PAYE) are pre-loaded and updated via support — ask if you need custom bands.</p>
      ${errorMsg ? `<p class="text-red-600 text-sm mt-2">${errorMsg}</p>` : ''}
      <button id="addDedBtn" class="mt-3 bg-[#0b3d2e] text-white rounded-xl px-4 py-2 text-sm font-medium">Add</button>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
      <h2 class="font-medium mb-2">Available Deductions &amp; Allowances</h2>
      ${typeRows || '<p class="text-gray-400 text-sm">None yet.</p>'}
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h2 class="font-medium mb-2">Assign to Staff</h2>
      <div class="flex gap-2 flex-wrap items-end mb-3">
        <select id="dedStaffSelect" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Choose staff…</option>${staffOptions}
        </select>
        <div><label class="text-xs text-gray-500 block mb-1">Preview period start</label>
          <input id="dedPStart" type="date" value="${dedPreviewStart}" class="border rounded-lg px-3 py-2 text-sm"></div>
        <div><label class="text-xs text-gray-500 block mb-1">Preview period end</label>
          <input id="dedPEnd" type="date" value="${dedPreviewEnd}" class="border rounded-lg px-3 py-2 text-sm"></div>
      </div>
      ${checklistHtml}
    </div>
    ${previewHtml}
  `;

  document.getElementById('addDedBtn').onclick = async () => {
    errorMsg = '';
    const name = document.getElementById('newDedName').value.trim();
    const category = document.getElementById('newDedCategory').value;
    const method = document.getElementById('newDedMethod').value;
    const value = parseFloat(document.getElementById('newDedValue').value || '0');
    if (!name) { errorMsg = 'Enter a name.'; renderDeductions(el); return; }
    const { error } = await sb.rpc('add_deduction_type', {
      p_name: name, p_category: category, p_calc_method: method,
      p_flat_percentage: method === 'flat_percentage' ? value : null,
      p_flat_amount: method === 'flat_amount' ? value : null
    });
    if (error) { errorMsg = error.message; renderDeductions(el); return; }
    await loadAll();
    render();
  };

  document.getElementById('dedStaffSelect').onchange = async (e) => {
    dedSelectedStaffId = e.target.value;
    dedStaffSettings = {};
    dedPreview = null;
    if (dedSelectedStaffId) {
      const { data } = await sb.from('staff_deduction_settings').select('*').eq('staff_id', dedSelectedStaffId);
      (data || []).forEach(row => { dedStaffSettings[row.deduction_type_id] = row; });
      await refreshDedPreview();
    }
    renderDeductions(el);
  };

  document.getElementById('dedPStart').onchange = async (e) => { dedPreviewStart = e.target.value; await refreshDedPreview(); renderDeductions(el); };
  document.getElementById('dedPEnd').onchange = async (e) => { dedPreviewEnd = e.target.value; await refreshDedPreview(); renderDeductions(el); };

  document.querySelectorAll('.dedCheck').forEach(cb => {
    cb.onchange = async () => {
      const typeId = cb.dataset.type;
      const existing = dedStaffSettings[typeId] || {};
      await saveStaffDeduction(typeId, cb.checked, existing.override_percentage, existing.override_amount);
      renderDeductions(el);
    };
  });

  document.querySelectorAll('.dedOverride').forEach(inp => {
    inp.onchange = async () => {
      const typeId = inp.dataset.type;
      const dt = deductionTypes.find(d => d.id === typeId);
      const val = inp.value === '' ? null : parseFloat(inp.value);
      const pct = dt.calc_method === 'flat_percentage' ? val : null;
      const amt = dt.calc_method === 'flat_amount' ? val : null;
      await saveStaffDeduction(typeId, true, pct, amt);
      renderDeductions(el);
    };
  });
}

async function saveStaffDeduction(typeId, enabled, overridePct, overrideAmt) {
  const { error } = await sb.rpc('set_staff_deduction', {
    p_staff_id: dedSelectedStaffId, p_deduction_type_id: typeId, p_enabled: enabled,
    p_override_percentage: overridePct ?? null, p_override_amount: overrideAmt ?? null
  });
  if (error) { errorMsg = error.message; return; }
  dedStaffSettings[typeId] = { deduction_type_id: typeId, enabled, override_percentage: overridePct, override_amount: overrideAmt };
  await refreshDedPreview();
}

async function refreshDedPreview() {
  if (!dedSelectedStaffId || !dedPreviewStart || !dedPreviewEnd) { dedPreview = null; return; }
  const { data, error } = await sb.rpc('compute_staff_payroll', {
    p_staff_id: dedSelectedStaffId, p_start: dedPreviewStart, p_end: dedPreviewEnd
  });
  if (!error) dedPreview = data;
}

  const s = backupSettings || {};
  const companyId = sessionCompanyId || '';
  const checkinLink = companyId ? `${window.location.origin}/checkin.html?c=${companyId}` : '';
  el.innerHTML = `
    <div class="bg-white rounded-2xl p-4 shadow-sm mb-4 max-w-lg">
      <h2 class="font-medium mb-1">Your Staff Check-In Link</h2>
      <p class="text-xs text-gray-500 mb-2">Share this with your staff (e.g. via WhatsApp). It only works for your company's staff.</p>
      <div class="flex gap-2">
        <input id="checkinLinkBox" readonly value="${checkinLink}" class="flex-1 border rounded-lg px-3 py-2 text-xs bg-gray-50">
        <button id="copyLinkBtn" class="bg-gray-700 text-white rounded-lg px-3 py-2 text-xs">Copy</button>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm mb-4 max-w-lg">
      <h2 class="font-medium mb-1">Daily Backup to Google Drive</h2>
      <p class="text-xs text-gray-500 mb-4">Every night at midnight, a full copy of this company's data is saved as a dated file in the Drive folder below. Any future admin can change this without touching any code.</p>

      <label class="text-xs text-gray-500 block mb-1">Google Drive Folder ID</label>
      <input id="folderIdInput" placeholder="e.g. 1AbCxyz..." value="${s.backup_drive_folder_id || ''}"
        class="w-full border rounded-lg px-3 py-2 text-sm mb-3">

      <label class="text-xs text-gray-500 block mb-1">Whose Drive is this? (label only, for your own reference)</label>
      <input id="ownerEmailInput" placeholder="e.g. hr@metosync.com" value="${s.backup_owner_email || ''}"
        class="w-full border rounded-lg px-3 py-2 text-sm mb-3">

      <label class="flex items-center gap-2 text-sm mb-4">
        <input id="enabledCheck" type="checkbox" ${s.backup_enabled ? 'checked' : ''}>
        Enable automatic midnight backup
      </label>

      ${errorMsg ? `<p class="text-red-600 text-sm mb-2">${errorMsg}</p>` : ''}
      <button id="saveSettingsBtn" class="bg-[#0d2a4d] text-white rounded-xl px-4 py-2 text-sm font-medium mr-2">Save Settings</button>
      <button id="backupNowBtn" class="bg-gray-700 text-white rounded-xl px-4 py-2 text-sm font-medium">💾 Backup Now</button>
      ${backupStatusMsg ? `<p class="text-sm mt-3">${backupStatusMsg}</p>` : ''}
    </div>`;

  document.getElementById('copyLinkBtn').onclick = () => {
    document.getElementById('checkinLinkBox').select();
    document.execCommand('copy');
  };

  document.getElementById('saveSettingsBtn').onclick = async () => {
    errorMsg = '';
    const folderId = document.getElementById('folderIdInput').value.trim();
    const ownerEmail = document.getElementById('ownerEmailInput').value.trim();
    const enabled = document.getElementById('enabledCheck').checked;
    const { data: companyId } = await sb.rpc('my_company_id');
    const { error } = await sb.from('company_settings').upsert({
      company_id: companyId,
      backup_drive_folder_id: folderId,
      backup_owner_email: ownerEmail,
      backup_enabled: enabled
    });
    if (error) { errorMsg = error.message; renderSettings(el); return; }
    await loadAll();
    render();
  };

  document.getElementById('backupNowBtn').onclick = async () => {
    backupStatusMsg = 'Backing up…';
    renderSettings(el);
    const { data, error } = await sb.functions.invoke('backup-now');
    if (error) { backupStatusMsg = '❌ ' + error.message; renderSettings(el); return; }
    if (data && data.ok) { backupStatusMsg = `✅ Saved ${data.fileName} to Drive.`; }
    else { backupStatusMsg = '❌ ' + (data?.error || 'Unknown error'); }
    renderSettings(el);
  };
}

waitForSupabaseThenStart(20);
</script>
</body>
</html>
