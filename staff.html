<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metosync - Staff Check-In</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="theme.css">
<script src="shared.js?v=6"></script>
<style>
  :root {
    --brand: #0d2a4d;
    --brand-light: #e6f0f8;
    --brand-accent: #10b981;
    --brand-accent-light: #d1fae5;
    --surface: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #ef4444;
    --warning: #f59e0b;
  }
  body { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); min-height: 100vh; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .staff-shell { max-width: 720px; }
  .staff-hero { background: linear-gradient(135deg, var(--brand) 0%, #155e75 100%); box-shadow: 0 10px 25px -5px rgba(13, 42, 77, 0.25); }
  .card-modern { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06); border: 1px solid rgba(255, 255, 255, 0.6); }
  .input-modern { transition: all 0.2s ease; border: 1px solid #e5e7eb; }
  .input-modern:focus { outline: none; border-color: var(--brand-accent); box-shadow: 0 0 0 3px var(--brand-accent-light); }
  .btn-primary { background: linear-gradient(135deg, var(--brand-accent) 0%, #059669 100%); color: white; border-radius: 1rem; padding: 0.875rem 1.5rem; font-weight: 600; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; border-radius: 1rem; padding: 0.875rem 1.5rem; font-weight: 600; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.25); }
  .link-muted { color: var(--muted); transition: color 0.15s; }
  .link-muted:hover { color: var(--brand); }
  .fade-in { animation: fadeIn 0.4s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .face { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff3c4 0%, #ffdb66 60%, #f5b942 100%); border: 5px solid #f5b942; position: relative; margin: 0 auto; box-shadow: 0 10px 0 #d99525, 0 20px 30px rgba(217, 149, 37, 0.25); animation: face-bounce 1.4s ease-in-out infinite alternate; }
  .face::before, .face::after { content: ''; position: absolute; top: 42px; width: 18px; height: 24px; border-radius: 50%; background: #263238; }
  .face::before { left: 32px; }
  .face::after { right: 32px; }
  .face .cheek { position: absolute; top: 70px; width: 18px; height: 10px; border-radius: 50%; background: rgba(255, 120, 120, 0.35); }
  .face .cheek-left { left: 20px; }
  .face .cheek-right { right: 20px; }
  .face-mouth { position: absolute; left: 42px; top: 78px; width: 52px; height: 28px; border: 5px solid #263238; border-top: 0; border-radius: 0 0 60px 60px; }
  @keyframes face-bounce { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-10px) rotate(2deg); } }
  .pin-dots { letter-spacing: 0.5rem; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25); }
  .tab-active { color: var(--brand); background: var(--brand-light); border-bottom: 2px solid var(--brand-accent); }
  .alert-red { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  .alert-amber { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
  .alert-green { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
  .alert-blue { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
</style>
</head>
<body class="antialiased">
<main id="app" class="staff-shell mx-auto px-4 py-6 sm:py-12"></main>
<script>
const STORAGE_KEY = 'metosync_staff_session';
const companyCode = new URLSearchParams(window.location.search).get('company')?.trim() || '';
let screen = companyCode ? 'phone' : 'invalid-link';
let phone = '';
let challengeToken = '';
let sessionToken = localStorage.getItem(STORAGE_KEY) || '';
let staff = null;
let company = null;
let openAttendance = null;
let errorMessage = '';
let busy = false;
let gpsMessage = '';
let dashboardTab = 'records';
let pollTimer = null;
let lockoutSeconds = 0;
let isSuspended = false;
let pendingSyncCount = 0;
let isOnline = navigator.onLine;
let deviceStatus = 'trusted'; // 'trusted', 'unrecognized', 'pending'

const OFFLINE_QUEUE_DB = 'metosync_offline_queue';
const OFFLINE_QUEUE_STORE = 'pending_actions';

function openQueueDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(OFFLINE_QUEUE_DB, 1);
    request.onerror = () => reject(request.error);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(OFFLINE_QUEUE_STORE)) {
        db.createObjectStore(OFFLINE_QUEUE_STORE, { keyPath: 'id', autoIncrement: true });
      }
    };
    request.onsuccess = () => resolve(request.result);
  });
}

async function queueAction(action, latitude, longitude, accuracy) {
  const db = await openQueueDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(OFFLINE_QUEUE_STORE, 'readwrite');
    const store = tx.objectStore(OFFLINE_QUEUE_STORE);
    const record = {
      action,
      sessionToken,
      staffId: staff?.id,
      companyCode,
      latitude,
      longitude,
      accuracy,
      deviceTimestamp: new Date().toISOString(),
      createdAt: Date.now()
    };
    const request = store.add(record);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function getPendingActions() {
  const db = await openQueueDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(OFFLINE_QUEUE_STORE, 'readonly');
    const store = tx.objectStore(OFFLINE_QUEUE_STORE);
    const request = store.getAll();
    request.onsuccess = () => resolve(request.result || []);
    request.onerror = () => reject(request.error);
  });
}

async function removePendingAction(id) {
  const db = await openQueueDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(OFFLINE_QUEUE_STORE, 'readwrite');
    const store = tx.objectStore(OFFLINE_QUEUE_STORE);
    const request = store.delete(id);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

async function refreshPendingCount() {
  const pending = await getPendingActions();
  pendingSyncCount = pending.length;
  if (screen === 'dashboard') renderDashboard();
}

async function syncQueue() {
  if (!sessionToken || !navigator.onLine) return;
  const pending = await getPendingActions();
  if (!pending.length) { pendingSyncCount = 0; return; }
  for (const item of pending) {
    const rpc = item.action === 'in' ? 'staff_check_in' : 'staff_check_out';
    try {
      const { error } = await sb.rpc(rpc, {
        p_session_token: item.sessionToken,
        p_latitude: item.latitude,
        p_longitude: item.longitude,
        p_accuracy_meters: item.accuracy,
        p_device_timestamp: item.deviceTimestamp,
        p_is_offline_sync: true
      });
      if (error) {
        if (/session expired/i.test(error.message)) { clearSession('Your session expired. Please sign in again.'); return; }
        console.warn('Sync item failed:', error.message);
        continue;
      }
      await removePendingAction(item.id);
    } catch (error) {
      console.warn('Sync network error, will retry later:', error.message);
      return;
    }
  }
  await refreshPendingCount();
  if (screen === 'dashboard') { errorMessage = 'Offline records synced.'; render(); }
}

function doVibrate() {
  if ('vibrate' in navigator) navigator.vibrate([300, 150, 300, 150, 500]);
}

function playBeep() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.45);
  } catch (e) { console.warn('Beep failed', e); }
}

function alertStaffForLocation() {
  doVibrate();
  playBeep();
}

function app() { return document.getElementById('app'); }
function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])); }
function setError(message) { errorMessage = message || 'Something went wrong. Please try again.'; busy = false; render(); }
function loadingLabel(label) { return busy ? `${label}...` : label; }
function errorHtml() { return errorMessage ? `<div class="mt-4 rounded-xl alert-red px-4 py-3 text-sm font-medium fade-in" role="alert">${escapeHtml(errorMessage)}</div>` : ''; }
function formatDate(value) { return value ? new Date(`${value}T00:00:00`).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '-'; }
function formatTime(value) { return value ? new Date(value).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '-'; }
function formatMoney(value, currency) { return `${currency || ''} ${Number(value || 0).toFixed(2)}`.trim(); }

function header(title, subtitle) {
  const identity = company ? `<div class="flex items-center gap-3 mb-4 fade-in"><img src="${escapeHtml(company.logo_url || 'metosync-logo.png')}" alt="${escapeHtml(company.name)} logo" class="w-14 h-14 rounded-2xl object-contain bg-white/90 p-1 shadow-sm"><div><p class="text-xs uppercase tracking-widest text-white/80 font-semibold">Company Attendance</p><p class="font-semibold text-lg">${escapeHtml(company.name)}</p></div></div>` : '';
  return `<header class="staff-hero text-white rounded-2xl px-6 py-6 mb-6 fade-in">${identity}<div class="flex items-center justify-between gap-3"><h1 class="text-2xl font-bold tracking-tight">${title}</h1><span class="status-dot" title="Secure session"></span></div><p class="text-sm text-white/90 mt-2 font-medium">${subtitle}</p></header>`;
}
function render() {
  if (screen === 'invalid-link') return renderInvalidLink();
  if (screen === 'phone') return renderPhone();
  if (screen === 'pin') return renderPin();
  if (screen === 'suspended') return renderSuspended();
  if (screen === 'device') return renderDevice();
  if (screen === 'checkin') return renderCheckin();
  if (screen === 'checkout') return renderCheckout();
  if (screen === 'success') return renderSuccess();
  renderDashboard();
}
function renderInvalidLink() {
  app().innerHTML = `${header('Attendance link unavailable', 'This link is missing a company code.')}
    <section class="card-modern p-6 text-center"><p class="text-sm text-gray-600">Please ask your company administrator to send the official check-in link.</p></section>`;
}
function renderPhone() {
  app().innerHTML = `${header('Staff Check-In', 'Enter your phone number to continue.')}
    <section class="card-modern p-6"><label for="phoneInput" class="block text-sm font-semibold text-gray-700 mb-2">Phone number</label>
    <input id="phoneInput" type="tel" inputmode="tel" autocomplete="tel" class="w-full input-modern rounded-xl px-4 py-3 text-lg" placeholder="e.g. 050 123 4567" value="${escapeHtml(phone)}">
    <button id="continueBtn" type="button" class="btn-primary w-full mt-4">${loadingLabel('Continue')}</button>${errorHtml()}</section>`;
  const input = document.getElementById('phoneInput');
  input.focus();
  input.onkeydown = event => { if (event.key === 'Enter') beginLogin(); };
  document.getElementById('continueBtn').onclick = beginLogin;
}
async function beginLogin() {
  if (busy) return;
  phone = document.getElementById('phoneInput').value.trim();
  if (!phone) return setError('Enter your phone number.');
  busy = true; errorMessage = ''; render();
  try {
    const { data, error } = await sb.rpc('staff_start_login', { p_company_code: companyCode, p_phone: phone });
    if (error) throw error;
    if (!data || !data.length) throw new Error('We could not find an active staff account for that phone number.');
    challengeToken = data[0].challenge_token;
    company = { name: data[0].company_name, logo_url: data[0].company_logo_url, org_code: data[0].company_code };
    screen = 'pin'; busy = false; render();
  } catch (error) { setError(error.message); }
}
function renderPin() {
  const lockoutWarning = lockoutSeconds > 0
    ? `<div class="mt-4 rounded-xl alert-red px-4 py-3 text-sm font-medium fade-in" role="alert"><strong>Too many incorrect PIN attempts.</strong><br>You are locked out for <span id="lockoutCountdown">${lockoutSeconds}</span> seconds. Please wait.</div>`
    : '';
  const inputDisabled = lockoutSeconds > 0 ? 'disabled' : '';
  app().innerHTML = `${header('Enter your PIN', 'Use the 4-digit PIN provided by your administrator.')}
    <section class="card-modern p-6"><label for="pinInput" class="block text-sm font-semibold text-gray-700 mb-2">4-digit PIN</label>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]{4}" class="w-full input-modern rounded-xl px-4 py-3 text-2xl tracking-[0.6em] text-center" placeholder="••••" ${inputDisabled}>
    <button id="verifyBtn" type="button" class="btn-primary w-full mt-4" ${lockoutSeconds > 0 ? 'disabled' : ''}>${loadingLabel('Verify PIN')}</button><button id="backBtn" type="button" class="w-full mt-4 link-muted text-sm font-medium py-2">Use a different number</button>${lockoutWarning}${errorHtml()}</section>`;
  const input = document.getElementById('pinInput'); if (!lockoutSeconds) input.focus();
  input.oninput = () => { input.value = input.value.replace(/\D/g, '').slice(0, 4); };
  input.onkeydown = event => { if (event.key === 'Enter' && !lockoutSeconds) verifyPin(); };
  document.getElementById('verifyBtn').onclick = verifyPin;
  document.getElementById('backBtn').onclick = () => { screen = 'phone'; errorMessage = ''; lockoutSeconds = 0; render(); };
  if (lockoutSeconds > 0) startLockoutCountdown();
}

function startLockoutCountdown() {
  const el = document.getElementById('lockoutCountdown');
  if (!el || lockoutSeconds <= 0) return;
  const timer = setInterval(() => {
    lockoutSeconds--;
    if (el) el.textContent = lockoutSeconds;
    if (lockoutSeconds <= 0) { clearInterval(timer); render(); }
  }, 1000);
}

function renderSuspended() {
  app().innerHTML = `${header('Account suspended', 'Contact your administrator for assistance.')}
    <section class="card-modern p-6 text-center"><div class="mx-auto w-16 h-16 rounded-full bg-red-100 text-red-700 flex items-center justify-center text-3xl mb-4">&#128683;</div><h2 class="text-xl font-semibold text-gray-800">Access suspended</h2><p class="text-sm text-gray-500 mt-2">Your account has been locked after repeated failed PIN attempts. An admin must restore your access.</p><button id="backBtn" type="button" class="mt-4 link-muted text-sm font-medium py-2">Use a different number</button></section>`;
  document.getElementById('backBtn').onclick = () => { screen = 'phone'; errorMessage = ''; isSuspended = false; lockoutSeconds = 0; render(); };
}

function renderDevice() {
  const isPending = deviceStatus === 'pending';
  const title = isPending ? 'Approval request sent' : 'Unrecognized device';
  const message = isPending
    ? 'Your administrator has been notified. You will be able to check in once this device is approved.'
    : 'This device has not been used with your account before. Ask your administrator to approve it, or request approval below.';
  const actionButton = isPending
    ? ''
    : `<button id="requestApprovalBtn" type="button" class="btn-primary w-full mt-4">Request device approval</button>`;
  app().innerHTML = `${header(title, 'Device binding security check.')}
    <section class="card-modern p-6 text-center"><div class="mx-auto w-16 h-16 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center text-3xl mb-4">&#128241;</div>
    <h2 class="text-xl font-semibold text-gray-800">${title}</h2><p class="text-sm text-gray-500 mt-2">${message}</p>${actionButton}<button id="backBtn" type="button" class="w-full mt-4 link-muted text-sm font-medium py-2">Use a different number</button>${errorHtml()}</section>`;
  if (!isPending) document.getElementById('requestApprovalBtn').onclick = requestDeviceApproval;
  document.getElementById('backBtn').onclick = () => { screen = 'phone'; errorMessage = ''; deviceStatus = 'trusted'; render(); };
}
async function verifyPin() {
  if (busy || lockoutSeconds > 0 || isSuspended) return;
  const pin = document.getElementById('pinInput').value;
  if (!/^\d{4}$/.test(pin)) return setError('Enter all 4 digits of your PIN.');
  busy = true; errorMessage = ''; render();
  try {
    const fingerprint = getDeviceFingerprint();
    const { data, error } = await sb.rpc('staff_verify_pin', { p_challenge_token: challengeToken, p_pin: pin, p_device_fingerprint: fingerprint });
    if (error) throw error;
    const result = data && data[0];
    if (!result) throw new Error('The PIN could not be verified.');

    if (result.is_suspended) {
      isSuspended = true; busy = false; screen = 'suspended'; render(); return;
    }
    if (result.lockout_seconds && result.lockout_seconds > 0) {
      lockoutSeconds = result.lockout_seconds; busy = false; screen = 'pin'; render(); return;
    }

    sessionToken = result.session_token; localStorage.setItem(STORAGE_KEY, sessionToken);
    staff = { id: result.staff_id, full_name: result.full_name, company_id: result.company_id, site_id: result.site_id };
    if (result.site_latitude != null && result.site_longitude != null) {
      staff.site = {
        latitude: result.site_latitude,
        longitude: result.site_longitude,
        geofence_radius_meters: result.geofence_radius_meters || 100
      };
    }
    deviceStatus = result.device_status || 'trusted';
    openAttendance = result.already_checked_in;
    busy = false; errorMessage = '';
    if (deviceStatus === 'unrecognized') { screen = 'device'; render(); return; }
    screen = openAttendance ? 'checkout' : 'checkin'; render();
  } catch (error) {
    if (/lockout/i.test(error.message)) {
      lockoutSeconds = 180; busy = false; screen = 'pin'; render(); return;
    }
    setError(error.message);
  }
}

async function requestDeviceApproval() {
  if (busy) return;
  busy = true; errorMessage = ''; render();
  try {
    const fingerprint = getDeviceFingerprint();
    const { error } = await sb.rpc('staff_request_device_approval', { p_session_token: sessionToken, p_device_fingerprint: fingerprint });
    if (error) throw error;
    deviceStatus = 'pending';
    busy = false; errorMessage = '';
    screen = 'device'; render();
  } catch (error) {
    if (/session expired/i.test(error.message)) return clearSession('Your session expired. Please sign in again.');
    setError(error.message);
  }
}
function getDeviceFingerprint() {
  const parts = [
    navigator.userAgent,
    navigator.language,
    screen.width + 'x' + screen.height,
    screen.colorDepth,
    navigator.hardwareConcurrency,
    navigator.deviceMemory || 'unknown'
  ];
  let hash = 0;
  const text = parts.join('||');
  for (let i = 0; i < text.length; i++) {
    const char = text.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return `fp_${Math.abs(hash).toString(16)}`;
}

function detectSpoof(coords) {
  const flags = [];
  let score = 0;

  // Low accuracy / coarse location can indicate mock or tunneling
  if (coords.accuracy == null || coords.accuracy > 100) {
    flags.push(`low_accuracy_${Math.round(coords.accuracy || 0)}m`);
    score += coords.accuracy > 500 ? 40 : 20;
  }

  // Timestamp drift: GPS time far from device time
  const now = Date.now();
  const posTime = coords.timestamp ? new Date(coords.timestamp).getTime() : now;
  const driftMinutes = Math.abs(now - posTime) / 60000;
  if (driftMinutes > 5) {
    flags.push(`timestamp_drift_${Math.round(driftMinutes)}min`);
    score += 25;
  }

  // Automation / headless browser signals
  if (navigator.webdriver) { flags.push('webdriver'); score += 50; }
  if (/headless|selenium|phantomjs|webdriver/i.test(navigator.userAgent)) { flags.push('automation_ua'); score += 40; }

  // Impossible travel from last known location
  if (staff?.lastLocation && staff.lastLocation.lat != null) {
    const distance = haversineMeters(coords.latitude, coords.longitude, staff.lastLocation.lat, staff.lastLocation.lon);
    const elapsedHours = Math.max((now - staff.lastLocation.time) / 3600000, 0.001);
    const speedKmh = distance / 1000 / elapsedHours;
    if (speedKmh > 500) {
      flags.push(`impossible_travel_${Math.round(speedKmh)}kmh`);
      score += 35;
    }
  }

  return { score: Math.min(score, 100), flags };
}

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function requestGps() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('GPS is not available on this device.'));
    navigator.geolocation.getCurrentPosition(position => resolve(position.coords), () => reject(new Error('Location permission is required to continue.')), { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
  });
}
async function submitLocationCheck() {
  if (busy) return;
  busy = true; errorMessage = ''; gpsMessage = 'Capturing your location...'; render();
  try {
    const coords = await requestGps();
    const spoof = detectSpoof(coords);
    const fingerprint = getDeviceFingerprint();
    staff.lastLocation = { lat: coords.latitude, lon: coords.longitude, time: Date.now() };
    const { error } = await sb.rpc('staff_location_check', {
      p_session_token: sessionToken,
      p_latitude: coords.latitude,
      p_longitude: coords.longitude,
      p_accuracy_meters: coords.accuracy || null,
      p_device_fingerprint: fingerprint,
      p_spoof_score: spoof.score,
      p_spoof_flags: spoof.flags
    });
    if (error) throw error;
    busy = false; gpsMessage = '✅ Location shared with your employer.'; errorMessage = ''; render();
  } catch (error) {
    if (/session expired/i.test(error.message)) return clearSession('Your session expired. Please sign in again.');
    setError(error.message); gpsMessage = '';
  }
}

function isOfflineError(error) {
  if (!navigator.onLine) return true;
  const msg = (error && error.message) || '';
  return /fetch|network|timeout|offline|abort|failed/i.test(msg);
}

async function submitAttendance(action) {
  if (busy) return;
  busy = true; errorMessage = ''; gpsMessage = 'Requesting your location...'; render();
  try {
    const coords = await requestGps();
    gpsMessage = 'Location captured securely.'; render();

    // Geofence enforcement on check-in
    if (action === 'in' && staff?.site) {
      const distance = haversineMeters(coords.latitude, coords.longitude, staff.site.latitude, staff.site.longitude);
      if (distance > staff.site.geofence_radius_meters) {
        busy = false; gpsMessage = '';
        setError(`You are about ${Math.round(distance)} meters outside the allowed check-in area. Please move to the work site and try again.`);
        return;
      }
    }

    const spoof = detectSpoof(coords);
    const fingerprint = getDeviceFingerprint();
    staff.lastLocation = { lat: coords.latitude, lon: coords.longitude, time: Date.now() };

    // Hard block on high-confidence spoof for check-in
    if (action === 'in' && spoof.score >= 80) {
      busy = false; gpsMessage = '';
      setError(`Suspicious location detected (${spoof.flags.join(', ')}). If this is incorrect, contact your administrator.`);
      return;
    }

    const rpc = action === 'in' ? 'staff_check_in' : 'staff_check_out';
    try {
      const { error } = await sb.rpc(rpc, {
        p_session_token: sessionToken,
        p_latitude: coords.latitude,
        p_longitude: coords.longitude,
        p_accuracy_meters: coords.accuracy || null,
        p_device_timestamp: new Date().toISOString(),
        p_device_fingerprint: fingerprint,
        p_spoof_score: spoof.score,
        p_spoof_flags: spoof.flags
      });
      if (error) throw error;
      busy = false; gpsMessage = ''; openAttendance = action === 'in'; screen = action === 'in' ? 'success' : 'dashboard'; errorMessage = ''; render();
    } catch (error) {
      if (/session expired/i.test(error.message)) return clearSession('Your session expired. Please sign in again.');
      if (isOfflineError(error)) {
        await queueAction(action, coords.latitude, coords.longitude, coords.accuracy || null);
        busy = false; gpsMessage = '';
        errorMessage = 'You appear to be offline. Your check-in has been saved and will sync automatically when connectivity returns.';
        screen = 'dashboard'; render();
        return;
      }
      throw error;
    }
  } catch (error) {
    setError(error.message); gpsMessage = '';
  }
}
function renderCheckin() {
  const geofenceInfo = staff?.site
    ? `<p class="text-xs text-gray-500 mt-2">You must be within ${staff.site.geofence_radius_meters} meters of the work site to check in.</p>`
    : '';
  app().innerHTML = `${header('Ready to check in?', `Hello, ${escapeHtml(staff?.full_name || 'there')}. Your location will be captured.`)}
    <section class="card-modern p-6 text-center"><div class="mx-auto w-16 h-16 rounded-full bg-green-100 text-green-700 flex items-center justify-center text-3xl mb-4">&#128205;</div>
    <h2 class="text-xl font-semibold text-gray-800">Start your workday</h2><p class="text-sm text-gray-500 mt-2">Check-in will record the current time and GPS location.</p>${geofenceInfo}
    <button id="checkinBtn" type="button" class="btn-primary w-full mt-6">${loadingLabel('Capture GPS and Check In')}</button>${gpsMessage ? `<p class="text-sm text-green-700 mt-3">${escapeHtml(gpsMessage)}</p>` : ''}${errorHtml()}</section>`;
  document.getElementById('checkinBtn').onclick = () => submitAttendance('in');
}
function renderCheckout() {
  app().innerHTML = `${header('You are checked in', `Hello, ${escapeHtml(staff?.full_name || 'there')}. Check-out is required before another check-in.`)}
    <section class="card-modern p-6 text-center border-red-200"><div class="mx-auto w-16 h-16 rounded-full bg-red-100 text-red-700 flex items-center justify-center text-3xl mb-4">&#9200;</div>
    <h2 class="text-xl font-semibold text-gray-800">Work session active</h2><p class="text-sm text-gray-500 mt-2">The check-in page is locked until you check out.</p>
    <button id="checkoutBtn" type="button" class="btn-danger w-full mt-6">${loadingLabel('Capture GPS and Check Out')}</button>${gpsMessage ? `<p class="text-sm text-green-700 mt-3">${escapeHtml(gpsMessage)}</p>` : ''}${errorHtml()}</section>`;
  document.getElementById('checkoutBtn').onclick = () => submitAttendance('out');
}
function renderSuccess() {
  app().innerHTML = `<section class="card-modern p-8 text-center fade-in"><div class="face"><span class="cheek cheek-left"></span><span class="cheek cheek-right"></span><div class="face-mouth"></div></div><h1 class="text-3xl font-bold text-gray-800 mt-8">Congrats!</h1><p class="text-gray-600 mt-2 text-lg">Thanks for coming in.</p><button id="dashboardBtn" type="button" class="btn-primary w-full mt-8">View My Dashboard</button></section>`;
  document.getElementById('dashboardBtn').onclick = () => { screen = 'dashboard'; render(); };
}
async function loadDashboardData() {
  const { data, error } = await sb.rpc('staff_get_status', { p_session_token: sessionToken });
  if (error) throw error;
  if (!data || !data.length) throw new Error('Staff session is no longer active.');
  openAttendance = data[0].checked_in;
  staff = staff || { id: data[0].staff_id, full_name: data[0].full_name };
}
function connectionBadge() {
  const offline = !navigator.onLine;
  const pendingText = pendingSyncCount > 0 ? ` • ${pendingSyncCount} pending` : '';
  if (offline) return `<div class="mb-4 rounded-xl alert-amber px-4 py-2 text-sm font-medium flex justify-between items-center fade-in"><span>&#9888; Offline mode${pendingText}</span><button id="retrySyncBtn" type="button" class="text-xs underline disabled:opacity-50" disabled>Retry</button></div>`;
  if (pendingSyncCount > 0) return `<div class="mb-4 rounded-xl alert-blue px-4 py-2 text-sm font-medium flex justify-between items-center fade-in"><span>&#128259; ${pendingSyncCount} offline record(s) ready to sync</span><button id="retrySyncBtn" type="button" class="text-xs underline font-semibold">Retry now</button></div>`;
  return `<div class="mb-4 rounded-xl alert-green px-4 py-2 text-sm font-medium fade-in">&#128246; Online</div>`;
}

async function renderDashboard() {
  app().innerHTML = `${header('My Attendance &amp; Pay Records', `Welcome, ${escapeHtml(staff?.full_name || 'staff member')}.`)}${connectionBadge()}<section class="card-modern p-1 mb-4 flex flex-wrap gap-1"><button class="tab px-3 py-2 rounded-lg text-sm ${dashboardTab === 'records' ? 'tab-active' : ''}" data-tab="records">View My Records</button><button class="tab px-3 py-2 rounded-lg text-sm ${dashboardTab === 'pay' ? 'tab-active' : ''}" data-tab="pay">Pay Records</button><button class="tab px-3 py-2 rounded-lg text-sm ${dashboardTab === 'notifications' ? 'tab-active' : ''}" data-tab="notifications">Notifications</button><button class="tab px-3 py-2 rounded-lg text-sm ${dashboardTab === 'location' ? 'tab-active' : ''}" data-tab="location">Location Checker</button></section><div id="dashboardContent" class="card-modern p-5"><p class="text-center text-gray-500">Loading...</p></div><button id="logoutBtn" type="button" class="block mx-auto mt-5 link-muted text-sm font-medium py-2">Sign out</button>`;
  document.querySelectorAll('.tab').forEach(button => button.onclick = () => { dashboardTab = button.dataset.tab; renderDashboard(); });
  const retryBtn = document.getElementById('retrySyncBtn');
  if (retryBtn) retryBtn.onclick = () => { busy = true; renderDashboard(); syncQueue().finally(() => { busy = false; }); };
  document.getElementById('logoutBtn').onclick = () => clearSession();
  try {
    await loadDashboardData();
    const content = document.getElementById('dashboardContent');
    if (dashboardTab === 'records') await renderRecords(content);
    if (dashboardTab === 'pay') await renderPay(content);
    if (dashboardTab === 'notifications') await renderNotifications(content);
    if (dashboardTab === 'location') await renderLocation(content);
  } catch (error) {
    if (/session/i.test(error.message)) return clearSession(error.message);
    const content = document.getElementById('dashboardContent'); if (content) content.innerHTML = `<p class="text-red-600 text-sm">${escapeHtml(error.message)}</p>`;
  }
}
async function renderRecords(content) {
  const { data, error } = await sb.rpc('staff_get_records', { p_session_token: sessionToken }); if (error) throw error;
  content.innerHTML = `<div class="flex items-center justify-between mb-4"><h2 class="font-semibold">Attendance history</h2><span class="text-xs text-gray-500">Last 30 days</span></div>${data?.length ? `<div class="overflow-x-auto"><table class="w-full mt-table"><thead><tr><th>Date</th><th>Status</th><th>In</th><th>Out</th><th>Hours</th></tr></thead><tbody>${data.map(row => `<tr><td>${formatDate(row.work_date)}</td><td class="capitalize">${escapeHtml(row.status)}</td><td>${formatTime(row.check_in)}</td><td>${formatTime(row.check_out)}</td><td>${row.total_hours ?? '-'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="text-sm text-gray-500">No attendance records yet.</p>'}`;
}
async function renderPay(content) {
  const { data, error } = await sb.rpc('staff_get_pay_records', { p_session_token: sessionToken }); if (error) throw error;
  content.innerHTML = `<h2 class="font-semibold mb-4">Pay records</h2>${data?.length ? `<div class="space-y-3">${data.map(row => `<div class="border rounded-xl p-4"><div class="flex justify-between gap-3"><strong>${formatDate(row.period_start)} - ${formatDate(row.period_end)}</strong><span class="text-xs capitalize px-2 py-1 rounded-full bg-gray-100">${escapeHtml(row.status)}</span></div><div class="grid grid-cols-3 gap-2 mt-3 text-sm"><span><small class="block text-gray-500">Gross</small>${formatMoney(row.gross_pay, row.currency)}</span><span><small class="block text-gray-500">Deductions</small>${formatMoney(row.total_deductions, row.currency)}</span><span><small class="block text-gray-500">Net</small>${formatMoney(row.net_pay, row.currency)}</span></div></div>`).join('')}</div>` : '<p class="text-sm text-gray-500">No pay records available yet.</p>'}`;
}
async function renderLocation(content) {
  content.innerHTML = `<div class="text-center"><div class="mx-auto w-16 h-16 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-3xl mb-4">&#128205;</div><h2 class="font-semibold text-gray-800">Verify my location</h2><p class="text-sm text-gray-500 mt-2 mb-5">Tap the button below to share your current GPS location with your employer without checking out.</p><button id="locationCheckBtn" type="button" class="btn-primary w-full">${loadingLabel('Share My Location')}</button>${gpsMessage ? `<p class="text-sm text-green-700 mt-3">${escapeHtml(gpsMessage)}</p>` : ''}${errorHtml()}</div>`;
  document.getElementById('locationCheckBtn').onclick = submitLocationCheck;
}

function renderNotificationCard(note) {
  const isLocationRequest = note.notification_type === 'location_check_request' && !note.read_at;
  const actionButton = isLocationRequest
    ? `<button type="button" class="locationRequestBtn mt-3 w-full btn-primary text-sm" data-id="${note.id}">&#128205; Share location now</button>`
    : (!note.read_at ? `<button type="button" class="readNote mt-2 text-xs text-green-700 font-semibold" data-id="${note.id}">Mark as read</button>` : '');
  const cardClass = isLocationRequest ? 'border-amber-300 bg-amber-50' : (note.read_at ? '' : 'border-green-300 bg-green-50');
  return `<article class="border rounded-xl p-4 ${cardClass} fade-in"><div class="flex justify-between gap-3"><strong>${escapeHtml(note.title)}</strong><span class="text-xs text-gray-500">${formatTime(note.created_at)}</span></div><p class="text-sm text-gray-600 mt-1">${escapeHtml(note.message)}</p>${actionButton}</article>`;
}

async function renderNotifications(content) {
  const { data, error } = await sb.rpc('staff_get_notifications', { p_session_token: sessionToken, p_unread_only: false }); if (error) throw error;
  content.innerHTML = `<div class="flex items-center justify-between mb-4"><h2 class="font-semibold">Notifications</h2><span class="text-xs text-gray-500">Updates refresh automatically</span></div>${data?.length ? `<div class="space-y-3">${data.map(note => renderNotificationCard(note)).join('')}</div>` : '<p class="text-sm text-gray-500">You have no notifications.</p>'}`;
  content.querySelectorAll('.readNote').forEach(button => button.onclick = async () => { const result = await sb.rpc('staff_mark_notification_read', { p_session_token: sessionToken, p_notification_id: button.dataset.id }); if (result.error) return setError(result.error.message); renderDashboard(); });
  content.querySelectorAll('.locationRequestBtn').forEach(button => button.onclick = async () => {
    await sb.rpc('staff_mark_notification_read', { p_session_token: sessionToken, p_notification_id: button.dataset.id });
    dashboardTab = 'location';
    renderDashboard();
  });
}

function clearSession(message) { localStorage.removeItem(STORAGE_KEY); sessionToken = ''; staff = null; openAttendance = null; screen = companyCode ? 'phone' : 'invalid-link'; errorMessage = message || ''; render(); }
async function restoreSession() {
  if (!sessionToken) return render();
  try { await loadDashboardData(); screen = openAttendance ? 'checkout' : 'checkin'; render(); } catch (error) { clearSession('Please sign in again.'); }
}
async function restoreCompany() {
  if (!companyCode) return render();
  try {
    const { data, error } = await sb.rpc('staff_get_company', { p_company_code: companyCode });
    if (error) throw error;
    const result = data && data[0];
    if (!result) { screen = 'invalid-link'; return render(); }
    company = { name: result.company_name, logo_url: result.company_logo_url, org_code: result.company_code };
    restoreSession();
  } catch (error) {
    screen = 'invalid-link'; errorMessage = 'This company attendance link is unavailable right now.'; render();
  }
}
async function checkForLocationRequests() {
  if (!sessionToken) return;
  try {
    const { data, error } = await sb.rpc('staff_get_notifications', { p_session_token: sessionToken, p_unread_only: true });
    if (error || !data) return;
    const pendingLocation = data.find(n => n.notification_type === 'location_check_request');
    if (pendingLocation) {
      alertStaffForLocation();
      if (screen === 'dashboard' && dashboardTab !== 'location') {
        dashboardTab = 'location';
        errorMessage = 'Your employer requested your location. Open the Location Checker tab.';
        renderDashboard();
      }
    }
  } catch (e) { console.warn('Location request poll failed', e); }
}

function startNotificationPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (sessionToken && screen === 'dashboard') {
      if (dashboardTab === 'notifications') renderDashboard();
      else checkForLocationRequests();
    }
  }, 15000);
}
window.addEventListener('online', () => { isOnline = true; syncQueue(); if (screen === 'dashboard') renderDashboard(); });
window.addEventListener('offline', () => { isOnline = false; if (screen === 'dashboard') renderDashboard(); });
refreshPendingCount();
startNotificationPolling();
restoreCompany();
</script>
</body>
</html>
