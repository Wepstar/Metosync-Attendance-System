<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metosync — Welcome</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared.js"></script>
</head>
<body class="bg-[#f4f7f5] min-h-screen">
<div id="app" class="max-w-md mx-auto p-4"></div>
<script>
let code = '';
let status = '';   // '' | 'checking' | 'valid' | 'invalid'

function app() { return document.getElementById('app'); }

function render() {
  if (status === 'valid') return renderWelcome();

  app().innerHTML = `
    <div class="text-left mt-6 mb-2">
      <span class="text-sm font-medium text-gray-500">Enter Invited Code</span>
    </div>
    <div class="text-center mb-8">
      <img src="metosync-logo.png" class="h-20 mx-auto mb-3 drop-shadow-lg" alt="Metosync">
    </div>
    <input id="codeInput" placeholder="e.g. MET-2026-0001" value="${code}" class="w-full border rounded-xl px-4 py-3 mb-3 font-mono text-center">
    ${status === 'invalid' ? `<p class="text-red-600 text-sm text-center mb-3">Invalid or already-used code. Ask your admin for the correct link.</p>` : ''}
    <button id="checkBtn" class="w-full bg-[#0d2a4d] text-white rounded-xl py-3 font-medium">
      ${status === 'checking' ? 'Checking…' : 'Continue'}
    </button>`;

  document.getElementById('checkBtn').onclick = async () => {
    code = document.getElementById('codeInput').value.trim();
    if (!code) { status = 'invalid'; render(); return; }
    status = 'checking'; render();
    const { data } = await sb.rpc('check_onboarding_invite', { p_code: code });
    status = data ? 'valid' : 'invalid';
    render();
  };
}

function renderWelcome() {
  app().innerHTML = `
    <div class="text-center mb-8 mt-10">
      <img src="metosync-logo.png" class="h-20 mx-auto mb-3 drop-shadow-lg" alt="Metosync">
      <h1 class="text-2xl font-bold text-[#0d2a4d] mb-2">Welcome to Metosync Tech Inc.</h1>
      <p class="text-lg text-gray-700 mb-6">Sign up and let's get you started.</p>
      <button id="signupBtn" class="bg-[#0d2a4d] text-white rounded-xl px-8 py-3 font-bold text-lg">
        Click Here: Sign Up
      </button>
    </div>`;
  document.getElementById('signupBtn').onclick = () => {
    sessionStorage.setItem('metosync_onboarding_code', code);
    window.location.href = 'signup.html';
  };
}

render();
</script>
</body>
</html>
