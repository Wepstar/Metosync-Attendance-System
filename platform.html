<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metosync — Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared.js"></script>
</head>
<body class="bg-[#f4f7f5] min-h-screen">
<div id="app" class="max-w-md mx-auto p-4"><p class="text-gray-400 text-center mt-10">Loading…</p></div>
<script>
let state = { session: null, isAdmin: false, role: null };
let errorMsg = '';
let sectionUnlocked = null; // 'registry' | 'accounts' | 'owner' | null
let sectionPwInput = '';
let generatedInviteCode = '';
let generatedCompanyCode = '';

function app() { return document.getElementById('app'); }

async function init() {
  state = await getSessionAndRole();
  render();
}

function render() {
  if (!state.session) return renderLogin();
  if (!state.isAdmin) return renderNoAccess();
  if (sectionUnlocked) return renderSection(sectionUnlocked);
  renderLanding();
}

function renderLogin() {
  app().innerHTML = `
    <h1 class="text-xl font-bold text-center mt-10 mb-4">Metosync Platform Login</h1>
    <input id="email" type="email" autocomplete="off" placeholder="Email" class="w-full border rounded-xl px-4 py-3 mb-3">
    <div class="relative mb-3">
      <input id="password" type="password" autocomplete="off" placeholder="Password" class="w-full border rounded-xl px-4 py-3 pr-10">
      <button type="button" onclick="toggleEye('password',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">👁</button>
    </div>
    ${errorMsg ? `<p class="text-red-600 text-sm mb-3">${errorMsg}</p>` : ''}
    <button id="loginBtn" class="w-full bg-[#0d2a4d] text-white rounded-xl py-3 font-medium">Log In</button>`;
  document.getElementById('loginBtn').onclick = async () => {
    errorMsg = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { errorMsg = error.message; render(); return; }
    state = await getSessionAndRole();
    render();
  };
}

function renderNoAccess() {
  app().innerHTML = `
    <div class="text-center mt-10">
      <p class="text-gray-600 mb-3">This account does not have platform-admin access.</p>
      <button id="logoutBtn" class="text-sm text-blue-600">Log out</button>
    </div>`;
  document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); state = { session: null, isAdmin: false, role: null }; render(); };
}

function renderLanding() {
  app().innerHTML = `
    <h1 class="text-xl font-bold text-center mt-10 mb-1">Welcome</h1>
    <p class="text-sm text-gray-500 text-center mb-6">Signed in as ${state.role}</p>
    <div class="space-y-3">
      ${state.role === 'owner' ? `<button id="ownerBtn" class="w-full bg-[#0d2a4d] text-white rounded-xl py-3 font-medium">Owner Dashboard</button>` : ''}
      <button id="registryBtn" class="w-full bg-gray-700 text-white rounded-xl py-3 font-medium">Registry</button>
      <button id="accountsBtn" class="w-full bg-gray-700 text-white rounded-xl py-3 font-medium">Accounts &amp; Billing</button>
    </div>
    <button id="logoutBtn" class="w-full text-sm text-blue-600 mt-6">Log out</button>`;
  if (state.role === 'owner') document.getElementById('ownerBtn').onclick = () => { sectionUnlocked = 'owner'; render(); };
  document.getElementById('registryBtn').onclick = () => promptSectionPassword('registry');
  document.getElementById('accountsBtn').onclick = () => promptSectionPassword('accounts');
  document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); state = { session: null, isAdmin: false, role: null }; render(); };
}

async function promptSectionPassword(section) {
  errorMsg = '';
  const { data: isSet } = await sb.rpc('section_password_is_set', { p_section: section });
  app().innerHTML = `
    <h1 class="text-lg font-bold text-center mt-10 mb-4 capitalize">${section} — Password Required</h1>
    <div class="relative mb-3">
      <input id="sectionPw" type="password" autocomplete="off" placeholder="${isSet ? 'Enter password' : 'Set a new password'}" class="w-full border rounded-xl px-4 py-3 pr-10">
      <button type="button" onclick="toggleEye('sectionPw',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">👁</button>
    </div>
    ${errorMsg ? `<p class="text-red-600 text-sm mb-3">${errorMsg}</p>` : ''}
    <button id="submitPwBtn" class="w-full bg-[#0d2a4d] text-white rounded-xl py-3 font-medium">${isSet ? 'Unlock' : 'Set & Continue'}</button>
    <button id="backBtn" class="w-full text-sm text-gray-500 mt-3">← Back</button>`;
  document.getElementById('backBtn').onclick = () => { errorMsg = ''; render(); };
  document.getElementById('submitPwBtn').onclick = async () => {
    const pw = document.getElementById('sectionPw').value;
    if (!pw) { errorMsg = 'Enter a password.'; promptSectionPassword(section); return; }
    if (!isSet) {
      const { error } = await sb.rpc('set_section_password', { p_section: section, p_password: pw });
      if (error) { errorMsg = error.message; promptSectionPassword(section); return; }
      sectionUnlocked = section; render(); return;
    }
    const { data: ok, error } = await sb.rpc('verify_section_password', { p_section: section, p_password: pw });
    if (error) { errorMsg = error.message; promptSectionPassword(section); return; }
    if (!ok) { errorMsg = 'Incorrect password.'; promptSectionPassword(section); return; }
    sectionUnlocked = section; render();
  };
}

function renderSection(section) {
  if (section === 'owner') return renderOwnerDashboard();
  if (section === 'registry') return renderRegistry();
  app().innerHTML = `
    <h1 class="text-lg font-bold text-center mt-10 mb-4 capitalize">${section}</h1>
    <p class="text-sm text-gray-500 text-center mb-6">Content for this section comes next — this confirms access control is working.</p>
    <button id="backBtn" class="w-full text-sm text-gray-500">← Back</button>`;
  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
}

function renderRegistry() {
  app().innerHTML = `
    <div class="flex justify-between items-center mt-6 mb-4">
      <h1 class="text-lg font-bold">Registry</h1>
      <button id="backBtn" class="text-sm text-gray-500">← Back</button>
    </div>
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h2 class="font-medium mb-2 text-sm">Generate New Company Invite Code</h2>
      <button id="genCompanyInviteBtn" class="bg-[#0d2a4d] text-white rounded-xl px-4 py-2 text-sm font-medium">Generate Code</button>
      ${generatedCompanyCode ? `<p class="mt-2 font-mono text-sm bg-gray-100 rounded-lg px-3 py-2 inline-block">${generatedCompanyCode}</p>` : ''}
    </div>`;
  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
  document.getElementById('genCompanyInviteBtn').onclick = async () => {
    const { data, error } = await sb.rpc('create_onboarding_invite');
    if (!error) generatedCompanyCode = data;
    renderRegistry();
  };
}

async function renderOwnerDashboard() {
  app().innerHTML = `<p class="text-gray-400 text-center mt-10">Loading…</p>`;
  const { data: companies, error } = await sb.rpc('platform_list_companies');
  if (error) { app().innerHTML = `<p class="text-red-600 text-center mt-10">${error.message}</p>`; return; }

  const totalCompanies = companies.length;
  const totalStaff = companies.reduce((sum, c) => sum + Number(c.staff_count), 0);

  const rows = companies.map(c => `
    <tr class="border-b">
      <td class="py-2 px-3">${c.name}</td>
      <td class="py-2 px-3 font-mono text-xs">${c.org_code}</td>
      <td class="py-2 px-3">${c.staff_count}</td>
      <td class="py-2 px-3 capitalize">${c.status}</td>
    </tr>`).join('');

  app().innerHTML = `
    <div class="flex justify-between items-center mt-6 mb-4">
      <h1 class="text-lg font-bold">Owner Dashboard</h1>
      <button id="backBtn" class="text-sm text-gray-500">← Back</button>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm text-center">
        <p class="text-2xl font-bold text-[#0d2a4d]">${totalCompanies}</p>
        <p class="text-xs text-gray-500">Companies</p>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm text-center">
        <p class="text-2xl font-bold text-[#0d2a4d]">${totalStaff}</p>
        <p class="text-xs text-gray-500">Total Staff</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm mb-4 overflow-x-auto">
      <h2 class="font-medium mb-2 text-sm">Companies</h2>
      <table class="w-full text-sm text-left">
        <thead><tr class="border-b text-gray-500"><th class="py-2 px-3">Name</th><th class="py-2 px-3">Code</th><th class="py-2 px-3">Staff</th><th class="py-2 px-3">Status</th></tr></thead>
        <tbody>${rows || '<tr><td class="py-4 px-3 text-gray-400" colspan="4">No companies yet.</td></tr>'}</tbody>
      </table>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h2 class="font-medium mb-2 text-sm">Invite a Platform Admin</h2>
      <button id="genInviteBtn" class="bg-[#0d2a4d] text-white rounded-xl px-4 py-2 text-sm font-medium">Generate Code</button>
      ${generatedInviteCode ? `<p class="mt-2 font-mono text-sm bg-gray-100 rounded-lg px-3 py-2 inline-block">${generatedInviteCode}</p>` : ''}
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm mt-4">
      <h2 class="font-medium mb-2 text-sm">Generate New Company Invite Code</h2>
      <button id="genCompanyInviteBtn2" class="bg-[#0d2a4d] text-white rounded-xl px-4 py-2 text-sm font-medium">Generate Code</button>
      ${generatedCompanyCode ? `<p class="mt-2 font-mono text-sm bg-gray-100 rounded-lg px-3 py-2 inline-block">${generatedCompanyCode}</p>` : ''}
    </div>`;

  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
  document.getElementById('genInviteBtn').onclick = async () => {
    const { data, error } = await sb.rpc('create_platform_invite');
    if (!error) generatedInviteCode = data;
    renderOwnerDashboard();
  };
  document.getElementById('genCompanyInviteBtn2').onclick = async () => {
    const { data, error } = await sb.rpc('create_onboarding_invite');
    if (!error) generatedCompanyCode = data;
    renderOwnerDashboard();
  };
}

init();
</script>
</body>
</html>
