<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metosync — Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="theme.css">
<script src="shared.js"></script>
</head>
<body class="min-h-screen" style="background: var(--mt-bg);">
<div id="app" class="max-w-md mx-auto p-4"><p class="text-gray-400 text-center mt-10">Loading…</p></div>
<script>
let state = { session: null, isAdmin: false, role: null };
let errorMsg = '';
let sectionUnlocked = null;
let generatedInviteCode = '';
let generatedCompanyCode = '';
let registryChannel = null;

function app() { return document.getElementById('app'); }

async function init() {
  state = await getSessionAndRole();
  render();
}

function render() {
  if (registryChannel) { sb.removeChannel(registryChannel); registryChannel = null; }
  if (!state.session) return renderLogin();
  if (!state.isAdmin) return renderNoAccess();
  if (sectionUnlocked) return renderSection(sectionUnlocked);
  renderLanding();
}

function renderLogin() {
  app().innerHTML = `
    <div class="mt-card mt-fade-in p-6 mt-10">
      <h1 class="text-xl font-bold text-center mb-4" style="color: var(--mt-green-dark);">Metosync Platform Login</h1>
      <input id="email" type="email" autocomplete="off" placeholder="Email" class="w-full border rounded-xl px-4 py-3 mb-3">
      <div class="relative mb-3">
        <input id="password" type="password" autocomplete="off" placeholder="Password" class="w-full border rounded-xl px-4 py-3 pr-10">
        <button type="button" onclick="toggleEye('password',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">👁</button>
      </div>
      ${errorMsg ? `<p class="text-red-600 text-sm mb-3">${errorMsg}</p>` : ''}
      <button id="loginBtn" class="w-full mt-btn-primary">Log In</button>
    </div>`;
  document.getElementById('loginBtn').onclick = async () => {
    errorMsg = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { errorMsg = error.message; render(); return; }
    state = await getSessionAndRole();
    render();
  };
  app().querySelectorAll('input').forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
  });
  setTimeout(() => {
    const e1 = document.getElementById('email'), e2 = document.getElementById('password');
    if (e1) e1.value = ''; if (e2) e2.value = '';
  }, 50);
}

function renderNoAccess() {
  app().innerHTML = `
    <div class="mt-card text-center p-6 mt-10">
      <p class="text-gray-600 mb-3">This account does not have platform-admin access.</p>
      <button id="logoutBtn" class="mt-btn-outline">Log out</button>
    </div>`;
  document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); state = { session: null, isAdmin: false, role: null }; render(); };
}

function renderLanding() {
  app().innerHTML = `
    <div class="mt-fade-in mt-10">
      <h1 class="text-xl font-bold text-center mb-1" style="color: var(--mt-green-dark);">Welcome</h1>
      <p class="text-sm text-gray-500 text-center mb-6">Signed in as ${state.role}</p>
      <div class="space-y-3">
        ${state.role === 'owner' ? `<button id="ownerBtn" class="w-full mt-btn-primary py-3">🏛️ Owner Dashboard</button>` : ''}
        <button id="registryBtn" class="w-full mt-btn-outline py-3">📋 Registry</button>
        <button id="accountsBtn" class="w-full mt-btn-outline py-3">💳 Accounts &amp; Billing</button>
      </div>
      <button id="logoutBtn" class="w-full text-sm text-gray-500 mt-6">Log out</button>
    </div>`;
  if (state.role === 'owner') document.getElementById('ownerBtn').onclick = () => { sectionUnlocked = 'owner'; render(); };
  document.getElementById('registryBtn').onclick = () => promptSectionPassword('registry');
  document.getElementById('accountsBtn').onclick = () => promptSectionPassword('accounts');
  document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); state = { session: null, isAdmin: false, role: null }; render(); };
}

async function promptSectionPassword(section) {
  errorMsg = '';
  const { data: isSet } = await sb.rpc('section_password_is_set', { p_section: section });
  app().innerHTML = `
    <div class="mt-card mt-fade-in p-6 mt-10">
      <h1 class="text-lg font-bold text-center mb-4 capitalize" style="color: var(--mt-green-dark);">${section} — Password Required</h1>
      <div class="relative mb-3">
        <input id="sectionPw" type="password" autocomplete="off" placeholder="${isSet ? 'Enter password' : 'Set a new password'}" class="w-full border rounded-xl px-4 py-3 pr-10">
        <button type="button" onclick="toggleEye('sectionPw',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">👁</button>
      </div>
      ${errorMsg ? `<p class="text-red-600 text-sm mb-3">${errorMsg}</p>` : ''}
      <button id="submitPwBtn" class="w-full mt-btn-primary mb-2">${isSet ? 'Unlock' : 'Set & Continue'}</button>
      <button id="backBtn" class="w-full text-sm text-gray-500">← Back</button>
    </div>`;
  document.getElementById('backBtn').onclick = () => { errorMsg = ''; render(); };
  document.getElementById('submitPwBtn').onclick = async () => {
    const pw = document.getElementById('sectionPw').value;
    if (!pw) { errorMsg = 'Enter a password.'; promptSectionPassword(section); return; }
    if (!isSet) {
      const { error } = await sb.rpc('set_section_password', { p_section: section, p_password: pw });
      if (error) { errorMsg = error.message; promptSectionPassword(section); return; }
      sectionUnlocked = section; render(); return;
    }
    const { data: ok, error } = await sb.rpc('verify_section_password', { p_section: section, p_password: pw });
    if (error) { errorMsg = error.message; promptSectionPassword(section); return; }
    if (!ok) { errorMsg = 'Incorrect password.'; promptSectionPassword(section); return; }
    sectionUnlocked = section; render();
  };
}

function renderSection(section) {
  if (section === 'owner') return renderOwnerDashboard();
  if (section === 'registry') return renderRegistry();
  app().innerHTML = `
    <div class="mt-card text-center p-6 mt-10">
      <h1 class="text-lg font-bold mb-2 capitalize" style="color: var(--mt-green-dark);">${section}</h1>
      <p class="text-sm text-gray-500 mb-4">Content for this section comes next.</p>
      <button id="backBtn" class="mt-btn-outline">← Back</button>
    </div>`;
  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
}

async function renderOwnerDashboard() {
  app().innerHTML = `<p class="text-gray-400 text-center mt-10">Loading…</p>`;
  const { data: companies, error } = await sb.rpc('platform_list_companies');
  if (error) { app().innerHTML = `<p class="text-red-600 text-center mt-10">${error.message}</p>`; return; }

  const totalCompanies = companies.length;
  const totalStaff = companies.reduce((sum, c) => sum + Number(c.staff_count), 0);

  const rows = companies.map(c => `
    <tr><td>${c.name}</td><td class="font-mono text-xs">${c.org_code}</td><td>${c.staff_count}</td><td class="capitalize">${c.status}</td></tr>`).join('');

  app().innerHTML = `
    <div class="mt-fade-in">
      <div class="flex justify-between items-center mt-6 mb-4">
        <h1 class="text-lg font-bold" style="color: var(--mt-green-dark);">🏛️ Owner Dashboard</h1>
        <button id="backBtn" class="text-sm text-gray-500">← Back</button>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="mt-card p-4 text-center">
          <p class="text-2xl font-bold" style="color: var(--mt-green-dark);">${totalCompanies}</p>
          <p class="text-xs text-gray-500">Companies</p>
        </div>
        <div class="mt-card p-4 text-center">
          <p class="text-2xl font-bold" style="color: var(--mt-green-dark);">${totalStaff}</p>
          <p class="text-xs text-gray-500">Total Staff</p>
        </div>
      </div>
      <div class="mt-card p-4 mb-4 overflow-x-auto">
        <h2 class="font-medium mb-2 text-sm">Companies</h2>
        <table class="w-full mt-table"><thead><tr><th>Name</th><th>Code</th><th>Staff</th><th>Status</th></tr></thead>
          <tbody>${rows || '<tr><td class="text-gray-400" colspan="4">No companies yet.</td></tr>'}</tbody></table>
      </div>
      <div class="mt-card p-4 mb-4">
        <h2 class="font-medium mb-2 text-sm">Invite a Platform Admin</h2>
        <button id="genInviteBtn" class="mt-btn-primary">Generate Code</button>
        ${generatedInviteCode ? `<p class="mt-2 font-mono text-sm px-3 py-2 inline-block rounded-lg" style="background: var(--mt-green-light);">${generatedInviteCode}</p>` : ''}
      </div>
      <div class="mt-card p-4">
        <h2 class="font-medium mb-2 text-sm">Generate New Company Invite Code</h2>
        <button id="genCompanyInviteBtn" class="mt-btn-primary">Generate Code</button>
        ${generatedCompanyCode ? `<p class="mt-2 font-mono text-sm px-3 py-2 inline-block rounded-lg" style="background: var(--mt-green-light);">${generatedCompanyCode}</p>` : ''}
      </div>
    </div>`;

  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
  document.getElementById('genInviteBtn').onclick = async () => {
    const { data, error } = await sb.rpc('create_platform_invite');
    if (!error) generatedInviteCode = data;
    renderOwnerDashboard();
  };
  document.getElementById('genCompanyInviteBtn').onclick = async () => {
    const { data, error } = await sb.rpc('create_onboarding_invite');
    if (!error) generatedCompanyCode = data;
    renderOwnerDashboard();
  };
}

function staffChangeRow(c, isNew) {
  const actionColor = c.action === 'created' ? 'active' : c.action === 'deleted' ? 'inactive' : 'pending';
  return `
    <tr id="chg-${c.id}" class="${isNew ? 'mt-row-new' : ''}">
      <td>${c.company_name}</td>
      <td>${c.staff_name}</td>
      <td><span class="mt-badge ${actionColor}">${c.action}</span></td>
      <td class="text-xs text-gray-400">${new Date(c.changed_at).toLocaleString()}</td>
    </tr>`;
}

async function renderRegistry() {
  app().innerHTML = `<p class="text-gray-400 text-center mt-10">Loading…</p>`;
  const { data: changes, error } = await sb.rpc('registry_list_all_activity');

  const catStyle = { staff: 'bg-blue-100 text-blue-800', attendance: 'bg-green-100 text-green-800', activity: 'bg-purple-100 text-purple-800' };
  const rowsHtml = (changes || []).map(c => `
    <tr id="chg-${c.id}">
      <td>${c.company_name}</td>
      <td><span class="mt-badge" style="background:transparent;" class="px-2 py-0.5 rounded-full text-xs font-medium ${catStyle[c.category] || 'bg-gray-100 text-gray-800'}">${c.category}</span></td>
      <td class="capitalize">${c.action}</td>
      <td class="text-xs">${c.detail || ''}</td>
      <td class="text-xs text-gray-400">${new Date(c.performed_at).toLocaleString()}</td>
    </tr>`).join('');

  app().innerHTML = `
    <div class="mt-fade-in">
      <div class="flex justify-between items-center mt-6 mb-4">
        <h1 class="text-lg font-bold" style="color: var(--mt-green-dark);">📋 Registry <span class="text-xs font-normal text-green-600 align-middle">● live</span></h1>
        <button id="backBtn" class="text-sm text-gray-500">← Back</button>
      </div>
      <div class="mt-card p-4 mb-4">
        <h2 class="font-medium mb-2 text-sm">Generate New Company Invite Code</h2>
        <button id="genCompanyInviteBtn" class="mt-btn-primary">Generate Code</button>
        ${generatedCompanyCode ? `<p class="mt-2 font-mono text-sm px-3 py-2 inline-block rounded-lg" style="background: var(--mt-green-light);">${generatedCompanyCode}</p>` : ''}
      </div>
      <div class="mt-card p-4 overflow-x-auto">
        <h2 class="font-medium mb-2 text-sm">Full Audit Trail — All Organizations</h2>
        <table class="w-full mt-table"><thead><tr><th>Company</th><th>Type</th><th>Action</th><th>Detail</th><th>When</th></tr></thead>
          <tbody id="changesBody">${rowsHtml || `<tr><td class="text-gray-400" colspan="5">${error ? error.message : 'No activity yet.'}</td></tr>`}</tbody></table>
      </div>
    </div>`;

  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
  document.getElementById('genCompanyInviteBtn').onclick = async () => {
    const { data, error } = await sb.rpc('create_onboarding_invite');
    if (!error) generatedCompanyCode = data;
    renderRegistry();
  };

  // Live updates across all three source tables
  registryChannel = sb
    .channel('registry-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'staff_changes' }, () => renderRegistry())
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance_status_changes' }, () => renderRegistry())
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'company_activity_log' }, () => renderRegistry())
    .subscribe();
}

init();
</script>
</body>
</html>
