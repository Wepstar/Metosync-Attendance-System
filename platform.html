<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metosync — Platform</title>
<link rel="preconnect" href="https://lqgdyjvfirdhstcmepyr.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://lqgdyjvfirdhstcmepyr.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="theme.css">
<script src="shared.js"></script>
<style>
  #app.platform-wide {
    width: 100%;
    max-width: none;
    padding: 1.5rem clamp(1rem, 3vw, 3rem);
  }

  .registry-page {
    width: 100%;
    max-width: 120rem;
    margin: 0 auto;
  }

  .registry-page .registry-company-panel {
    min-height: 18rem;
  }

  .registry-page .registry-audit-panel {
    min-height: 24rem;
  }

  .registry-page .registry-audit-panel table {
    min-width: 52rem;
  }

  /* Gate page */
  .gate-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    background:
      radial-gradient(circle at 15% 15%, rgba(74, 222, 128, 0.10), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(74, 222, 128, 0.08), transparent 40%),
      var(--mt-bg, #f4f7f5);
    position: relative;
    overflow: hidden;
  }

  .gate-spark {
    position: absolute;
    color: #d4af37;
    opacity: 0.55;
  }

  .gate-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 22rem;
    text-align: center;
  }

  .gate-brandmark {
    height: 3.25rem;
    margin: 0 auto 0.5rem;
  }

  .gate-tagline {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: #6b7280;
    margin-bottom: 2rem;
  }

  .gate-door {
    background: linear-gradient(180deg, #2f6b46 0%, #1f4d33 100%);
    border-radius: 1.25rem 1.25rem 0.5rem 0.5rem;
    padding: 2.25rem 1.5rem 1.75rem;
    box-shadow: 0 18px 40px -12px rgba(15, 61, 38, 0.45);
    position: relative;
  }

  .gate-door::before {
    content: '';
    position: absolute;
    inset: 0.6rem;
    border: 1.5px solid rgba(255, 255, 255, 0.16);
    border-radius: 0.9rem 0.9rem 0.35rem 0.35rem;
    pointer-events: none;
  }

  .gate-panel {
    background: #ffffff;
    border-radius: 1rem;
    padding: 1.25rem 1.25rem 1.5rem;
    box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.25);
  }

  .gate-panel-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #1f4d33;
    margin-bottom: 0.75rem;
  }

  .gate-knob {
    width: 0.65rem;
    height: 0.65rem;
    border-radius: 9999px;
    background: #d4af37;
    position: absolute;
    left: 1.1rem;
    top: 50%;
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.25);
  }

  .gate-hint {
    color: #6b7280;
    font-size: 0.8rem;
    margin-top: 1.25rem;
  }
</style>
</head>
<body class="min-h-screen" style="background: var(--mt-bg);">
<div id="app" class="max-w-md mx-auto p-4"><p class="text-gray-400 text-center mt-10">Loading…</p></div>
<script>
let state = { session: null, isAdmin: false, role: null };
let errorMsg = '';
let sectionUnlocked = null;
let generatedInviteCode = '';
let generatedCompanyCode = '';
let registryChannel = null;

// Gate: a single site-wide password screen shown before anything else in the app.
// Uses the same section-password infrastructure as Registry/Accounts/Owner
// (platform_section_passwords + section_password_is_set / set_section_password /
// verify_section_password) with section = 'gate'. No new tables or RPCs.
let gateUnlocked = sessionStorage.getItem('metosync_gate_unlocked') === '1';
let gateError = '';
let gateChecking = false;

// Shared platform account used to auto sign-in every staff member after the gate,
// so no individual email/password screen is shown. This account is dedicated to
// this purpose (not any real staff member's personal login) and has role 'owner'
// so all three landing cards show — each section still needs its own password.
const SHARED_LOGIN_EMAIL = 'metstaff369@gmail.com';
const SHARED_LOGIN_PASSWORD = 'metostaff369*';

function app() { return document.getElementById('app'); }

async function init() {
  if (!gateUnlocked) { renderGate(); return; }
  state = await getSessionAndRole();
  if (!state.session) {
    const { error } = await sb.auth.signInWithPassword({ email: SHARED_LOGIN_EMAIL, password: SHARED_LOGIN_PASSWORD });
    if (error) { errorMsg = error.message; render(); return; }
    state = await getSessionAndRole();
  }
  render();
}

function sparkSvg(size) {
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="currentColor"><path d="M12 0c.6 4.6 2 8 4 10s5.4 3.4 8 4c-2.6.6-6 2-8 4s-3.4 5.4-4 10c-.6-4.6-2-8-4-10s-5.4-3.4-8-4c2.6-.6 6-2 8-4s3.4-5.4 4-10z"/></svg>`;
}

async function renderGate() {
  const { data: isSet, error: checkErr } = await sb.rpc('section_password_is_set', { p_section: 'gate' });
  if (checkErr) console.error('section_password_is_set error:', checkErr);

  app().classList.remove('platform-wide');
  app().className = 'gate-screen';
  app().innerHTML = `
    <span class="gate-spark" style="top:6%; left:6%;">${sparkSvg(28)}</span>
    <span class="gate-spark" style="top:8%; right:7%;">${sparkSvg(22)}</span>
    <span class="gate-spark" style="bottom:8%; left:8%;">${sparkSvg(22)}</span>
    <span class="gate-spark" style="bottom:6%; right:6%;">${sparkSvg(28)}</span>

    <div class="gate-card">
      <img src="metosync-logo.png" class="gate-brandmark" alt="Metosync Tech Inc.">
      <p class="gate-tagline">SOLUTIONS FOR EVERYDAY PROBLEMS</p>

      <div class="gate-door">
        <div class="gate-panel">
          <p class="gate-panel-label">ENTER PASSWORD</p>
          <div class="relative">
            <span class="gate-knob"></span>
            <input id="gatePassword" type="password" autocomplete="off" placeholder="${isSet ? 'Password' : 'Set a new password'}"
              class="w-full border rounded-xl pl-7 pr-4 py-2.5 text-sm text-center focus:outline-none focus:ring-2"
              style="border-color:#d1d5db;">
          </div>
          ${gateError ? `<p class="text-red-600 text-xs mt-2">${gateError}</p>` : ''}
          <button id="gateSubmitBtn" class="w-full mt-btn-primary mt-3">${gateChecking ? 'Checking…' : (isSet ? 'Enter' : 'Set & Continue')}</button>
        </div>
      </div>

      <p class="gate-hint">Enter the platform access password to continue.</p>
    </div>
  `;

  const submit = async () => {
    const pw = document.getElementById('gatePassword').value;
    if (!pw) { gateError = 'Enter the password.'; renderGate(); return; }
    gateChecking = true; gateError = ''; renderGate();
    try {
      if (!isSet) {
        const { error } = await sb.rpc('set_section_password', { p_section: 'gate', p_password: pw });
        gateChecking = false;
        if (error) { gateError = error.message; renderGate(); return; }
        gateUnlocked = true;
        sessionStorage.setItem('metosync_gate_unlocked', '1');
        init();
        return;
      }
      const { data: ok, error } = await sb.rpc('verify_section_password', { p_section: 'gate', p_password: pw });
      gateChecking = false;
      if (error) { gateError = error.message; renderGate(); return; }
      if (!ok) { gateError = 'Incorrect password.'; renderGate(); return; }
      gateUnlocked = true;
      sessionStorage.setItem('metosync_gate_unlocked', '1');
      init();
    } catch (err) {
      gateChecking = false;
      gateError = err.message || 'An unexpected error occurred.';
      renderGate();
    }
  };

  document.getElementById('gateSubmitBtn').onclick = submit;
  const pwInput = document.getElementById('gatePassword');
  pwInput.focus();
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
}

function render() {
  if (!gateUnlocked) { renderGate(); return; }
  if (registryChannel) { sb.removeChannel(registryChannel); registryChannel = null; }
  app().className = 'max-w-md mx-auto p-4';
  app().classList.toggle('platform-wide', sectionUnlocked === 'registry' || sectionUnlocked === 'owner');
  if (!state.session) return renderConnecting();
  if (!state.isAdmin) return renderNoAccess();
  if (sectionUnlocked) return renderSection(sectionUnlocked);
  renderLanding();
}

function renderConnecting() {
  app().innerHTML = `
    <div class="mt-card mt-fade-in p-6 mt-10 text-center">
      ${errorMsg
        ? `<p class="text-red-600 text-sm mb-3">${errorMsg}</p><button id="retryBtn" class="mt-btn-primary">Retry</button>`
        : `<p class="text-gray-400">Connecting…</p>`}
    </div>`;
  const retryBtn = document.getElementById('retryBtn');
  if (retryBtn) retryBtn.onclick = () => { errorMsg = ''; init(); };
}

function renderNoAccess() {
  app().innerHTML = `
    <div class="mt-card text-center p-6 mt-10">
      <p class="text-gray-600 mb-3">This account does not have platform-admin access.</p>
      <button id="logoutBtn" class="mt-btn-outline">Log out</button>
    </div>`;
  document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); state = { session: null, isAdmin: false, role: null }; render(); };
}

async function renderLanding() {
  const { data: info } = await sb.rpc('platform_my_login_info');
  const name = info ? info.full_name : '';
  const roleLabel = state.role === 'owner' ? 'Owner' : 'Staff';
  const lastLogin = info && info.last_sign_in_at ? new Date(info.last_sign_in_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + ' · ' + new Date(info.last_sign_in_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) : '—';

  const cards = [
    state.role === 'owner' ? {
      id: 'ownerBtn', tint: '#e8f7ef', accent: '#12805c', title: 'Owner Dashboard',
      desc: 'Access your dashboard, manage your organization and more.',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 21h16M5 21V10M19 21V10M3 10l9-6 9 6M7 10v4M12 10v4M17 10v4"/></svg>`
    } : null,
    {
      id: 'registryBtn', tint: '#eaf2fe', accent: '#1d4ed8', title: 'Registry',
      desc: 'Register new companies and manage company records.',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="4" width="12" height="17" rx="2"/><path stroke-linecap="round" d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1M9 10h6M9 14h6M9 18h3"/></svg>`
    },
    {
      id: 'accountsBtn', tint: '#fdf1de', accent: '#b45309', title: 'Accounts & Billing',
      desc: 'Manage accounts, subscriptions, invoices and payments.',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path stroke-linecap="round" d="M3 10h18"/><path stroke-linecap="round" d="M7 15h4"/></svg>`
    }
  ].filter(Boolean);

  app().innerHTML = `
    <div class="mt-fade-in bg-white rounded-3xl shadow-xl p-7 sm:p-9 max-w-md mx-auto mt-8">
      <div class="text-center mb-6">
        <img src="metosync-logo.png" class="h-16 mx-auto mb-5" alt="Metosync">
        <div class="w-12 h-12 rounded-full mx-auto mb-4 flex items-center justify-center" style="background: var(--mt-green-light); color: var(--mt-green-dark);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4"/></svg>
        </div>
        <p class="text-gray-500 text-sm mb-0.5">Welcome to</p>
        <h1 class="text-2xl font-bold mb-2"><span style="color: var(--mt-navy);">Metosync</span> <span style="color: var(--mt-green);">Tech Inc.</span></h1>
        <div class="flex items-center justify-center gap-3">
          <span class="h-px w-8" style="background: var(--mt-border);"></span>
          <span class="text-xs text-gray-400">Staff Sign in Here</span>
          <span class="h-px w-8" style="background: var(--mt-border);"></span>
        </div>
      </div>

      <div class="space-y-3 mb-6">
        ${cards.map(c => `
          <button type="button" data-card="${c.id}" class="w-full text-left rounded-2xl p-4 flex items-center gap-4 transition hover:brightness-95" style="background: ${c.tint};">
            <span class="w-12 h-12 rounded-full flex items-center justify-center shrink-0 bg-white" style="color: ${c.accent};">
              <span class="w-5 h-5 block">${c.icon}</span>
            </span>
            <span class="flex-1">
              <span class="block font-bold text-sm mb-0.5" style="color: ${c.accent};">${c.title}</span>
              <span class="block text-xs text-gray-500 leading-snug">${c.desc}</span>
            </span>
            <span class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 text-white" style="background: ${c.accent};">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
            </span>
          </button>
        `).join('')}
      </div>

      <div class="flex items-center justify-center gap-3 mb-4">
        <span class="h-px w-10" style="background: var(--mt-border);"></span>
        <span class="w-7 h-7 rounded-full flex items-center justify-center" style="background: var(--mt-green-light); color: var(--mt-green-dark);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5"><rect x="5" y="10" width="14" height="10" rx="2"/><path stroke-linecap="round" d="M8 10V7a4 4 0 018 0v3"/></svg>
        </span>
        <span class="h-px w-10" style="background: var(--mt-border);"></span>
      </div>
      <p class="text-center text-sm text-gray-600 mb-1">Signed in as <span class="font-bold" style="color: var(--mt-green-dark);">${name}</span></p>
      <p class="text-center text-xs text-gray-400 mb-4">(${roleLabel})</p>

      <button id="logoutBtn" type="button" class="w-full border rounded-xl px-4 py-3 flex items-center justify-center gap-2 text-sm font-semibold hover:bg-gray-50" style="border-color: var(--mt-border); color: var(--mt-navy);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7M7 4H5a2 2 0 00-2 2v12a2 2 0 002 2h2"/></svg>
        Log Out
      </button>
      <p class="text-center text-xs text-gray-400 mt-1">Last login: ${lastLogin}</p>
    </div>`;

  document.querySelectorAll('[data-card]').forEach(btn => {
    btn.onclick = () => {
      if (btn.dataset.card === 'ownerBtn') { promptSectionPassword('owner'); return; }
      if (btn.dataset.card === 'registryBtn') { promptSectionPassword('registry'); return; }
      if (btn.dataset.card === 'accountsBtn') { promptSectionPassword('accounts'); return; }
    };
  });
  document.getElementById('logoutBtn').onclick = async () => {
    await sb.auth.signOut();
    state = { session: null, isAdmin: false, role: null };
    render();
  };
}

async function promptSectionPassword(section, customError = '') {
  errorMsg = customError;
  const { data: isSet, error: checkErr } = await sb.rpc('section_password_is_set', { p_section: section });
  if (checkErr) {
    console.error('section_password_is_set error:', checkErr);
  }
  const sectionTitle = section === 'owner' ? 'Owner Dashboard' : section.charAt(0).toUpperCase() + section.slice(1);
  app().innerHTML = `
    <div class="mt-card mt-fade-in p-6 mt-10">
      <h1 class="text-lg font-bold text-center mb-4" style="color: var(--mt-green-dark);">${sectionTitle} — Password Required</h1>
      <div class="relative mb-3">
        <input id="sectionPw" type="password" autocomplete="off" placeholder="${isSet ? 'Enter password' : 'Set a new password'}" class="w-full border rounded-xl px-4 py-3 pr-10">
        <button type="button" onclick="toggleEye('sectionPw',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">👁</button>
      </div>
      <p id="sectionPwError" class="text-red-600 text-sm mb-3 ${errorMsg ? '' : 'hidden'}">${errorMsg}</p>
      <button id="submitPwBtn" class="w-full mt-btn-primary mb-2">${isSet ? 'Unlock' : 'Set & Continue'}</button>
      <button id="backBtn" class="w-full text-sm text-gray-500">← Back</button>
    </div>`;

  const errEl = document.getElementById('sectionPwError');
  const showErr = (msg) => {
    if (errEl) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }
  };

  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
  
  document.getElementById('submitPwBtn').onclick = async () => {
    const pw = document.getElementById('sectionPw').value;
    if (!pw) { showErr('Enter a password.'); return; }
    
    const submitBtn = document.getElementById('submitPwBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Verifying…';

    try {
      if (!isSet) {
        const { error } = await sb.rpc('set_section_password', { p_section: section, p_password: pw });
        if (error) {
          showErr(error.message);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Set & Continue';
          return;
        }
        sectionUnlocked = section;
        render();
        return;
      }
      
      const { data: ok, error } = await sb.rpc('verify_section_password', { p_section: section, p_password: pw });
      if (error) {
        showErr(error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Unlock';
        return;
      }
      if (!ok) {
        showErr('Incorrect password.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Unlock';
        return;
      }
      sectionUnlocked = section;
      render();
    } catch (err) {
      showErr(err.message || 'An unexpected error occurred.');
      submitBtn.disabled = false;
      submitBtn.textContent = isSet ? 'Unlock' : 'Set & Continue';
    }
  };

  const pwInput = document.getElementById('sectionPw');
  if (pwInput) {
    pwInput.focus();
    pwInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('submitPwBtn').click(); }
    });
  }
}

function renderSection(section) {
  if (section === 'owner') return renderOwnerDashboard();
  if (section === 'registry') return renderRegistry();
  app().innerHTML = `
    <div class="mt-card text-center p-6 mt-10">
      <h1 class="text-lg font-bold mb-2 capitalize" style="color: var(--mt-green-dark);">${section}</h1>
      <p class="text-sm text-gray-500 mb-4">Content for this section comes next.</p>
      <button id="backBtn" class="mt-btn-outline">← Back</button>
    </div>`;
  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
}

async function renderOwnerDashboard() {
  app().innerHTML = `<p class="text-gray-400 text-center mt-10">Loading…</p>`;
  const [{ data: companies, error }, { data: stats, error: statsError }] = await Promise.all([
    sb.rpc('platform_list_companies'),
    sb.rpc('platform_registry_stats')
  ]);
  if (error) { app().innerHTML = `<p class="text-red-600 text-center mt-10">${error.message}</p>`; return; }
  if (statsError) { app().innerHTML = `<p class="text-red-600 text-center mt-10">${statsError.message}</p>`; return; }
  const statsRow = Array.isArray(stats) ? stats[0] || {} : stats || {};
  const companyCards = (companies || []).map(companyCardHtml).join('');

  app().innerHTML = `
    <div class="registry-page mt-fade-in">
      <div class="flex justify-between items-center mt-6 mb-4">
        <h1 class="text-lg font-bold" style="color: var(--mt-green-dark);">🏛️ Owner Dashboard</h1>
        <button id="backBtn" class="text-sm text-gray-500">← Back</button>
      </div>
      ${statsCardsHtml(statsRow)}
      <div class="mt-card p-5 mb-5 registry-company-panel">
        <div class="flex justify-between items-center gap-2 mb-3"><h2 class="font-medium text-sm">Companies</h2><input id="companySearch" type="search" placeholder="Search companies..." class="border rounded-lg px-3 py-2 text-sm"></div>
        <div id="companyCards" class="space-y-2">${companyCards || '<p class="text-gray-400 text-sm">No companies yet.</p>'}</div>
      </div>
      <div class="mt-card p-4 mb-4">
        <h2 class="font-medium mb-2 text-sm">Invite a Platform Admin</h2>
        <button id="genInviteBtn" class="mt-btn-primary">Generate Code</button>
        ${generatedInviteCode ? `<p class="mt-2 font-mono text-sm px-3 py-2 inline-block rounded-lg" style="background: var(--mt-green-light);">${generatedInviteCode}</p>` : ''}
      </div>
      <div class="mt-card p-4">
        <h2 class="font-medium mb-2 text-sm">Generate New Company Invite Code</h2>
        <button id="genCompanyInviteBtn" class="mt-btn-primary">Generate Code</button>
        ${generatedCompanyCode ? `<p class="mt-2 font-mono text-sm px-3 py-2 inline-block rounded-lg" style="background: var(--mt-green-light);">${generatedCompanyCode}</p>` : ''}
      </div>
    </div>`;

  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
  wireCompanyInteractions(companies || [], true);
  document.getElementById('genInviteBtn').onclick = async () => {
    const { data, error } = await sb.rpc('create_platform_invite');
    if (!error) generatedInviteCode = data;
    renderOwnerDashboard();
  };
  document.getElementById('genCompanyInviteBtn').onclick = async () => {
    const { data, error } = await sb.rpc('create_onboarding_invite');
    if (!error) generatedCompanyCode = data;
    renderOwnerDashboard();
  };
}

function metricValue(row, ...keys) {
  const key = keys.find(candidate => row && row[candidate] !== undefined && row[candidate] !== null);
  return key ? row[key] : null;
}

function companyLogoHtml(company, size = 'w-10 h-10') {
  return company.logo_url
    ? `<img src="${company.logo_url}" alt="${company.name || 'Company'} logo" class="${size} rounded-xl object-contain bg-white p-1 border" loading="lazy">`
    : `<div class="${size} rounded-full flex items-center justify-center text-white font-bold" style="background: var(--mt-green-dark);">${(company.name || '?').trim().charAt(0).toUpperCase() || '?'}</div>`;
}

function statsCardsHtml(stats) {
  const metrics = [
    [['companies', 'total_companies'], 'Companies', '#2563eb'],
    [['total_staff', 'staff'], 'Total Staff', '#0f766e'],
    [['sites', 'total_sites'], 'Sites', '#d97706'],
    [['new_this_month', 'new_companies_this_month'], 'New This Month', '#e11d48']
  ].filter(([keys]) => metricValue(stats, ...keys) !== null);
  return `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">${metrics.map(([keys, label, color]) => `<div class="mt-card p-3 text-center" style="border-top: 4px solid ${color};"><p class="text-2xl font-bold" style="color: ${color};">${metricValue(stats, ...keys)}</p><p class="text-xs text-gray-500">${label}</p></div>`).join('')}</div>`;
}

function companyCardHtml(company) {
  const companyId = company.id || company.company_id;
  const statusClass = company.status === 'active' ? 'active' : company.status === 'inactive' ? 'inactive' : 'pending';
  return `<div class="companyCard flex items-center gap-3 border rounded-xl p-3" data-name="${(company.name || '').toLowerCase()}" data-code="${(company.org_code || '').toLowerCase()}">
    ${companyLogoHtml(company)}
    <div class="min-w-0 flex-1"><p class="font-medium truncate">${company.name || ''}</p><p class="text-xs text-gray-400 font-mono">${company.org_code || ''}</p><p class="text-xs text-gray-500">${metricValue(company, 'staff_count') !== null ? `Staff: ${metricValue(company, 'staff_count')}` : ''}${metricValue(company, 'site_count', 'sites_count') !== null ? ` · Sites: ${metricValue(company, 'site_count', 'sites_count')}` : ''}</p></div>
    <span class="mt-badge ${statusClass}">${company.status || ''}</span><button type="button" class="viewCompanyBtn mt-btn-outline text-xs" data-company-id="${companyId || ''}" ${companyId ? '' : 'disabled'}>View Details</button>
  </div>`;
}

function wireCompanyInteractions(companies, ownerDashboard = false) {
  const search = document.getElementById('companySearch');
  search.oninput = () => { const query = search.value.trim().toLowerCase(); document.querySelectorAll('.companyCard').forEach(card => card.classList.toggle('hidden', query && !`${card.dataset.name} ${card.dataset.code}`.includes(query))); };
  document.querySelectorAll('.viewCompanyBtn').forEach(button => { button.onclick = () => openCompanyDetails(button.dataset.companyId, ownerDashboard); });
}

function detailMetric(label, value) {
  return value === null ? '' : `<p class="text-xs">${label}: ${value}</p>`;
}

async function openCompanyDetails(companyId, ownerDashboard = false) {
  if (!companyId) { alert('Company ID is missing from the company list.'); return; }
  const [{ data: detail, error: detailError }, { data: activity, error: activityError }] = await Promise.all([
    sb.rpc('platform_get_company_detail', { p_company_id: companyId }),
    sb.rpc('registry_list_company_activity', { p_company_id: companyId })
  ]);
  if (detailError || activityError) { alert((detailError || activityError).message); return; }
  const company = Array.isArray(detail) ? detail[0] || {} : detail || {};
  const activityRows = (activity || []).map(item => `<tr class="border-b"><td class="py-2 px-3">${item.category || ''}</td><td class="py-2 px-3">${item.action || ''}</td><td class="py-2 px-3">${item.detail || ''}</td><td class="py-2 px-3 text-xs text-gray-400">${item.performed_at ? new Date(item.performed_at).toLocaleString() : ''}</td></tr>`).join('');
  const servicePlan = company.service_plan || '';
  const servicePlanHtml = state.role === 'owner' ? `<div class="mt-card p-3 mb-4"><p class="font-medium text-sm mb-2">Service Plan</p><div class="flex items-center gap-2"><select id="companyServicePlan" class="border rounded-lg px-3 py-2 text-sm"><option value="attendance" ${servicePlan === 'attendance' ? 'selected' : ''}>Attendance Only</option><option value="payroll" ${servicePlan === 'payroll' ? 'selected' : ''}>Payroll Only</option><option value="both" ${servicePlan === 'both' ? 'selected' : ''}>Attendance + Payroll</option></select><button id="saveCompanyPlanBtn" type="button" class="mt-btn-primary">Save Plan</button></div><p class="text-xs text-gray-500 mt-2">Generate an invoice for this company's plan from the Accounts &amp; Billing section.</p></div>` : '';
  const moderationHtml = ownerDashboard && state.role === 'owner' ? `<div class="mt-card p-3 mt-5"><p class="font-medium text-sm mb-2">Company Moderation</p><label class="block text-xs text-gray-500 mb-1" for="companyModerationReason">Reason (recorded on file)</label><input id="companyModerationReason" type="text" class="w-full border rounded-lg px-3 py-2 text-sm mb-3"><div class="flex flex-wrap gap-2">${company.status !== 'active' ? '<button id="reactivateCompanyBtn" type="button" class="mt-btn-primary">Reactivate</button>' : ''}${company.status !== 'closed' ? '<button id="closeCompanyBtn" type="button" class="mt-btn-outline" style="color:#4b5563;border-color:#9ca3af;">Close Company</button>' : ''}${company.status !== 'blocked' ? '<button id="blockCompanyBtn" type="button" class="mt-btn-danger-outline">Block Company</button>' : ''}</div><div class="border-t mt-3 pt-3"><button id="deleteCompanyBtn" type="button" class="mt-btn-danger-outline">Delete Permanently</button></div><p id="companyModerationError" class="text-red-600 text-sm mt-2"></p></div>` : '';
  const modal = document.createElement('div');
  modal.id = 'companyDetailModal'; modal.className = 'fixed inset-0 bg-black/40 z-50 p-4 overflow-y-auto';
  modal.innerHTML = `<div class="mt-card max-w-2xl mx-auto mt-8 p-5"><div class="flex justify-between items-start mb-4"><div class="flex items-center gap-3">${companyLogoHtml(company, 'w-12 h-12')}<div><h2 class="text-lg font-bold" style="color: var(--mt-green-dark);">${company.name || ''}</h2><p class="text-xs text-gray-400 font-mono">${company.org_code || ''}</p></div></div><button id="closeCompanyDetail" type="button" class="mt-btn-outline">Close</button></div>
    ${company.status !== undefined && company.status !== null ? `<p class="text-sm mb-4">Status: <span class="mt-badge ${company.status === 'active' ? 'active' : company.status === 'inactive' ? 'inactive' : 'pending'}">${company.status}</span></p>` : ''}
    <div class="grid grid-cols-2 gap-2 mb-4"><div><p class="text-xs text-gray-500">Admin</p><p class="text-sm">${company.admin_name || ''}${company.admin_mobile ? ` · ${company.admin_mobile}` : ''}</p></div><div><p class="text-xs text-gray-500">Billing Email</p><p class="text-sm">${company.billing_email || ''}</p></div></div>
    ${servicePlanHtml}
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4"><div class="mt-card p-3"><p class="font-medium text-sm">Staff</p>${detailMetric('Total', metricValue(company, 'staff_total', 'total_staff'))}${detailMetric('Active', metricValue(company, 'staff_active'))}${detailMetric('On leave', metricValue(company, 'staff_on_leave'))}${detailMetric('Inactive', metricValue(company, 'staff_inactive'))}</div><div class="mt-card p-3"><p class="font-medium text-sm">Sites</p>${detailMetric('Total', metricValue(company, 'sites_total', 'total_sites'))}${detailMetric('With GPS', metricValue(company, 'sites_with_gps'))}${detailMetric('Without GPS', metricValue(company, 'sites_without_gps'))}</div><div class="mt-card p-3"><p class="font-medium text-sm">Attendance Last 30 Days</p>${detailMetric('Present', metricValue(company, 'attendance_present'))}${detailMetric('Late', metricValue(company, 'attendance_late'))}${detailMetric('Absent', metricValue(company, 'attendance_absent'))}</div></div>
    <h3 class="font-medium text-sm mb-2">Company Audit Trail</h3><div class="overflow-x-auto"><table class="w-full mt-table"><thead><tr><th>Type</th><th>Action</th><th>Detail</th><th>When</th></tr></thead><tbody>${activityRows || '<tr><td class="text-gray-400" colspan="4">No activity yet.</td></tr>'}</tbody></table></div>${moderationHtml}</div>`;
  document.body.appendChild(modal); document.getElementById('closeCompanyDetail').onclick = () => modal.remove();
  if (state.role === 'owner') {
    document.getElementById('saveCompanyPlanBtn').onclick = async () => {
      const plan = document.getElementById('companyServicePlan').value;
      const { error } = await sb.rpc('platform_set_company_service_plan', { p_company_id: companyId, p_plan: plan });
      if (error) { alert(error.message); return; }
      modal.remove();
      openCompanyDetails(companyId);
    };
  }
  if (ownerDashboard && state.role === 'owner') {
    const moderationError = document.getElementById('companyModerationError');
    const runModerationAction = async (status) => {
      moderationError.textContent = '';
      const reason = document.getElementById('companyModerationReason').value.trim() || null;
      const { error } = await sb.rpc('platform_set_company_status', { p_company_id: companyId, p_status: status, p_reason: reason });
      if (error) { moderationError.textContent = error.message; return; }
      modal.remove();
      renderOwnerDashboard();
    };
    const reactivateButton = document.getElementById('reactivateCompanyBtn');
    const closeButton = document.getElementById('closeCompanyBtn');
    const blockButton = document.getElementById('blockCompanyBtn');
    if (reactivateButton) reactivateButton.onclick = () => runModerationAction('active');
    if (closeButton) closeButton.onclick = () => runModerationAction('closed');
    if (blockButton) blockButton.onclick = () => runModerationAction('blocked');
    document.getElementById('deleteCompanyBtn').onclick = async () => {
      if (!confirm(`Delete ${company.name}? This cannot be undone.`)) return;
      moderationError.textContent = '';
      const { error } = await sb.rpc('platform_delete_company', { p_company_id: companyId });
      if (error) { moderationError.textContent = error.message; return; }
      modal.remove();
      renderOwnerDashboard();
    };
  }
}

function staffChangeRow(c, isNew) {
  const actionColor = c.action === 'created' ? 'active' : c.action === 'deleted' ? 'inactive' : 'pending';
  return `
    <tr id="chg-${c.id}" class="${isNew ? 'mt-row-new' : ''}">
      <td>${c.company_name}</td>
      <td>${c.staff_name}</td>
      <td><span class="mt-badge ${actionColor}">${c.action}</span></td>
      <td class="text-xs text-gray-400">${new Date(c.changed_at).toLocaleString()}</td>
    </tr>`;
}

async function renderRegistry() {
  app().innerHTML = `<p class="text-gray-400 text-center mt-10">Loading…</p>`;
  const [{ data: companies, error }, { data: changes, error: changesError }, { data: stats, error: statsError }] = await Promise.all([
    sb.rpc('platform_list_companies'),
    sb.rpc('registry_list_all_activity'),
    sb.rpc('platform_registry_stats')
  ]);
  if (error || changesError || statsError) {
    const failure = error || changesError || statsError;
    app().innerHTML = `<p class="text-red-600 text-center mt-10">${failure.message}</p>`;
    return;
  }
  const statsRow = Array.isArray(stats) ? stats[0] || {} : stats || {};
  const companyCards = (companies || []).map(companyCardHtml).join('');
  const companyByName = new Map((companies || []).map(company => [company.name, company]));

  const catStyle = { staff: 'bg-blue-100 text-blue-800', attendance: 'bg-green-100 text-green-800', activity: 'bg-purple-100 text-purple-800' };
  const rowsHtml = (changes || []).map(c => `
    <tr id="chg-${c.id}">
      <td><div class="flex items-center gap-2">${companyLogoHtml(companyByName.get(c.company_name) || { name: c.company_name })}<span>${c.company_name}</span></div></td>
      <td><span class="mt-badge" style="background:transparent;" class="px-2 py-0.5 rounded-full text-xs font-medium ${catStyle[c.category] || 'bg-gray-100 text-gray-800'}">${c.category}</span></td>
      <td class="capitalize">${c.action}</td>
      <td class="text-xs">${c.detail || ''}</td>
      <td class="text-xs text-gray-400">${new Date(c.performed_at).toLocaleString()}</td>
    </tr>`).join('');

  app().innerHTML = `
    <div class="registry-page mt-fade-in">
      <div class="flex justify-between items-center mt-6 mb-4">
        <h1 class="text-lg font-bold" style="color: var(--mt-green-dark);">📋 Registry <span class="text-xs font-normal text-green-600 align-middle">● live</span></h1>
        <button id="backBtn" class="text-sm text-gray-500">← Back</button>
      </div>
      ${statsCardsHtml(statsRow)}
      <div class="mt-card p-5 mb-5 registry-company-panel">
        <div class="flex justify-between items-center gap-2 mb-3"><h2 class="font-medium text-sm">Companies</h2><input id="companySearch" type="search" placeholder="Search companies..." class="border rounded-lg px-3 py-2 text-sm"></div>
        <div id="companyCards" class="space-y-2">${companyCards || '<p class="text-gray-400 text-sm">No companies yet.</p>'}</div>
      </div>
      <div class="mt-card p-4 mb-4">
        <h2 class="font-medium mb-2 text-sm">Generate New Company Invite Code</h2>
        <button id="genCompanyInviteBtn" class="mt-btn-primary">Generate Code</button>
        ${generatedCompanyCode ? `<p class="mt-2 font-mono text-sm px-3 py-2 inline-block rounded-lg" style="background: var(--mt-green-light);">${generatedCompanyCode}</p>` : ''}
      </div>
      <div class="mt-card p-5 overflow-x-auto registry-audit-panel">
        <h2 class="font-medium mb-2 text-sm">Full Audit Trail — All Organizations</h2>
        <table class="w-full mt-table"><thead><tr><th>Company</th><th>Type</th><th>Action</th><th>Detail</th><th>When</th></tr></thead>
          <tbody id="changesBody">${rowsHtml || `<tr><td class="text-gray-400" colspan="5">${error ? error.message : 'No activity yet.'}</td></tr>`}</tbody></table>
      </div>
    </div>`;

  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
  wireCompanyInteractions(companies || []);
  document.getElementById('genCompanyInviteBtn').onclick = async () => {
    const { data, error } = await sb.rpc('create_onboarding_invite');
    if (!error) generatedCompanyCode = data;
    renderRegistry();
  };

  // Live updates across all three source tables
  registryChannel = sb
    .channel('registry-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'staff_changes' }, () => renderRegistry())
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance_status_changes' }, () => renderRegistry())
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'company_activity_log' }, () => renderRegistry())
    .subscribe();
}

init();
</script>
</body>
</html>
