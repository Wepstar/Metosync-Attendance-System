<style>
  .role-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .role-grid { grid-template-columns: repeat(2, 1fr); } }
  .role-card { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; background: #fff; border: 1px solid var(--mt-border); border-left: 4px solid var(--rc, #0d2a4d); border-radius: 14px; padding: 14px 16px; cursor: pointer; text-align: left; box-shadow: 0 1px 3px rgba(13,42,77,.07); transition: transform .18s ease, box-shadow .18s ease, background .18s ease; animation: roleCardIn .35s ease both; }
  .role-card:hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 10px 24px rgba(13,42,77,.14); }
  .role-card.selected { background: var(--rc-bg, #f4f7f5); border-color: var(--rc, #0d2a4d); animation: selectPulse .35s ease; }
  .role-icon { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0; background: var(--rc-bg, #e6eef7); color: var(--rc, #0d2a4d); font-weight: 800; }
  .role-info { flex: 1; min-width: 0; }
  .role-name { font-weight: 700; font-size: 14px; color: #0d2a4d; }
  .role-description { font-size: 12px; color: #6b7280; margin-top: 2px; line-height: 1.4; }
  .role-step { font-weight: 800; font-size: 20px; color: var(--rc, #0d2a4d); font-variant-numeric: tabular-nums; }
  .role-check { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; background: var(--rc, #0d2a4d); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; opacity: 0; transform: scale(.5); transition: all .2s ease; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .role-card.selected .role-check { opacity: 1; transform: scale(1); }
  @keyframes roleCardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes selectPulse { 0% { box-shadow: 0 0 0 0 rgba(13,42,77,.35); } 100% { box-shadow: 0 0 0 14px rgba(13,42,77,0); } }
  .invite-code-box { animation: codeIn .45s ease-out; }
  @keyframes codeIn { from { opacity: 0; transform: scale(.96); box-shadow: 0 0 0 0 rgba(13,42,77,.3); } to { opacity: 1; transform: scale(1); box-shadow: 0 0 24px rgba(13,42,77,.15); } }

  #app.platform-wide {
    width: 100%;
    max-width: none;
    padding: 1.5rem clamp(1rem, 3vw, 3rem);
  }

  .registry-page {
    width: 100%;
    max-width: 120rem;
    margin: 0 auto;
  }

  .registry-page .registry-company-panel {
    min-height: 18rem;
  }

  .registry-page .registry-audit-panel {
    min-height: 24rem;
  }

  .registry-page .registry-audit-panel table {
    min-width: 52rem;
  }

  /* Gate page */
  .gate-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    background:
      radial-gradient(circle at 15% 15%, rgba(74, 222, 128, 0.10), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(74, 222, 128, 0.08), transparent 40%),
      var(--mt-bg, #f4f7f5);
    position: relative;
    overflow: hidden;
  }

  .gate-spark {
    position: absolute;
    color: #d4af37;
    opacity: 0.55;
  }

  .gate-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 22rem;
    text-align: center;
  }

  .gate-brandmark {
    height: 3.25rem;
    margin: 0 auto 0.5rem;
  }

  .gate-tagline {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: #6b7280;
    margin-bottom: 2rem;
  }

  .gate-door {
    background: linear-gradient(180deg, #2f6b46 0%, #1f4d33 100%);
    border-radius: 1.25rem 1.25rem 0.5rem 0.5rem;
    padding: 2.25rem 1.5rem 1.75rem;
    box-shadow: 0 18px 40px -12px rgba(15, 61, 38, 0.45);
    position: relative;
  }

  .gate-door::before {
    content: '';
    position: absolute;
    inset: 0.6rem;
    border: 1.5px solid rgba(255, 255, 255, 0.16);
    border-radius: 0.9rem 0.9rem 0.35rem 0.35rem;
    pointer-events: none;
  }

  .gate-panel {
    background: #ffffff;
    border-radius: 1rem;
    padding: 1.25rem 1.25rem 1.5rem;
    box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.25);
  }

  .gate-panel-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #1f4d33;
    margin-bottom: 0.75rem;
  }

  .gate-knob {
    width: 0.65rem;
    height: 0.65rem;
    border-radius: 9999px;
    background: #d4af37;
    position: absolute;
    left: 1.1rem;
    top: 50%;
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.25);
  }

  .gate-hint {
    color: #6b7280;
    font-size: 0.8rem;
    margin-top: 1.25rem;
  }
</style>

<body class="min-h-screen" style="background: var(--mt-bg);">
<div id="toastContainer" class="fixed top-4 right-4 z-50 w-full max-w-xs"></div>
<div id="app" class="max-w-md mx-auto p-4"><p class="text-gray-400 text-center mt-10">Loading…</p></div>
<script>
let state = { session: null, isAdmin: false, role: null };
let errorMsg = '';
let sectionUnlocked = null;
let generatedInviteCode = '';
let generatedCompanyCode = '';
let registryChannel = null;

// Gate: a single site-wide password screen shown before anything else in the app.
// Uses the same section-password infrastructure as Registry/Accounts/Owner
// (platform_section_passwords + section_password_is_set / set_section_password /
// verify_section_password) with section = 'gate'. No new tables or RPCs.
let gateUnlocked = sessionStorage.getItem('metosync_gate_unlocked') === '1';
let gateError = '';
let gateChecking = false;

// Shared platform account used to auto sign-in every staff member after the gate,
// so no individual email/password screen is shown. This account is dedicated to
// this purpose (not any real staff member's personal login) and has role 'owner'
// so all three landing cards show — each section still needs its own password.
const SHARED_LOGIN_EMAIL = 'metstaff369@gmail.com';
const SHARED_LOGIN_PASSWORD = 'metostaff369*';

function app() { return document.getElementById('app'); }

function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])); }

function playAlertBeep() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (e) { console.warn('Alert beep failed', e); }
}

function showToast(severity, title, message) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const colorClass = severity === 'critical' ? 'border-red-400 bg-red-50 text-red-900' : severity === 'warning' ? 'border-amber-400 bg-amber-50 text-amber-900' : 'border-blue-400 bg-blue-50 text-blue-900';
  const toast = document.createElement('div');
  toast.className = `rounded-xl border shadow-lg p-4 mb-3 mt-fade-in ${colorClass}`;
  toast.innerHTML = `<div class="flex items-start justify-between gap-3"><div><p class="font-bold text-sm">${escapeHtml(title)}</p><p class="text-sm mt-1">${escapeHtml(message)}</p></div><button type="button" class="text-lg leading-none" aria-label="Dismiss">&times;</button></div>`;
  toast.querySelector('button').onclick = () => toast.remove();
  container.appendChild(toast);
  if (severity === 'critical') playAlertBeep();
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 8000);
}

let platformWatchGuardChannel = null;

function subscribeToPlatformWatchGuard() {
  if (platformWatchGuardChannel) return;
  platformWatchGuardChannel = sb
    .channel('platform-watchguard-alerts')
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'watch_guard_events'
    }, payload => {
      const ev = payload.new;
      showToast(ev.severity, `Watch Guard: ${ev.category}`, ev.message);
    })
    .subscribe(status => {
      if (status === 'SUBSCRIBED') console.log('Platform Watch Guard realtime alerts active');
    });
}

async function init() {
  if (!gateUnlocked) { renderGate(); return; }
  state = await getSessionAndRole();
  if (!state.session) {
    const { error } = await sb.auth.signInWithPassword({ email: SHARED_LOGIN_EMAIL, password: SHARED_LOGIN_PASSWORD });
    if (error) { errorMsg = error.message; render(); return; }
    state = await getSessionAndRole();
  }
  if (state.session && state.isAdmin) subscribeToPlatformWatchGuard();
  render();
}

function sparkSvg(size) {
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="currentColor"><path d="M12 0c.6 4.6 2 8 4 10s5.4 3.4 8 4c-2.6.6-6 2-8 4s-3.4 5.4-4 10c-.6-4.6-2-8-4-10s-5.4-3.4-8-4c2.6-.6 6-2 8-4s3.4-5.4 4-10z"/></svg>`;
}

async function renderGate() {
  const { data: isSet, error: checkErr } = await sb.rpc('section_password_is_set', { p_section: 'gate' });
  if (checkErr) console.error('section_password_is_set error:', checkErr);

  app().classList.remove('platform-wide');
  app().className = 'gate-screen';
  app().innerHTML = `
    <span class="gate-spark" style="top:6%; left:6%;">${sparkSvg(28)}</span>
    <span class="gate-spark" style="top:8%; right:7%;">${sparkSvg(22)}</span>
    <span class="gate-spark" style="bottom:8%; left:8%;">${sparkSvg(22)}</span>
    <span class="gate-spark" style="bottom:6%; right:6%;">${sparkSvg(28)}</span>

    <div class="gate-card">
      <img src="metosync-logo.png" class="gate-brandmark" alt="Metosync Tech Inc.">
      <p class="gate-tagline">SOLUTIONS FOR EVERYDAY PROBLEMS</p>

      <div class="gate-door">
        <div class="gate-panel">
          <p class="gate-panel-label">ENTER PASSWORD</p>
          <div class="relative">
            <span class="gate-knob"></span>
            <input id="gatePassword" type="password" autocomplete="off" placeholder="${isSet ? 'Password' : 'Set a new password'}"
              class="w-full border rounded-xl pl-7 pr-4 py-2.5 text-sm text-center focus:outline-none focus:ring-2"
              style="border-color:#d1d5db;">
          </div>
          ${gateError ? `<p class="text-red-600 text-xs mt-2">${gateError}</p>` : ''}
          <button id="gateSubmitBtn" class="w-full mt-btn-primary mt-3">${gateChecking ? 'Checking…' : (isSet ? 'Enter' : 'Set & Continue')}</button>
        </div>
      </div>

      <p class="gate-hint">Enter the platform access password to continue.</p>
    </div>
  `;

  const submit = async () => {
    const pw = document.getElementById('gatePassword').value;
    if (!pw) { gateError = 'Enter the password.'; renderGate(); return; }
    gateChecking = true; gateError = ''; renderGate();
    try {
      if (!isSet) {
        const { error } = await sb.rpc('set_section_password', { p_section: 'gate', p_password: pw });
        gateChecking = false;
        if (error) { gateError = error.message; renderGate(); return; }
        gateUnlocked = true;
        sessionStorage.setItem('metosync_gate_unlocked', '1');
        init();
        return;
      }
      const { data: ok, error } = await sb.rpc('verify_section_password', { p_section: 'gate', p_password: pw });
      gateChecking = false;
      if (error) { gateError = error.message; renderGate(); return; }
      if (!ok) { gateError = 'Incorrect password.'; renderGate(); return; }
      gateUnlocked = true;
      sessionStorage.setItem('metosync_gate_unlocked', '1');
      init();
    } catch (err) {
      gateChecking = false;
      gateError = err.message || 'An unexpected error occurred.';
      renderGate();
    }
  };

  document.getElementById('gateSubmitBtn').onclick = submit;
  const pwInput = document.getElementById('gatePassword');
  pwInput.focus();
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
}

function render() {
  if (!gateUnlocked) { renderGate(); return; }
  if (registryChannel) { sb.removeChannel(registryChannel); registryChannel = null; }
  app().className = 'max-w-md mx-auto p-4';
  app().classList.toggle('platform-wide', sectionUnlocked === 'registry' || sectionUnlocked === 'owner');
  if (!state.session) return renderConnecting();
  if (!state.isAdmin) return renderNoAccess();
  if (sectionUnlocked) return renderSection(sectionUnlocked);
  renderLanding();
}

function renderConnecting() {
  app().innerHTML = `
    <div class="mt-card mt-fade-in p-6 mt-10 text-center">
      ${errorMsg
        ? `<p class="text-red-600 text-sm mb-3">${errorMsg}</p><button id="retryBtn" class="mt-btn-primary">Retry</button>`
        : `<p class="text-gray-400">Connecting…</p>`}
    </div>`;
  const retryBtn = document.getElementById('retryBtn');
  if (retryBtn) retryBtn.onclick = () => { errorMsg = ''; init(); };
}

function renderNoAccess() {
  app().innerHTML = `
    <div class="mt-card text-center p-6 mt-10">
      <p class="text-gray-600 mb-3">This account does not have platform-admin access.</p>
      <button id="logoutBtn" class="mt-btn-outline">Log out</button>
    </div>`;
  document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); state = { session: null, isAdmin: false, role: null }; render(); };
}

async function renderLanding() {
  const { data: info } = await sb.rpc('platform_my_login_info');
  const name = info ? info.full_name : '';
  const roleLabel = state.role === 'owner' ? 'Owner' : 'Staff';
  const lastLogin = info && info.last_sign_in_at ? new Date(info.last_sign_in_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + ' · ' + new Date(info.last_sign_in_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) : '—';

  const cards = [
    state.role === 'owner' ? {
      id: 'ownerBtn', tint: '#e8f7ef', accent: '#12805c', title: 'Owner Dashboard',
      desc: 'Access your dashboard, manage your organization and more.',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 21h16M5 21V10M19 21V10M3 10l9-6 9 6M7 10v4M12 10v4M17 10v4"/></svg>`
    } : null,
    {
      id: 'registryBtn', tint: '#eaf2fe', accent: '#1d4ed8', title: 'Registry',
      desc: 'Register new companies and manage company records.',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="4" width="12" height="17" rx="2"/><path stroke-linecap="round" d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1M9 10h6M9 14h6M9 18h3"/></svg>`
    },
    {
      id: 'accountsBtn', tint: '#fdf1de', accent: '#b45309', title: 'Accounts & Billing',
      desc: 'Manage accounts, subscriptions, invoices and payments.',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path stroke-linecap="round" d="M3 10h18"/><path stroke-linecap="round" d="M7 15h4"/></svg>`
    }
  ].filter(Boolean);

  app().innerHTML = `
    <div class="mt-fade-in bg-white rounded-3xl shadow-xl p-7 sm:p-9 max-w-md mx-auto mt-8">
      <div class="text-center mb-6">
        <img src="metosync-logo.png" class="h-16 mx-auto mb-5" alt="Metosync">
        <div class="w-12 h-12 rounded-full mx-auto mb-4 flex items-center justify-center" style="background: var(--mt-green-light); color: var(--mt-green-dark);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4"/></svg>
        </div>
        <p class="text-gray-500 text-sm mb-0.5">Welcome to</p>
        <h1 class="text-2xl font-bold mb-2"><span style="color: var(--mt-navy);">Metosync</span> <span style="color: var(--mt-green);">Tech Inc.</span></h1>
        <div class="flex items-center justify-center gap-3">
          <span class="h-px w-8" style="background: var(--mt-border);"></span>
          <span class="text-xs text-gray-400">Staff Sign in Here</span>
          <span class="h-px w-8" style="background: var(--mt-border);"></span>
        </div>
      </div>

      <div class="space-y-3 mb-6">
        ${cards.map(c => `
          <button type="button" data-card="${c.id}" class="w-full text-left rounded-2xl p-4 flex items-center gap-4 transition hover:brightness-95" style="background: ${c.tint};">
            <span class="w-12 h-12 rounded-full flex items-center justify-center shrink-0 bg-white" style="color: ${c.accent};">
              <span class="w-5 h-5 block">${c.icon}</span>
            </span>
            <span class="flex-1">
              <span class="block font-bold text-sm mb-0.5" style="color: ${c.accent};">${c.title}</span>
              <span class="block text-xs text-gray-500 leading-snug">${c.desc}</span>
            </span>
            <span class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 text-white" style="background: ${c.accent};">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
            </span>
          </button>
        `).join('')}
      </div>

      <div class="flex items-center justify-center gap-3 mb-4">
        <span class="h-px w-10" style="background: var(--mt-border);"></span>
        <span class="w-7 h-7 rounded-full flex items-center justify-center" style="background: var(--mt-green-light); color: var(--mt-green-dark);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5"><rect x="5" y="10" width="14" height="10" rx="2"/><path stroke-linecap="round" d="M8 10V7a4 4 0 018 0v3"/></svg>
        </span>
        <span class="h-px w-10" style="background: var(--mt-border);"></span>
      </div>
      <p class="text-center text-sm text-gray-600 mb-1">Signed in as <span class="font-bold" style="color: var(--mt-green-dark);">${name}</span></p>
      <p class="text-center text-xs text-gray-400 mb-4">(${roleLabel})</p>

      <button id="logoutBtn" type="button" class="w-full border rounded-xl px-4 py-3 flex items-center justify-center gap-2 text-sm font-semibold hover:bg-gray-50" style="border-color: var(--mt-border); color: var(--mt-navy);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7M7 4H5a2 2 0 00-2 2v12a2 2 0 002 2h2"/></svg>
        Log Out
      </button>
      <p class="text-center text-xs text-gray-400 mt-1">Last login: ${lastLogin}</p>
    </div>`;

  document.querySelectorAll('[data-card]').forEach(btn => {
    btn.onclick = () => {
      if (btn.dataset.card === 'ownerBtn') { promptSectionPassword('owner'); return; }
      if (btn.dataset.card === 'registryBtn') { promptSectionPassword('registry'); return; }
      if (btn.dataset.card === 'accountsBtn') { promptSectionPassword('accounts'); return; }
    };
  });
  document.getElementById('logoutBtn').onclick = async () => {
    await sb.auth.signOut();
    state = { session: null, isAdmin: false, role: null };
    render();
  };
}

async function promptSectionPassword(section, customError = '') {
  errorMsg = customError;
  const { data: isSet, error: checkErr } = await sb.rpc('section_password_is_set', { p_section: section });
  if (checkErr) {
    console.error('section_password_is_set error:', checkErr);
  }
  const sectionTitle = section === 'owner' ? 'Owner Dashboard' : section.charAt(0).toUpperCase() + section.slice(1);
  app().innerHTML = `
    <div class="mt-card mt-fade-in p-6 mt-10">
      <h1 class="text-lg font-bold text-center mb-4" style="color: var(--mt-green-dark);">${sectionTitle} — Password Required</h1>
      <div class="relative mb-3">
        <input id="sectionPw" type="password" autocomplete="off" placeholder="${isSet ? 'Enter password' : 'Set a new password'}" class="w-full border rounded-xl px-4 py-3 pr-10">
        <button type="button" onclick="toggleEye('sectionPw',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">👁</button>
      </div>
      <p id="sectionPwError" class="text-red-600 text-sm mb-3 ${errorMsg ? '' : 'hidden'}">${errorMsg}</p>
      <button id="submitPwBtn" class="w-full mt-btn-primary mb-2">${isSet ? 'Unlock' : 'Set & Continue'}</button>
      <button id="backBtn" class="w-full text-sm text-gray-500">← Back</button>
    </div>`;

  const errEl = document.getElementById('sectionPwError');
  const showErr = (msg) => {
    if (errEl) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }
  };

  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
  
  document.getElementById('submitPwBtn').onclick = async () => {
    const pw = document.getElementById('sectionPw').value;
    if (!pw) { showErr('Enter a password.'); return; }
    
    const submitBtn = document.getElementById('submitPwBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Verifying…';

    try {
      if (!isSet) {
        const { error } = await sb.rpc('set_section_password', { p_section: section, p_password: pw });
        if (error) {
          showErr(error.message);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Set & Continue';
          return;
        }
        sectionUnlocked = section;
        render();
        return;
      }
      
      const { data: ok, error } = await sb.rpc('verify_section_password', { p_section: section, p_password: pw });
      if (error) {
        showErr(error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Unlock';
        return;
      }
      if (!ok) {
        showErr('Incorrect password.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Unlock';
        return;
      }
      sectionUnlocked = section;
      render();
    } catch (err) {
      showErr(err.message || 'An unexpected error occurred.');
      submitBtn.disabled = false;
      submitBtn.textContent = isSet ? 'Unlock' : 'Set & Continue';
    }
  };

  const pwInput = document.getElementById('sectionPw');
  if (pwInput) {
    pwInput.focus();
    pwInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('submitPwBtn').click(); }
    });
  }
}

function metricValue(row, ...keys) {
  const key = keys.find(candidate => row && row[candidate] !== undefined && row[candidate] !== null);
  return key ? row[key] : null;
}

function companyLogoHtml(company, size = 'w-10 h-10') {
  return company.logo_url
    ? `<img src="${company.logo_url}" alt="${company.name || 'Company'} logo" class="${size} rounded-xl object-contain bg-white p-1 border" loading="lazy">`
    : `<div class="${size} rounded-full flex items-center justify-center text-white font-bold" style="background: var(--mt-green-dark);">${(company.name || '?').trim().charAt(0).toUpperCase() || '?'}</div>`;
}

function statsCardsHtml(stats) {
  const metrics = [
    [['companies', 'total_companies'], 'Companies', '#2563eb'],
    [['total_staff', 'staff'], 'Total Staff', '#0f766e'],
    [['sites', 'total_sites'], 'Sites', '#d97706'],
    [['new_this_month', 'new_companies_this_month'], 'New This Month', '#e11d48']
  ].filter(([keys]) => metricValue(stats, ...keys) !== null);
  return `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">${metrics.map(([keys, label, color]) => `<div class="mt-card p-3 text-center" style="border-top: 4px solid ${color};"><p class="text-2xl font-bold" style="color: ${color};">${metricValue(stats, ...keys)}</p><p class="text-xs text-gray-500">${label}</p></div>`).join('')}</div>`;
}

function companyCardHtml(company) {
  const companyId = company.id || company.company_id;
  const statusClass = company.status === 'active' ? 'active' : company.status === 'inactive' ? 'inactive' : 'pending';
  return `<div class="companyCard flex items-center gap-3 border rounded-xl p-3" data-name="${(company.name || '').toLowerCase()}" data-code="${(company.org_code || '').toLowerCase()}">

  const search = document.getElementById('companySearch');

function detailMetric(label, value) {
  return value === null ? '' : `<p class="text-xs">${label}: ${value}</p>`;
}

  const activityRows = (activity || []).map(item => `<tr class="border-b"><td class="py-2 px-3">${item.category || ''}</td><td class="py-2 px-3">${item.action || ''}</td><td class="py-2 px-3">${item.detail || ''}</td><td class="py-2 px-3 text-xs text-gray-400">${item.performed_at ? new Date(item.performed_at).toLocaleString() : ''}</td></tr>`).join('');

  const moderationHtml = ownerDashboard && state.role === 'owner' ? `<div class="mt-card p-3 mt-5"><p class="font-medium text-sm mb-2">Company Moderation</p><label class="block text-xs text-gray-500 mb-1" for="companyModerationReason">Reason (recorded on file)</label><input id="companyModerationReason" type="text" class="w-full border rounded-lg px-3 py-2 text-sm mb-3"><div class="flex flex-wrap gap-2">${company.status !== 'active' ? '<button id="reactivateCompanyBtn" type="button" class="mt-btn-primary">Reactivate</button>' : ''}${company.status !== 'closed' ? '<button id="closeCompanyBtn" type="button" class="mt-btn-outline" style="color:#4b5563;border-color:#9ca3af;">Close Company</button>' : ''}${company.status !== 'blocked' ? '<button id="blockCompanyBtn" type="button" class="mt-btn-danger-outline">Block Company</button>' : ''}</div><div class="border-t mt-3 pt-3"><button id="deleteCompanyBtn" type="button" class="mt-btn-danger-outline">Delete Permanently</button></div><p id="companyModerationError" class="text-red-600 text-sm mt-2"></p></div>` : '';
  const modal = document.createElement('div');
  modal.id = 'companyDetailModal'; modal.className = 'fixed inset-0 bg-black/40 z-50 p-4 overflow-y-auto';
  modal.innerHTML = `<div class="mt-card max-w-2xl mx-auto mt-8 p-5"><div class="flex justify-between items-start mb-4"><div class="flex items-center gap-3">${companyLogoHtml(company, 'w-12 h-12')}<div><h2 class="text-lg font-bold" style="color: var(--mt-green-dark);">${company.name || ''}</h2><p class="text-xs text-gray-400 font-mono">${company.org_code || ''}</p></div></div><button id="closeCompanyDetail" type="button" class="mt-btn-outline">Close</button></div>
    ${company.status !== undefined && company.status !== null ? `<p class="text-sm mb-4">Status: <span class="mt-badge ${company.status === 'active' ? 'active' : company.status === 'inactive' ? 'inactive' : 'pending'}">${company.status}</span></p>` : ''}

    ${servicePlanHtml}
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4"><div class="mt-card p-3"><p class="font-medium text-sm">Staff</p>${detailMetric('Total', metricValue(company, 'staff_total', 'total_staff'))}${detailMetric('Active', metricValue(company, 'staff_active'))}${detailMetric('On leave', metricValue(company, 'staff_on_leave'))}${detailMetric('Inactive', metricValue(company, 'staff_inactive'))}</div><div class="mt-card p-3"><p class="font-medium text-sm">Sites</p>${detailMetric('Total', metricValue(company, 'sites_total', 'total_sites'))}${detailMetric('With GPS', metricValue(company, 'sites_with_gps'))}${detailMetric('Without GPS', metricValue(company, 'sites_without_gps'))}</div><div class="mt-card p-3"><p class="font-medium text-sm">Attendance Last 30 Days</p>${detailMetric('Present', metricValue(company, 'attendance_present'))}${detailMetric('Late', metricValue(company, 'attendance_late'))}${detailMetric('Absent', metricValue(company, 'attendance_absent'))}</div></div>

    const moderationError = document.getElementById('companyModerationError');

      modal.remove();
      renderOwnerDashboard();
    };
    const reactivateButton = document.getElementById('reactivateCompanyBtn');
    const closeButton = document.getElementById('closeCompanyBtn');
    const blockButton = document.getElementById('blockCompanyBtn');
    if (reactivateButton) reactivateButton.onclick = () => runModerationAction('active');
    if (closeButton) closeButton.onclick = () => runModerationAction('closed');
    if (blockButton) blockButton.onclick = () => runModerationAction('blocked');
    document.getElementById('deleteCompanyBtn').onclick = async () => {
      if (!confirm(`Delete ${company.name}? This cannot be undone.`)) return;
      moderationError.textContent = '';
      const { error } = await sb.rpc('platform_delete_company', { p_company_id: companyId });
      if (error) { moderationError.textContent = error.message; return; }
      modal.remove();
      renderOwnerDashboard();
    };
  }
}

}

// Style map keyed by portfolio code. Unknown/new roles get a hashed fallback
// color and an initial-letter icon, so the grid stays fully data-driven.
const INVITE_ROLE_COLORS = {
  owner: '#DC2626', executive_director: '#7C3AED', administrator: '#0284C7', admin: '#0284C7',
  manager: '#0D9488', payroll_officer: '#059669', viewer: '#6B7280', stores_inventory: '#D97706',
  operations_manager: '#4F46E5', sales_marketing: '#DB2777', customer_service: '#0891B2',
  procurement: '#EA580C', compliance_legal: '#475569', training_development: '#8B5CF6',
  security_access: '#F97316', board_governance: '#1E3A8A', audit_internal_control: '#166534',
  strategy_planning: '#C026D3'
};
const INVITE_ROLE_FALLBACK_COLORS = ['#0d2a4d', '#0D9488', '#4F46E5', '#DB2777', '#D97706', '#0891B2', '#059669', '#7C3AED'];
const INVITE_ROLE_ICONS = {
  owner: '👑', executive_director: '🎯', administrator: '🛠️', admin: '🛠️', manager: '📋',
  payroll_officer: '💰', viewer: '👁️', stores_inventory: '📦', operations_manager: '⚙️',
  sales_marketing: '📈', customer_service: '💬', procurement: '🛒', compliance_legal: '⚖️',
  training_development: '🎓', security_access: '🔐', board_governance: '🏛️',
  audit_internal_control: '🔍', strategy_planning: '🧭'
};
let registryInviteRole = null;

function inviteRoleColor(code) {
  if (INVITE_ROLE_COLORS[code]) return INVITE_ROLE_COLORS[code];
  let h = 0;
  for (const ch of String(code || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return INVITE_ROLE_FALLBACK_COLORS[h % INVITE_ROLE_FALLBACK_COLORS.length];
}

function inviteRoleTint(hex) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, .12)`;
}

function inviteRoleTileHtml(portfolio, index, active) {
  const color = inviteRoleColor(portfolio.code);
  const icon = INVITE_ROLE_ICONS[portfolio.code] || escapeHtml((portfolio.display_name || portfolio.code || '?').charAt(0).toUpperCase());
  return `<button type="button" class="role-card ${active ? 'selected' : ''}" data-role="${escapeHtml(portfolio.code)}"
    style="--rc:${color};--rc-bg:${inviteRoleTint(color)};animation-delay:${index * 50}ms">
    <span class="role-check">✓</span>
    <div class="role-icon">${icon}</div>
    <div class="role-info">
      <h3 class="role-name">${escapeHtml(portfolio.display_name)}</h3>
      <p class="role-description">${escapeHtml(portfolio.description || '')}</p>
    </div>
    <div class="role-step">${String(index + 1).padStart(2, '0')}</div>
  </button>`;
}

  app().innerHTML = `<p class="text-gray-400 text-center mt-10">Loading Watchguard…</p>`;

        <div class="flex gap-2">
          <input id="watchguardInput" type="text" class="flex-1 border rounded-lg px-3 py-2" placeholder="Ask Watch Guard about the whole system…">
          <button id="watchguardSend" type="button" class="mt-btn-primary">Send</button>
        </div>
      </div>

  document.getElementById('backBtn').onclick = () => renderOwnerDashboard();

  const chatEl = document.getElementById('watchguardChat');

  const sendBtn = document.getElementById('watchguardSend');

  function addMessage(role, text) {
    chatEl.innerHTML += `<div class="${role === 'owner' ? 'text-right' : ''}"><span class="inline-block px-3 py-2 rounded-lg ${role === 'owner' ? 'bg-blue-100 text-blue-900' : 'bg-white border text-gray-800'}">${escapeHtml(text)}</span></div>`;

  }

  addMessage('guard', 'Hello. I am Watch Guard. I can read the whole system across all organizations. Ask me for "report", "events", "findings", "staff", "companies", or "help".');

  async function askWatchguard(text) {
    const msg = text.toLowerCase().trim();
    addMessage('owner', text);
    input.value = '';
    let reply = '';
    try {
      if (msg.includes('report') || msg.includes('status') || msg.includes('health')) {
        const { data } = await sb.rpc('platform_watch_guard_report');
        const r = data || {};
        reply = `System report: ${r.total_companies || 0} companies, ${r.total_staff || 0} staff, ${r.checked_in_today || 0} checked in today, ${r.suspicious_attendance || 0} suspicious, ${r.pending_devices || 0} pending devices.`;

        reply = `Showing ${logRows.length} recent events from the immutable log.`;
      } else if (msg.includes('finding')) {
        const critical = rows.filter(r => r.severity === 'critical').length;
        reply = `There are ${rows.length} open findings (${critical} critical).`;
      } else if (msg.includes('staff')) {
        reply = `Total staff across all companies: ${systemReport.total_staff || 0}.`;
      } else if (msg.includes('company')) {
        reply = `Total companies on the platform: ${systemReport.total_companies || 0}.`;
      } else if (msg.includes('help')) {
        reply = 'Try: report, events, findings, staff, companies. In training mode I answer from system-wide RPCs.';
      } else {
        reply = 'I am in training mode. I can answer from the whole-system report, events, findings, staff, and company counts.';
      }
    } catch (err) {
      reply = 'Sorry, I could not fetch that. ' + (err.message || '');
    }
    addMessage('guard', reply);
  }

  sendBtn.onclick = () => askWatchguard(input.value);
  input.onkeydown = (e) => { if (e.key === 'Enter') askWatchguard(input.value); };

  const authUser = state.session ? state.session.user : null;
  rows.forEach((r, i) => {
    const card = document.querySelector(`[data-finding="${r.id}"]`);
    const feedback = card.parentNode.querySelector('.findingFeedback');
    card.querySelector('.approveFindingBtn').onclick = async () => {
      if (!authUser) { feedback.innerHTML = '<span class="text-red-600">Not signed in.</span>'; return; }
      feedback.innerHTML = '<span class="text-blue-600">Approving…</span>';
      const { data, error } = await sb.rpc('watchguard_approve_action', { p_finding_id: r.id, p_user_id: authUser.id, p_reason: 'Approved from Watchguard dashboard' });
      feedback.innerHTML = error ? `<span class="text-red-600">${escapeHtml(error.message)}</span>` : `<span class="text-green-700">Approved. Event ${data?.event_id ? data.event_id.slice(0,8) : ''}</span>`;
      if (!error) card.style.display = 'none';
    };
    card.querySelector('.rejectFindingBtn').onclick = async () => {
      if (!authUser) { feedback.innerHTML = '<span class="text-red-600">Not signed in.</span>'; return; }
      feedback.innerHTML = '<span class="text-blue-600">Rejecting…</span>';
      const { data, error } = await sb.rpc('watchguard_reject_action', { p_finding_id: r.id, p_user_id: authUser.id, p_reason: 'Rejected from Watchguard dashboard' });
      feedback.innerHTML = error ? `<span class="text-red-600">${escapeHtml(error.message)}</span>` : `<span class="text-gray-700">Rejected. Event ${data?.event_id ? data.event_id.slice(0,8) : ''}</span>`;
      if (!error) card.style.display = 'none';
    };
  });
}

async function renderNotificationSettings() {
  app().innerHTML = `<p class="text-gray-400 text-center mt-10">Loading notification settings…</p>`;
  const [{ data: channels, error: chErr }, { data: dispatchUrl, error: cfgErr }] = await Promise.all([
    sb.rpc('watchguard_list_channels'),
    sb.rpc('watchguard_get_config', { p_key: 'dispatch_edge_function_url' })
  ]);
  if (chErr) { app().innerHTML = `<p class="text-red-600 text-center mt-10">${escapeHtml(chErr.message)}</p>`; return; }

  const rows = Array.isArray(channels) ? channels : [];
  const edgeUrl = dispatchUrl || '';

  app().className = 'platform-wide';
  app().innerHTML = `
    <div class="registry-page mt-fade-in">
      <div class="flex flex-wrap justify-between items-center gap-3 mt-6 mb-4">
        <h1 class="text-lg font-bold" style="color: var(--mt-green-dark);">Owner Dashboard → 🔔 Alert Settings</h1>
        <button id="backBtn" class="text-sm text-gray-500">← Back to Owner Dashboard</button>
      </div>
      <div class="mt-card p-5 mb-5">
        <h2 class="font-medium text-sm mb-3">Dispatch Edge Function URL</h2>
        <p class="text-xs text-gray-500 mb-2">Set this to your deployed <code>dispatch-notification</code> Edge Function URL (e.g. https://yourproject.supabase.co/functions/v1/dispatch-notification).</p>
        <div class="flex gap-2">
          <input id="dispatchUrlInput" type="url" class="flex-1 border rounded-lg px-3 py-2 text-sm" placeholder="https://.../functions/v1/dispatch-notification" value="${escapeHtml(edgeUrl)}">
          <button id="saveDispatchUrlBtn" type="button" class="mt-btn-primary text-sm">Save</button>
        </div>
        <p id="dispatchUrlFeedback" class="text-sm mt-2"></p>
      </div>
      <div class="mt-card p-5 mb-5">
        <h2 class="font-medium text-sm mb-3">Add Global Notification Channel</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <select id="channelType" class="border rounded-lg px-3 py-2 text-sm">
            <option value="email">Email</option>
            <option value="sms">SMS</option>
            <option value="webhook">Webhook</option>
          </select>
          <input id="channelEndpoint" type="text" class="border rounded-lg px-3 py-2 text-sm" placeholder="Email / phone / webhook URL">
          <input id="channelLabel" type="text" class="border rounded-lg px-3 py-2 text-sm" placeholder="Label (e.g. Finance Team)">
          <select id="channelEvents" class="border rounded-lg px-3 py-2 text-sm">
            <option value="critical">Critical only</option>
            <option value="critical,warning">Critical + Warning</option>
            <option value="critical,warning,info">All</option>
          </select>
        </div>
        <button id="addChannelBtn" type="button" class="mt-btn-primary text-sm">Add Channel</button>
        <p id="addChannelFeedback" class="text-sm mt-2"></p>
      </div>
      <div class="mt-card p-5">
        <h2 class="font-medium text-sm mb-3">Configured Channels</h2>
        <div class="space-y-2">
          ${rows.length ? rows.map(c => `<div class="flex justify-between items-center border rounded-xl p-3 ${c.enabled ? 'bg-white' : 'bg-gray-50'}">
            <div>
              <p class="font-semibold text-sm">${escapeHtml(c.label)} <span class="text-xs text-gray-500">(${c.channel_type})</span></p>
              <p class="text-xs text-gray-500">${escapeHtml(c.endpoint)} · ${(c.events_filter || []).join(', ')} · ${c.enabled ? 'Enabled' : 'Disabled'}</p>
            </div>
            <div class="flex gap-2">
              <button type="button" class="toggleChannelBtn mt-btn-outline text-xs" data-id="${c.id}" data-enabled="${c.enabled}">${c.enabled ? 'Disable' : 'Enable'}</button>
              <button type="button" class="deleteChannelBtn mt-btn-danger-outline text-xs" data-id="${c.id}">Delete</button>
            </div>
          </div>`).join('') : '<p class="text-gray-400 text-sm">No channels configured yet.</p>'}
        </div>
      </div>
    </div>`;

  document.getElementById('backBtn').onclick = () => renderOwnerDashboard();

  document.getElementById('saveDispatchUrlBtn').onclick = async () => {
    const url = document.getElementById('dispatchUrlInput').value.trim();
    const feedback = document.getElementById('dispatchUrlFeedback');
    feedback.innerHTML = '<span class="text-blue-600">Saving…</span>';
    const { error } = await sb.rpc('watchguard_set_config', { p_key: 'dispatch_edge_function_url', p_value: url });
    feedback.innerHTML = error ? `<span class="text-red-600">${escapeHtml(error.message)}</span>` : `<span class="text-green-700">Dispatch URL saved.</span>`;
  };

  document.getElementById('addChannelBtn').onclick = async () => {
    const feedback = document.getElementById('addChannelFeedback');
    const type = document.getElementById('channelType').value;
    const endpoint = document.getElementById('channelEndpoint').value.trim();
    const label = document.getElementById('channelLabel').value.trim();
    const events = document.getElementById('channelEvents').value.split(',');
    if (!endpoint || !label) { feedback.innerHTML = '<span class="text-red-600">Endpoint and label are required.</span>'; return; }
    feedback.innerHTML = '<span class="text-blue-600">Adding…</span>';
    const { error } = await sb.rpc('watchguard_create_channel', {
      p_company_id: null,
      p_channel_type: type,
      p_label: label,
      p_endpoint: endpoint,
      p_events_filter: events,
      p_is_global: true
    });
    if (error) { feedback.innerHTML = `<span class="text-red-600">${escapeHtml(error.message)}</span>`; return; }
    feedback.innerHTML = '<span class="text-green-700">Channel added.</span>';
    setTimeout(renderNotificationSettings, 600);
  };

  document.querySelectorAll('.toggleChannelBtn').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const enabled = btn.dataset.enabled === 'true';
      const row = rows.find(c => c.id === id);
      if (!row) return;
      await sb.rpc('watchguard_update_channel', {
        p_channel_id: id,
        p_label: row.label,
        p_endpoint: row.endpoint,
        p_metadata: row.metadata || {},
        p_events_filter: row.events_filter,
        p_enabled: !enabled
      });
      renderNotificationSettings();
    };
  });

  document.querySelectorAll('.deleteChannelBtn').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      await sb.rpc('watchguard_delete_channel', { p_channel_id: id });
      renderNotificationSettings();
    };
  });
}

async function renderPaymentProviders(backFn = renderOwnerDashboard, title = 'Owner Dashboard') {
  app().innerHTML = `<p class="text-gray-400 text-center mt-10">Loading payment providers…</p>`;
  const { data: providers, error } = await sb.rpc('watchguard_list_payment_providers');
  if (error) { app().innerHTML = `<p class="text-red-600 text-center mt-10">${escapeHtml(error.message)}</p>`; return; }
  const rows = Array.isArray(providers) ? providers : [];

  app().className = 'platform-wide';
  app().innerHTML = `
    <div class="registry-page mt-fade-in">
      <div class="flex flex-wrap justify-between items-center gap-3 mt-6 mb-4">
        <h1 class="text-lg font-bold" style="color: var(--mt-green-dark);">${escapeHtml(title)} → 💳 Payment Providers</h1>
        <button id="backBtn" class="text-sm text-gray-500">← Back${title !== 'Owner Dashboard' ? ' to ' + escapeHtml(title) : ''}</button>
      </div>
      <div class="mt-card p-5 mb-5">
        <h2 class="font-medium text-sm mb-3">Configure Paystack</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <input id="paystackPublicKey" type="text" class="border rounded-lg px-3 py-2 text-sm" placeholder="Public key (pk_test_...)">
          <input id="paystackSecretKey" type="text" class="border rounded-lg px-3 py-2 text-sm" placeholder="Secret key (sk_test_...)">
          <input id="paystackWebhookSecret" type="text" class="border rounded-lg px-3 py-2 text-sm" placeholder="Webhook secret">
          <input id="paystackCurrency" type="text" class="border rounded-lg px-3 py-2 text-sm" placeholder="Currency (GHS)" value="GHS">
          <select id="paystackLive" class="border rounded-lg px-3 py-2 text-sm">
            <option value="false" selected>Test mode</option>
            <option value="true">Live mode</option>
          </select>
        </div>
        <button id="savePaystackBtn" type="button" class="mt-btn-primary text-sm">Save Paystack Provider</button>
        <p id="paystackFeedback" class="text-sm mt-2"></p>
      </div>
      <div class="mt-card p-5">
        <h2 class="font-medium text-sm mb-3">Configured Providers</h2>
        <div class="space-y-2">
          ${rows.length ? rows.map(p => `<div class="flex justify-between items-center border rounded-xl p-3 bg-white">
            <div>
              <p class="font-semibold text-sm">${escapeHtml(p.provider)} <span class="text-xs text-gray-500">(${p.currency})</span></p>
              <p class="text-xs text-gray-500">Public: ${escapeHtml((p.public_key || '').slice(0, 12))}… · Mode: ${p.is_live ? 'Live' : 'Test'} · ${p.enabled ? 'Enabled' : 'Disabled'}</p>
            </div>
          </div>`).join('') : '<p class="text-gray-400 text-sm">No providers configured yet.</p>'}
        </div>
      </div>
    </div>`;

  document.getElementById('backBtn').onclick = () => backFn();

  document.getElementById('savePaystackBtn').onclick = async () => {
    const feedback = document.getElementById('paystackFeedback');
    const publicKey = document.getElementById('paystackPublicKey').value.trim();
    const secretKey = document.getElementById('paystackSecretKey').value.trim();
    const webhookSecret = document.getElementById('paystackWebhookSecret').value.trim();
    const currency = document.getElementById('paystackCurrency').value.trim() || 'GHS';
    const isLive = document.getElementById('paystackLive').value === 'true';
    if (!secretKey) { feedback.innerHTML = '<span class="text-red-600">Secret key is required.</span>'; return; }
    feedback.innerHTML = '<span class="text-blue-600">Saving…</span>';
    const { error } = await sb.rpc('watchguard_set_payment_provider', {
      p_company_id: null,
      p_provider: 'paystack',
      p_public_key: publicKey,
      p_secret_key: secretKey,
      p_webhook_secret: webhookSecret,
      p_currency: currency,
      p_is_live: isLive,
      p_enabled: true
    });
    feedback.innerHTML = error ? `<span class="text-red-600">${escapeHtml(error.message)}</span>` : `<span class="text-green-700">Paystack provider saved.</span>`;
    if (!error) setTimeout(() => renderPaymentProviders(backFn, title), 600);
  };
}

async function renderAccountsDashboard() {
  app().innerHTML = `<p class="text-gray-400 text-center mt-10">Loading accounts & billing…</p>`;
  const [{ data: stats, error: statsErr }, { data: payments, error: paymentsErr }] = await Promise.all([
    sb.rpc('watchguard_payment_stats'),
    sb.rpc('watchguard_list_payment_requests')
  ]);
  if (statsErr) { app().innerHTML = `<p class="text-red-600 text-center mt-10">${escapeHtml(statsErr.message)}</p>`; return; }

  const s = Array.isArray(stats) ? stats[0] || {} : stats || {};
  const rows = Array.isArray(payments) ? payments : [];

  app().className = 'platform-wide';
  app().innerHTML = `
    <div class="registry-page mt-fade-in">
      <div class="flex flex-wrap justify-between items-center gap-3 mt-6 mb-4">
        <h1 class="text-lg font-bold" style="color: var(--mt-green-dark);">Accounts & Billing</h1>
        <div class="flex items-center gap-3">
          <button id="paymentProvidersBtn" type="button" class="rounded-lg px-3 py-1.5 text-sm font-semibold text-white" style="background: #10b981;">💳 Providers</button>
          <button id="backBtn" class="text-sm text-gray-500">← Back</button>
        </div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5">
        <div class="rounded-xl border p-3 text-center" style="border-top: 4px solid #2563eb;"><p class="text-2xl font-bold text-blue-700">${s.total_requests || 0}</p><p class="text-xs text-gray-500">Requests</p></div>
        <div class="rounded-xl border p-3 text-center" style="border-top: 4px solid #16a34a;"><p class="text-2xl font-bold text-green-700">${s.completed_amount || 0}</p><p class="text-xs text-gray-500">Completed</p></div>
        <div class="rounded-xl border p-3 text-center" style="border-top: 4px solid #f59e0b;"><p class="text-2xl font-bold text-amber-700">${s.pending_amount || 0}</p><p class="text-xs text-gray-500">Pending</p></div>
        <div class="rounded-xl border p-3 text-center" style="border-top: 4px solid #dc2626;"><p class="text-2xl font-bold text-red-700">${s.failed_amount || 0}</p><p class="text-xs text-gray-500">Failed</p></div>
      </div>
      <div class="mt-card p-5">
        <h2 class="font-medium text-sm mb-3">All Payment Requests</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-xs mt-table">
            <thead><tr><th class="text-left">Reference</th><th class="text-left">Company</th><th class="text-left">Staff</th><th class="text-left">Amount</th><th class="text-left">Provider</th><th class="text-left">Status</th><th class="text-left">When</th></tr></thead>
            <tbody>${rows.map(r => `<tr class="border-b"><td class="py-2 px-3">${escapeHtml(r.reference)}</td><td class="py-2 px-3">${escapeHtml(r.company_name || '')}</td><td class="py-2 px-3">${escapeHtml(r.staff_name || '')}</td><td class="py-2 px-3">${r.amount} ${r.currency}</td><td class="py-2 px-3">${r.provider}</td><td class="py-2 px-3">${r.status}</td><td class="py-2 px-3">${new Date(r.created_at).toLocaleString()}</td></tr>`).join('')}</tbody>
          </table>
          ${rows.length ? '' : '<p class="text-gray-400 text-sm mt-3">No payment requests yet.</p>'}
        </div>
      </div>
    </div>`;

  document.getElementById('backBtn').onclick = () => { sectionUnlocked = null; render(); };
  document.getElementById('paymentProvidersBtn').onclick = () => renderPaymentProviders(renderAccountsDashboard, 'Accounts & Billing');
}
